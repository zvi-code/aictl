      - key: env.PLUGINS_DASHBOARD
        label: Plugins dashboard
        section: other
        type: string
        description: "Set to false to disable the plugins dashboard opened by bare /plugin, /mcp, and /skills, and to disable the non-interactive copilot plugin/copilot plugins commands."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L950
      - key: env.COPILOT_STRIP_REASONING_ON_RESUME
        label: Copilot strip reasoning on resume
        section: other
        type: string
        description: "Set to 0 or false to keep BYOK reasoning tokens across a session resume instead of stripping them. Defaults to stripping them."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L951
      - key: env.COPILOT_SUBAGENT_MAX_CONCURRENT
        label: Copilot subagent max concurrent
        section: other
        type: string
        description: "Maximum concurrent subagents per session (default: 32, range: 1\u2013256)."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L952
      - key: env.COPILOT_SUBAGENT_MAX_DEPTH
        label: Copilot subagent max depth
        section: other
        type: string
        description: "Maximum subagent nesting depth (default: 4, range: 1\u2013128)."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L953
      - key: env.GH_TOKEN
