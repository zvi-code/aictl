# Documented settings per tool: key, meaning, default. Read by aictl/monitoring/tool_config.py.
tools:
  copilot-cli:
    keys:
      - key: allowedUrls
        label: Allowed URLs
        section: autonomy
        type: list
        default: []
        description: URLs or domains the agent may reach without asking. Accepts exact URLs, domain names and wildcard subdomains such as *.github.com.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L719
      - key: deniedUrls
        label: Denied URLs
        section: autonomy
        type: list
        default: []
        description: URLs or domains that are always blocked. A deny rule wins over an allow rule.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L738
      - key: autoUpdate
        label: Auto update
        section: startup
        type: boolean
        default: true
        description: Download new CLI versions automatically. Off by default in CI.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L722
      - key: autoUpdatesChannel
        label: Auto updates channel
        section: startup
        type: enum
        default: stable
        values: [stable, prerelease]
        description: Which update channel to follow.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L723
      - key: banner
        label: Banner
        section: startup
        type: enum
        default: once
        values: [always, once, never]
        description: How often the animated banner shows at startup.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L724
      - key: bannerStyle
        label: Banner style
        section: startup
        type: enum
        default: mona
        values: [mona, classic]
        description: Which artwork the startup banner uses.
        doc: copilot help config
      - key: bashEnv
        label: Bash env
        section: other
        type: boolean
        default: false
        description: Honor BASH_ENV in bash shells the agent starts.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L725
      - key: beep
        label: Beep
        section: other
        type: boolean
        default: false
        description: Beep when the CLI needs your attention.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L726
      - key: beepOnSchedule
        label: Beep on schedule
        section: other
        type: boolean
        default: true
        description: Beep when a scheduled /every or /after run finishes. Only applies when beep is on.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L727
      - key: notifications
        label: Notifications
        section: other
        type: boolean
        default: false
        description: Show desktop notifications when attention is needed and when the agent finishes.
        doc: copilot help config
      - key: terminalNotifications
        label: Terminal notifications
        section: other
        type: boolean
        default: false
        description: Prefer terminal-owned notifications (OSC 777) over desktop notifications. Needs notifications on.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L804
      - key: powershellFlags
        label: Powershell flags
        section: other
        type: list
        default: [-NoProfile, -NoLogo]
        description: Flags passed to PowerShell at startup. Only used on Windows.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L763
      - key: compactPaste
        label: Compact paste
        section: other
        type: boolean
        default: true
        description: Collapse pastes longer than 10 lines into a short token.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L730
      - key: copyOnSelect
        label: Copy on select
        section: other
        type: boolean
        description: Copy selected text to the clipboard as soon as you release the mouse. On by default on macOS only.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L734
      - key: commandHistoryMaxSize
        label: Command history max size
        section: other
        type: number
        default: 50
        description: How many recent prompts are kept for history search. Allowed range is 1 to 1000.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L729
      - key: customAgents.defaultLocalOnly
        label: Default local only
        section: agents
        type: boolean
        default: false
        description: Use only local custom agents and skip organization or enterprise agents.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L735
      - key: proxyKerberosServicePrincipal
        label: Proxy kerberos service principal
        section: other
        type: string
        description: Service principal name for Kerberos proxy sign-in. Overrides the name the CLI derives from the proxy host.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L764
      - key: proxyUrl
        label: Proxy URL
        section: other
        type: string
        description: Proxy URL for HTTP and HTTPS requests. The HTTP_PROXY and HTTPS_PROXY variables win over it.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L765
      - key: experimental
        label: Experimental
        section: other
        type: boolean
        default: false
        description: Turn on experimental features.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L747
      - key: memory
        label: Memory
        section: context
        type: boolean
        default: true
        description: Let the agent store and recall facts across sessions. Prompt-mode runs start with memory off.
        doc: copilot help config
      - key: includeCoAuthoredBy
        label: Include co authored by
        section: context
        type: boolean
        default: true
        description: Tell the agent to add a Co-authored-by trailer to the git commits it makes.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L754
      - key: keepAlive
        label: Keep alive
        section: other
        type: enum
        default: 'off'
        values: ['off', 'on', busy]
        description: 'Stop the computer sleeping: never, always during the session, or only while the agent works.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L756
      - key: companyAnnouncements
        label: Company announcements
        section: startup
        type: list
        description: Messages shown in the startup banner. One is picked at random each launch.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L731
      - key: continueOnAutoMode
        label: Continue on auto mode
        section: model
        type: boolean
        default: false
        description: Switch to Auto model routing and retry when a rate limit is hit.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L733
      - key: stayInAutopilot
        label: Stay in autopilot
        section: autonomy
        type: boolean
        default: true
        description: Stay in autopilot after the agent finishes a task instead of returning to interactive mode.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L791
      - key: defaultMode
        label: Default mode
        section: autonomy
        type: enum
        default: interactive
        values: [interactive, plan, autopilot]
        description: Which mode new interactive sessions start in.
        danger_when: [autopilot]
        note: Autopilot lets the agent keep working without asking you between steps.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L736
      - key: defaultPermissionMode
        label: Default permission mode
        section: autonomy
        type: enum
        default: manual
        values: [manual, assisted, allow-all]
        description: Which permission mode new interactive sessions start in.
        danger_when: [allow-all, assisted]
        note: Allow-all approves every tool call, and Assisted lets a model approve requests for you.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L737
      - key: logLevel
        label: Log level
        section: telemetry
        type: enum
        default: default
        values: [none, error, warning, info, debug, all, default]
        description: How much the CLI writes to its log files.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L757
      - key: model
        label: Model
        section: model
        type: string
        description: The AI model the CLI uses. Set it to auto to let Copilot choose.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L759
      - key: contextTier
        label: Context tier
        section: model
        type: enum
        values: [default, long_context]
        description: Context window tier for models with tiered pricing.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L842
      - key: autoTier
        label: Auto tier
        section: model
        type: enum
        values: [efficiency, balance, intelligence]
        description: Routing profile used when the model is Auto.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L721
      - key: fusionTier
        label: Fusion tier
        section: model
        type: enum
        values: [standard, high, max]
        description: Copilot Fusion tier used when the model is Auto.
        doc: copilot help config
      - key: effortLevel
        label: Effort level
        section: model
        type: enum
        default: medium
        values: [low, medium, high, xhigh]
        description: Reasoning effort for models that support it.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L744
      - key: modelProviderId
        label: Model provider id
        section: model
        type: string
        description: Which provider owns the selected model. Tells apart catalogs that serve the same model name.
        doc: copilot help config
      - key: planModel
        label: Plan model
        section: model
        type: string
        description: Model used in plan mode. Falls back to the session model when unset.
        doc: copilot help config
      - key: planModelProviderId
        label: Plan model provider id
        section: model
        type: string
        description: Which provider owns the plan model.
        doc: copilot help config
      - key: planEffortLevel
        label: Plan effort level
        section: model
        type: string
        description: Reasoning effort used in plan mode. When unset, the plan model's own default is used.
        doc: copilot help config
      - key: planContextTier
        label: Plan context tier
        section: model
        type: string
        description: Context tier used in plan mode. When unset, the plan model's own default is used.
        doc: copilot help config
      - key: subagents.agents
        label: Agents
        section: agents
        type: map
        default: {}
        description: Per-subagent model, effort level and context tier, keyed by agent name. Each field may be inherit.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L795
      - key: subagents.agents["rubber-duck"].autoInvoke
        label: Auto invoke
        section: agents
        type: boolean
        default: false
        description: Let Copilot consult the rubber-duck agent on its own at planning checkpoints.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L796
      - key: subagents.disabledSubagents
        label: Disabled subagents
        section: agents
        type: list
        default: []
        description: Subagents that are found but turned off for delegation.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L797
      - key: subagents.maxConcurrency
        label: Max concurrency
        section: agents
        type: number
        description: Most subagents that may run at once. Only used with usage-based billing.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L798
      - key: subagents.maxDepth
        label: Max depth
        section: agents
        type: number
        default: 6
        description: How deep subagents may nest. Only used with usage-based billing.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L799
      - key: subagents.contextManagementTools
        label: Context management tools
        section: agents
        type: boolean
        description: Let subagents use the context management tools.
        doc: copilot help config
      - key: mouse
        label: Mouse
        section: other
        type: boolean
        default: true
        description: Capture mouse clicks and scrolling in the full-screen view.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L760
      - key: renderMarkdown
        label: Render markdown
        section: other
        type: boolean
        default: true
        description: Render Markdown in terminal output.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L768
      - key: inlineImages
        label: Inline images
        section: other
        type: boolean
        default: true
        description: Show images inline on terminals that support Kitty graphics.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L755
      - key: inlineImageLiveWindow
        label: Inline image live window
        section: other
        type: number
        default: 50
        description: How many inline images stay loaded in the terminal at once. 0 removes the cap.
        doc: copilot help config
      - key: scrollbar
        label: Scrollbar
        section: other
        type: boolean
        default: true
        description: Show the scrollbar in scrollable views.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L783
      - key: respectGitignore
        label: Respect gitignore
        section: other
        type: boolean
        default: true
        description: Leave gitignored files out of the @ file picker.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L770
      - key: screenReader
        label: Screen reader
        section: other
        type: boolean
        default: false
        description: Turn on screen reader optimizations.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L782
      - key: stream
        label: Stream
        section: other
        type: boolean
        default: true
        description: Stream responses as they arrive.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L793
      - key: streamerMode
        label: Streamer mode
        section: other
        type: boolean
        default: false
        description: Hide preview model names and quota details, for screen sharing.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L794
      - key: statusLine
        label: Status line
        section: other
        type: map
        description: A custom status line produced by a command you supply. The command gets session status as JSON on standard input.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L790
      - key: tabs.enabled
        label: Tabs enabled
        section: other
        type: boolean
        default: true
        description: Show the home screen tab bar.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L800
      - key: tabs.sort
        label: Sort
        section: other
        type: list
        default: []
        description: Order of the home screen tabs.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L802
      - key: tabs.hide
        label: Hide
        section: other
        type: list
        default: []
        description: Home screen tabs to hide. The Session tab cannot be hidden.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L801
      - key: terminalProgress
        label: Terminal progress
        section: other
        type: boolean
        default: true
        description: Show a progress indicator in the terminal title bar while the agent works.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L805
      - key: theme
        label: Theme
        section: other
        type: enum
        default: github
        values: [default, github, dim, high-contrast, colorblind]
        description: Color palette for terminal output.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L806
      - key: colorMode
        label: Color mode
        section: other
        type: enum
        default: github
        values: [default, github, dim, high-contrast, colorblind]
        description: Old name for theme.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L728
      - key: trustedFolders
        label: Trusted folders
        section: autonomy
        type: list
        description: Folders you trusted, so the CLI stops asking before working in them. Stored in config.json, not settings.json.
        doc: copilot help config
      - key: updateTerminalTitle
        label: Update terminal title
        section: startup
        type: boolean
        default: true
        description: Show what the agent is doing in the terminal window title.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L809
      - key: disableAllHooks
        label: Disable all hooks
        section: hooks
        type: boolean
        default: false
        description: Turn off every hook, from the repository and from your user settings.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L739
      - key: hooks
        label: Hooks
        section: hooks
        type: map
        description: Hook definitions keyed by event name. In user settings they are user hooks; in repository settings they are repository hooks.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L750
      - key: disabledHooks
        label: Disabled hooks
        section: hooks
        type: list
        description: Hooks that are found but not run, identified by content hash. Policy hooks cannot be turned off.
        doc: copilot help config
      - key: ide.autoConnect
        label: Auto connect
        section: other
        type: boolean
        default: true
        description: Connect to an IDE workspace automatically at startup.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L751
      - key: ide.openDiffOnEdit
        label: Open diff on edit
        section: other
        type: boolean
        default: true
        description: Open file edit diffs in the connected IDE for approval.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L752
      - key: ide.codeProduct
        label: Code product
        section: other
        type: string
        description: Which VS Code product /code opens when no matching window is running.
        doc: copilot help config
      - key: askUser
        label: Ask user
        section: autonomy
        type: boolean
        default: true
        description: Let the agent ask clarifying questions through a question form. Off means it only asks in its replies.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L720
      - key: showTipsOnStartup
        label: Show tips on startup
        section: startup
        type: boolean
        default: true
        description: Show a tip when the CLI starts.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L787
      - key: taskbarPresence
        label: Taskbar presence
        section: other
        type: boolean
        default: true
        description: Show live session status on the Windows taskbar.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L803
      - key: copyOnCodeBlockClick
        label: Copy on code block click
        section: other
        type: boolean
        default: false
        description: Copy a code block when you click it in a finished response. Needs mouse support.
        doc: copilot help config
      - key: worktreeBaseRef
        label: Worktree base ref
        section: agents
        type: enum
        default: head
        values: [head, defaultBranch]
        description: 'Starting point for new worktrees: the current checkout or the remote default branch.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L810
      - key: worktreePathTemplate
        label: Worktree path template
        section: agents
        type: string
        description: 'Where new worktrees are created. Fields: {repoPath}, {repo}, {branch}, {branchSlug}.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L811
      - key: builtInAgents.rubberDuck
        label: Rubber duck
        section: agents
        type: boolean
        description: Turn on the rubber-duck built-in agent.
        doc: copilot help config
      - key: builtInAgents.rubberDuckAutoInvoke
        label: Rubber duck auto invoke
        section: agents
        type: boolean
        description: Call the rubber-duck agent automatically at planning checkpoints.
        doc: copilot help config
      - key: imageGeneration
        label: Image generation
        section: other
        type: boolean
        default: true
        description: Let the agent generate and edit images when available.
        doc: copilot help config
      - key: imageGenerationWatermark
        label: Image generation watermark
        section: other
        type: boolean
        default: false
        description: Ask for a visible Made with AI label on generated images.
        doc: copilot help config
      - key: aiSecretDetection
        label: Ai secret detection
        section: autonomy
        type: boolean
        description: Run a secret detection model next to the LLM review in /security-review. It finds credentials with no recognizable format.
        doc: copilot help config
      - key: toolSearch
        label: Tool search
        section: other
        type: boolean
        description: Load tools on demand (deferred tool loading).
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L807
      - key: contextManagementTools
        label: Context management tools
        section: context
        type: boolean
        description: Let the agent use the context management tools such as session_history and new_context.
        doc: copilot help config
      - key: sessionManagementTools.enabled
        label: Session management tools enabled
        section: agents
        type: boolean
        default: false
        description: Let sessions find and talk to other local sessions through list, create, message, close and rename tools.
        doc: copilot help config
      - key: sessionManagementTools.scope
        label: Scope
        section: agents
        type: string
        description: Whether peer sessions are found across all sessions sharing this config directory or only in this process.
        doc: copilot help config
      - key: sessionManagementTools.list
        label: Session management tools list
        section: agents
        type: boolean
        description: Allow list_sessions to discover other opted-in sessions.
        doc: copilot help config
      - key: sessionManagementTools.create
        label: Create
        section: agents
        type: boolean
        description: Allow create_session to start a separate session.
        doc: copilot help config
      - key: sessionManagementTools.message
        label: Message
        section: agents
        type: boolean
        description: Allow send_session_message to deliver text to another session.
        doc: copilot help config
      - key: sessionManagementTools.close
        label: Close
        section: agents
        type: boolean
        description: Allow close_session to close sessions this session created.
        doc: copilot help config
      - key: connectors
        label: Connectors
        section: extensions
        type: boolean
        default: true
        description: Turn on Copilot Connectors when available.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L732
      - key: workflows.maxConcurrentRuns
        label: Max concurrent runs
        section: other
        type: number
        default: 4
        description: Most top-level workflow runs at once. Range 1 to 16.
        doc: copilot help config
      - key: workflows.logPhaseNames
        label: Log phase names
        section: other
        type: boolean
        default: true
        description: Write workflow phase names to the session transcript.
        doc: copilot help config
      - key: workflows.defaultLimits.maxConcurrentSubagents
        label: Max concurrent subagents
        section: agents
        type: number
        description: Fallback cap on subagents active at once in a workflow run. Values above 4096 are lowered to 4096.
        doc: copilot help config
      - key: workflows.defaultLimits.maxTotalSubagents
        label: Max total subagents
        section: agents
        type: number
        description: Fallback cap on subagents created over a workflow run.
        doc: copilot help config
      - key: workflows.defaultLimits.timeoutSeconds
        label: Timeout seconds
        section: other
        type: number
        description: Fallback active-time limit in seconds for a workflow run.
        doc: copilot help config
      - key: workflows.defaultLimits.maxAiCredits
        label: Max ai credits
        section: other
        type: number
        description: Fallback soft cap on AI credits for a workflow run.
        doc: copilot help config
      - key: assistedApprovalInstructions
        label: Assisted approval instructions
        section: autonomy
        type: string
        description: Your own instructions for the Assisted Permissions reviewer. Repository settings cannot set it.
        doc: copilot help config
      - key: shellShortcut
        label: Shell shortcut
        section: autonomy
        type: boolean
        default: true
        description: Let a lone $ at the prompt open an interactive shell in the session directory.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L784
        locked_floor: true
      - key: renderHexColors
        label: Render hex colors
        section: other
        type: boolean
        default: true
        description: Show six-digit hex color codes as color swatches.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L767
      - key: pinnedPrompts
