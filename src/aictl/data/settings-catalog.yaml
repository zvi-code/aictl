      - key: chat.agentHost.cloudSandbox.earlyPreparation
        label: Early preparation
        section: autonomy
        type: boolean
        default: false
        description: Prepare an eligible cloud environment while composing a new Cloud chat. This can allocate compute before the prompt is sent.
