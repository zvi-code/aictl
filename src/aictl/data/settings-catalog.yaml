  claude-desktop:
    keys:
      - key: preferences.sidebarMode
        label: Sidebar mode
        section: other
        type: string
        description: Which sidebar mode Claude Desktop shows.
        doc: ""
      - key: preferences.localAgentModeTrustedFolders
        label: Local agent mode trusted folders
        section: autonomy
        type: list
        description: Folders you trusted for Code (agent) mode, so Claude Desktop works in them without asking again.
        doc: ""
      - key: preferences.launchPreviewPersistSession
        label: Launch preview persist session
        section: other
        type: boolean
        description: Keep the live preview session going between launches in Code (agent) mode.
        doc: ""
      - key: preferences.coworkWebSearchEnabled
        label: Cowork web search enabled
        section: autonomy
        type: boolean
        description: Let Cowork (autonomous) mode search the web.
        doc: ""
      - key: preferences.coworkScheduledTasksEnabled
        label: Cowork scheduled tasks enabled
        section: autonomy
        type: boolean
        description: Let Cowork (autonomous) mode run scheduled tasks.
        doc: ""
      - key: preferences.allowAllBrowserActions
        label: Allow all browser actions
        section: autonomy
        type: boolean
        description: Let Cowork (autonomous) mode take every browser action without asking.
        danger_when: true
        note: Lets Cowork take every browser action without asking.
        doc: ""
      - key: preferences.keepAwakeEnabled
        label: Keep awake enabled
        section: startup
        type: boolean
        description: Keep the computer awake while Claude Desktop works.
        doc: ""
      - key: mcpServers
        label: MCP servers
        section: mcp
        type: map
        description: MCP servers Claude Desktop starts, keyed by server name.
        doc: ""
  codex-cli:
    keys:
      - key: model
        label: Model
        section: model
        type: string
        description: Model to use (e.g., gpt-6.1-sol).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L104
      - key: review_model
        label: Review model
        section: model
        type: string
        description: Optional model override used by /review (defaults to the current session model).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L109
      - key: model_provider
        label: Model provider
        section: model
        type: string
        default: openai
        description: 'Provider id from model_providers (default: openai).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L115
      - key: openai_base_url
        label: Openai base URL
        section: other
        type: string
        description: Base URL override for the built-in openai model provider.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L120
      - key: model_context_window
        label: Model context window
        section: context
        type: number
        description: Context window tokens available to the active model.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L126
      - key: model_auto_compact_token_limit
        label: Model auto compact token limit
        section: context
        type: number
        description: Token threshold that triggers automatic history compaction (unset uses model defaults).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L131
      - key: model_auto_compact_token_limit_scope
        label: Model auto compact token limit scope
        section: context
        type: enum
        values: [total, body_after_prefix]
        description: Controls whether the auto-compaction threshold counts the full active context (total, the default) or only growth after the carried compaction-window prefix (body_after_prefix).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L137
      - key: model_post_turn_compact_threshold_percent
        label: Model post turn compact threshold percent
        section: context
        type: number
        description: Compact history after a final response when active context reaches this percentage of the usable context window. Omit or set to 0 to disable turn-end compaction.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L143
      - key: model_catalog_json
        label: Model catalog json
        section: model
        type: string
        description: Optional path to a JSON model catalog loaded on startup. A selected $CODEX_HOME/profile-name.config.toml profile file can override this per profile.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L149
      - key: oss_provider
        label: Oss provider
        section: model
        type: enum
        values: [lmstudio, ollama]
        description: Default local provider used when running with --oss (defaults to prompting if unset).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L155
      - key: approval_policy
        label: Approval policy
        section: autonomy
        type: enum
        values: [on-request, never, granular]
        description: Controls when Codex pauses for approval before executing commands.
        danger_when: [never]
        note: Never asks you before running a command.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L161
      - key: approval_policy.granular.sandbox_approval
        label: Sandbox approval
        section: autonomy
        type: boolean
        description: When true, sandbox escalation approval prompts are allowed to surface.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L167
      - key: approval_policy.granular.rules
        label: Rules
        section: autonomy
        type: boolean
        description: When true, approvals triggered by execpolicy prompt rules are allowed to surface.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L173
      - key: approval_policy.granular.mcp_elicitations
        label: MCP elicitations
        section: autonomy
        type: boolean
        description: When true, MCP elicitation prompts are allowed to surface instead of being auto-rejected.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L179
      - key: approval_policy.granular.request_permissions
        label: Request permissions
        section: autonomy
        type: boolean
        description: When true, prompts from the request_permissions tool are allowed to surface.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L185
      - key: approval_policy.granular.skill_approval
        label: Skill approval
        section: autonomy
        type: boolean
        description: When true, skill-script approval prompts are allowed to surface.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L191
      - key: approvals_reviewer
        label: Approvals reviewer
        section: autonomy
        type: enum
        values: [user, auto_review]
        description: Who reviews eligible approval prompts under on-request or granular approval policies. Defaults to user; auto_review uses the reviewer subagent.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L197
      - key: auto_review.policy
        label: Policy
        section: autonomy
        type: string
        description: Local Markdown policy instructions for automatic review. Managed guardian_policy_config takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L203
      - key: auto_review.extra_policy
        label: Extra policy
        section: autonomy
        type: string
        description: Additional local Markdown policy for automatic review, included alongside the main policy. Managed guardian_extra_policy takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L209
      - key: allow_login_shell
        label: Allow login shell
        section: autonomy
        type: boolean
        description: Allow shell-based tools to use login-shell semantics. Defaults to true; when false, login = true requests are rejected and omitted login defaults to non-login shells.
        danger_when: true
        note: Lets the model start login shells.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L215
      - key: allow_symlinked_codex_home
        label: Allow symlinked codex home
        section: autonomy
        type: boolean
        description: On macOS, allow writable sandbox roots at or under $CODEX_HOME to follow symlinks. Codex reads this only from the execution host's $CODEX_HOME/config.toml at startup.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L221
      - key: sandbox_mode
        label: Sandbox mode
        section: autonomy
        type: enum
        values: [read-only, workspace-write, danger-full-access]
        description: Sandbox policy for filesystem and network access during command execution.
        danger_when: [danger-full-access]
        note: Removes the sandbox so commands can touch the whole machine.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L227
      - key: sandbox_workspace_write.network_access
        label: Network access
        section: autonomy
        type: boolean
        default: false
        description: Allow outbound network access inside the workspace-write sandbox.
        danger_when: true
        note: Lets sandboxed commands use the network.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L239
      - key: sandbox_workspace_write.exclude_tmpdir_env_var
        label: Exclude tmpdir env var
        section: autonomy
        type: boolean
        default: false
        description: Exclude $TMPDIR from writable roots in workspace-write mode.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L245
      - key: sandbox_workspace_write.exclude_slash_tmp
        label: Exclude slash tmp
        section: autonomy
        type: boolean
        default: false
        description: Exclude /tmp from writable roots in workspace-write mode.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L251
      - key: windows.sandbox
        label: Sandbox
        section: autonomy
        type: enum
        values: [mxc, elevated, unelevated]
        description: Native Windows sandbox implementation. Explicit mxc selection fails when MXC is unavailable or prohibited by managed requirements.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L257
      - key: browser_use.allow_history_access
        label: Allow history access
        section: autonomy
        type: boolean
        description: Set to false to restrict browser-history access. Managed requirements can enforce this restriction.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L263
      - key: browser_use.default_origin_policy
        label: Default origin policy
        section: autonomy
        type: map
        description: Fallback browser-origin restrictions. Supports access, uploads, downloads, and full_cdp_access, each set to allow or deny.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L269
      - key: browser_use.origins.<origin>
        label: Origins
        section: autonomy
        type: map
        description: Per-origin browser restrictions with the same fields as browser_use.default_origin_policy. Include an HTTP or HTTPS scheme and optional port; omit paths, queries, and fragments.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L275
      - key: computer_use.default_app_access
        label: Default app access
        section: autonomy
        type: enum
        values: [allow, deny]
        description: Fallback native-app access policy for Computer Use. App-specific entries can supply a policy; local configuration cannot relax managed restrictions.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L281
      - key: computer_use.macos.bundle_ids
        label: Bundle ids
        section: autonomy
        type: map
        description: Native macOS app access keyed by bundle identifier.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L287
      - key: computer_use.windows.aumids
        label: Aumids
        section: autonomy
        type: map
        description: Packaged Windows app access keyed by Application User Model ID (AUMID).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L292
      - key: computer_use.windows.exes
        label: Exes
        section: autonomy
        type: list
        description: Windows executable access rules. Each rule requires publisher_name, product_name, and access (allow or deny); binary_name is optional.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L298
      - key: computer_use.windows.always_allowed_app_ids
        label: Always allowed app ids
        section: autonomy
        type: list
        description: Windows app identifiers that Computer Use can open without prompting. Apps not in the list require approval; remove saved entries from the ChatGPT desktop app's Computer Use settings.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L304
      - key: notify
        label: Notify
        section: other
        type: list
        description: Command invoked for notifications; receives a JSON payload from Codex.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L310
      - key: check_for_update_on_startup
        label: Check for update on startup
        section: startup
        type: boolean
        description: Check for Codex updates on startup (set to false only when updates are centrally managed).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L316
      - key: feedback.enabled
        label: Feedback enabled
        section: telemetry
        type: boolean
        default: true
        description: 'Enable feedback submission via /feedback across local clients (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L322
      - key: analytics.enabled
        label: Analytics enabled
        section: telemetry
        type: boolean
        description: Enable or disable analytics for this machine or profile. Setting this to false disables the built-in Statsig metrics exporter.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L328
      - key: instructions
        label: Instructions
        section: context
        type: string
        description: Reserved for future use; prefer model_instructions_file or AGENTS.md.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L334
      - key: developer_instructions
        label: Developer instructions
        section: context
        type: string
        description: Additional developer instructions injected into the session (optional).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L340
      - key: log_dir
        label: Log dir
        section: telemetry
        type: string
        description: Directory where Codex writes log files; defaults to $CODEX_HOME/log. Setting this explicitly also enables the opt-in plaintext TUI log, codex-tui.log, in that directory.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L346
      - key: sqlite_home
        label: Sqlite home
        section: other
        type: string
        description: Directory where Codex stores the SQLite-backed state DB used by agent jobs and other resumable runtime state.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L352
      - key: compact_prompt
        label: Compact prompt
        section: context
        type: string
        description: Inline override for the history compaction prompt.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L358
      - key: model_instructions_file
        label: Model instructions file
        section: context
        type: string
        description: Replacement for built-in instructions instead of AGENTS.md.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L363
      - key: personality
        label: Personality
        section: other
        type: enum
        values: [none, friendly, pragmatic]
        description: Deprecated compatibility setting. friendly and pragmatic no longer select a style. none omits the built-in Personality section from model instructions; explicit instruction overrides are unchanged.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L369
      - key: service_tier
        label: Service tier
        section: model
        type: string
        description: Preferred service tier for new turns. Use fast or another tier advertised by the active model; fast maps to the request value priority.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L375
      - key: experimental_compact_prompt_file
        label: Experimental compact prompt file
        section: context
        type: string
        description: Load the compaction prompt override from a file (experimental).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L381
      - key: skills.bundled.enabled
        label: Bundled enabled
        section: extensions
        type: boolean
        default: true
        description: Load the system skills bundled with Codex. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L387
      - key: skills.include_instructions
        label: Include instructions
        section: extensions
        type: boolean
        description: Include the automatic skills instructions in the model context. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L393
      - key: skills.max_context_tokens
        label: Max context tokens
        section: extensions
        type: number
        description: Token budget for the available-skills catalog. Defaults to 2% of the model's context window.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L399
      - key: skills.config
        label: Config
        section: extensions
        type: list
        description: Enable or disable skills by name or path. If several rules match a skill, the last one wins.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L405
      - key: skills.config.<index>.path
        label: Config path
        section: extensions
        type: string
        description: Absolute path to one SKILL.md file.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L411
      - key: skills.config.<index>.name
        label: Config name
        section: extensions
        type: string
        description: Match every skill with this exact name. Specify either name or path for each entry.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L416
      - key: skills.config.<index>.enabled
        label: Config enabled
        section: extensions
        type: boolean
        description: Enable or disable the referenced skill.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L422
      - key: apps.<id>.enabled
        label: Apps enabled
        section: extensions
        type: boolean
        default: true
        description: 'Enable or disable a specific app/connector by id (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L427
      - key: apps._default.enabled
        label: Default enabled
        section: extensions
        type: boolean
        default: true
        description: Default app enabled state for all apps unless overridden per app.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L433
      - key: apps._default.destructive_enabled
        label: Destructive enabled
        section: extensions
        type: boolean
        description: Default allow/deny for app tools with destructive_hint = true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L439
      - key: apps._default.open_world_enabled
        label: Open world enabled
        section: extensions
        type: boolean
        description: Default allow/deny for app tools with open_world_hint = true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L445
      - key: apps._default.approvals_reviewer
        label: Approvals reviewer
        section: extensions
        type: enum
        values: [user, auto_review]
        description: Default reviewer for app tool approval prompts unless overridden per app. When omitted, apps inherit the top-level approvals_reviewer value.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L451
      - key: apps._default.default_tools_approval_mode
        label: Default tools approval mode
        section: extensions
        type: enum
        values: [auto, prompt, writes, approve]
        description: Default approval behavior for app tools without per-app or per-tool overrides.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L457
      - key: apps.<id>.destructive_enabled
        label: Destructive enabled
        section: extensions
        type: boolean
        description: Allow or block tools in this app that advertise destructive_hint = true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L463
      - key: apps.<id>.open_world_enabled
        label: Open world enabled
        section: extensions
        type: boolean
        description: Allow or block tools in this app that advertise open_world_hint = true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L469
      - key: apps.<id>.default_tools_enabled
        label: Default tools enabled
        section: extensions
        type: boolean
        description: Default enabled state for tools in this app unless a per-tool override exists.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L475
      - key: apps.<id>.approvals_reviewer
        label: Approvals reviewer
        section: extensions
        type: enum
        values: [user, auto_review]
        description: Reviewer for this app's tool approval prompts. Overrides apps._default.approvals_reviewer.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L481
      - key: apps.<id>.default_tools_approval_mode
        label: Default tools approval mode
        section: extensions
        type: enum
        values: [auto, prompt, writes, approve]
        description: Default approval behavior for tools in this app unless a per-tool override exists.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L487
      - key: apps.<id>.omit_tools_from
        label: Omit tools from
        section: extensions
        type: list
        description: Omit this app's tools from the direct, deferred, or code_mode surfaces. App and MCP server omissions apply together.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L493
      - key: apps.<id>.tools.<tool>.enabled
        label: Tools enabled
        section: extensions
        type: boolean
        description: Per-tool enabled override for an app tool (for example repos/list).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L499
      - key: apps.<id>.tools.<tool>.approval_mode
        label: Approval mode
        section: extensions
        type: enum
        values: [auto, prompt, writes, approve]
        description: Per-tool approval behavior override for a single app tool.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L505
      - key: features.apps
        label: Apps
        section: other
        type: boolean
        description: Enable app (connector) integrations (stable; on by default). App and connector traffic is not controlled by the sandboxed-command network proxy or its domain allowlist.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L522
      - key: features.hooks
        label: Hooks
        section: hooks
        type: boolean
        description: Enable lifecycle hooks loaded from hooks.json or inline [hooks] config. features.codex_hooks is a deprecated alias.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L528
      - key: features.code_mode.enabled
        label: Code mode enabled
        section: other
        type: boolean
        description: Enable code mode feature configuration. This feature is under development and off by default.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L534
      - key: features.code_mode.excluded_tool_namespaces
        label: Excluded tool namespaces
        section: other
        type: list
        description: Tool namespaces code mode excludes from nested code-mode tool guidance and executor exposure.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L540
      - key: features.code_mode.direct_only_tool_namespaces
        label: Direct only tool namespaces
        section: other
        type: list
        description: Tool namespaces code mode can use only through direct tool calls.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L546
      - key: features.context_management.experimental_mode
        label: Experimental mode
        section: context
        type: boolean
        description: Experimental context-management setting. The feature is not currently available.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L552
      - key: features.rollout_budget.enabled
        label: Rollout budget enabled
        section: other
        type: boolean
        description: Enable rollout budget tracking. This feature is under development and off by default.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L558
      - key: features.rollout_budget.limit_tokens
        label: Limit tokens
        section: other
        type: number
        description: Positive token limit for rollout budget tracking. Required when rollout budget is enabled.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L564
      - key: features.rollout_budget.reminder_at_remaining_tokens
        label: Reminder at remaining tokens
        section: other
        type: list
        description: Send a reminder as the remaining weighted token budget crosses each threshold. Supply the list when rollout budget tracking is enabled.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L570
      - key: features.rollout_budget.sampling_token_weight
        label: Sampling token weight
        section: other
        type: number
        description: Finite non-negative multiplier for sampled tokens in rollout budget accounting. Defaults to 1.0.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L576
      - key: features.rollout_budget.prefill_token_weight
        label: Prefill token weight
        section: other
        type: number
        description: Finite non-negative multiplier for prefill tokens in rollout budget accounting. Defaults to 1.0.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L582
      - key: hooks
        label: Hooks
        section: hooks
        type: map
        description: Lifecycle hooks configured inline in config.toml. Uses the same event schema as hooks.json; see the Hooks guide for examples and supported events.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L588
      - key: hooks.<Event>
        label: Hooks
        section: hooks
        type: list
        description: Matcher groups for hook events such as PreModelRequest, PostModelRequest, PreToolUse, PermissionRequest, PostToolUse, PreCompact, PostCompact, SessionStart, SessionEnd, SubagentStart, SubagentStop, UserPromptSubmit, Stop, or Interrupt.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L594
      - key: hooks.<Event>[].hooks
        label: Hooks
        section: hooks
        type: list
        description: Hook handlers for a matcher group. Command and MCP tool hooks are supported while prompt and agent hook handlers are parsed but skipped.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L600
      - key: hooks.<Event>[].hooks[].async
        label: Async
        section: hooks
        type: boolean
        description: Run a command hook in the background without delaying the triggering operation. Defaults to false; SessionEnd always runs synchronously.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L606
      - key: hooks.<Event>[].hooks[].additionalContextLimit
        label: Additional context limit
        section: hooks
        type: number
        description: Approximate per-handler token threshold for saving oversized additionalContext to disk and showing the model a shorter preview. Defaults to 2500; 0 passes the full context directly to the model.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L612
      - key: hooks.<Event>[].hooks[].commandWindows
        label: Command windows
        section: hooks
        type: string
        description: Windows-only command override for command hooks. The TOML alias command_windows is also accepted.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L618
      - key: features.memories
        label: Memories
        section: context
        type: boolean
        description: Enable Memories (off by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L624
      - key: mcp_optional_startup_grace_ms
        label: MCP optional startup grace ms
        section: mcp
        type: number
        description: Shared wait for optional MCP servers when building the initial tool catalog. Defaults to 1000.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L630
      - key: mcp_servers.<id>.command
        label: MCP servers command
        section: mcp
        type: string
        description: Launcher command for an MCP stdio server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L636
      - key: mcp_servers.<id>.args
        label: MCP servers args
        section: mcp
        type: list
        description: Arguments passed to the MCP stdio server command.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L641
      - key: mcp_servers.<id>.env
        label: MCP servers env
        section: mcp
        type: map
        description: Environment variables forwarded to the MCP stdio server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L646
      - key: mcp_servers.<id>.cwd
        label: Cwd
        section: mcp
        type: string
        description: Working directory for the MCP stdio server process.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L657
      - key: mcp_servers.<id>.url
        label: MCP servers URL
        section: mcp
        type: string
        description: Endpoint for an MCP streamable HTTP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L662
      - key: mcp_servers.<id>.auth
        label: Auth
        section: mcp
        type: enum
        values: [oauth, chatgpt]
        description: Authentication fallback for an MCP HTTP server after configured bearer tokens and authorization headers. oauth (default) uses stored MCP OAuth credentials when available. chatgpt uses the current ChatGPT session for the trusted first-party ChatGPT origin, then falls back to stored OAuth.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L667
      - key: mcp_servers.<id>.oauth.client_id
        label: Client id
        section: mcp
        type: string
        description: Pre-registered OAuth client ID used for authorization and token exchange with this MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L673
      - key: mcp_servers.<id>.oauth.client_secret
        label: Client secret
        section: mcp
        type: string
        description: OAuth client secret for token exchange with a pre-registered client. Requires a nonempty oauth.client_id; the secret must also be nonempty.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L679
      - key: mcp_servers.<id>.oauth.callback_url
        label: Callback URL
        section: mcp
        type: string
        description: Server-specific OAuth callback. Pre-registered clients reuse it when issuer identification is supported or the URL already ends in the server-specific callback ID.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L685
      - key: mcp_servers.<id>.oauth.callback_port
        label: Callback port
        section: mcp
        type: number
        description: Fixed OAuth callback listener port for this MCP server. Overrides mcp_oauth_callback_port.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L691
      - key: mcp_servers.<id>.bearer_token_env_var
        label: Bearer token env var
        section: mcp
        type: string
        description: Environment variable sourcing the bearer token for an MCP HTTP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L697
      - key: mcp_servers.<id>.http_headers
        label: Http headers
        section: mcp
        type: map
        description: Static HTTP headers included with each MCP HTTP request.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L703
      - key: mcp_servers.<id>.http_headers_helper
        label: Http headers helper
        section: mcp
        type: string
        description: Local command that prints a JSON object of HTTP header names and values. Supported only for locally connected HTTP MCP servers.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L708
      - key: mcp_servers.<id>.env_http_headers
        label: Env http headers
        section: mcp
        type: map
        description: HTTP headers populated from environment variables for an MCP HTTP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L714
      - key: mcp_servers.<id>.enabled
        label: MCP servers enabled
        section: mcp
        type: boolean
        description: Disable an MCP server without removing its configuration.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L720
      - key: mcp_servers.<id>.startup_readiness
        label: Startup readiness
        section: mcp
        type: enum
        values: [connection, catalog]
        description: Use a live connection to establish startup readiness (connection, the default), or let a valid cached tool catalog satisfy startup while the connection opens (catalog). Calling a tool still requires a live connection.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L731
      - key: mcp_servers.<id>.startup_timeout_sec
        label: Startup timeout sec
        section: mcp
        type: number
        description: Override the default 10s startup timeout for an MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L737
      - key: mcp_servers.<id>.startup_timeout_ms
        label: Startup timeout ms
        section: mcp
        type: number
        description: Alias for startup_timeout_sec in milliseconds.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L743
      - key: mcp_servers.<id>.tool_timeout_sec
        label: Tool timeout sec
        section: mcp
        type: number
        description: Override the default 60s per-tool timeout for an MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L748
      - key: mcp_servers.<id>.enabled_tools
        label: Enabled tools
        section: mcp
        type: list
        description: Allow list of tool names exposed by the MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L754
      - key: mcp_servers.<id>.disabled_tools
        label: Disabled tools
        section: mcp
        type: list
        description: Deny list applied after enabled_tools for the MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L759
      - key: mcp_servers.<id>.supports_parallel_tool_calls
        label: Supports parallel tool calls
        section: mcp
        type: boolean
        description: Mark every tool on this server as safe to run in parallel. Enable only when the server can handle concurrent calls to all its tools.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L765
      - key: mcp_servers.<id>.tool_input_schema_max_bytes
        label: Tool input schema max bytes
        section: mcp
        type: number
        description: Compact each ordinary MCP tool's input schema when it exceeds this many UTF-8 bytes. The default is 5,000 bytes.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L771
      - key: mcp_servers.<id>.omit_tools_from
        label: Omit tools from
        section: mcp
        type: list
        description: Omit this server’s tools from selected model-facing surfaces. Choose direct (initial tools), deferred (tool search), or code_mode (Code Mode scripts).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L777
      - key: mcp_servers.<id>.default_tools_approval_mode
        label: Default tools approval mode
        section: autonomy
        type: enum
        values: [auto, prompt, writes, approve]
        description: Default approval behavior for MCP tools on this server unless a per-tool override exists.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L783
      - key: mcp_servers.<id>.tools.<tool>.approval_mode
        label: Approval mode
        section: autonomy
        type: enum
        values: [auto, prompt, writes, approve]
        description: Per-tool approval behavior override for one MCP tool on this server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L789
      - key: mcp_servers.<id>.tools.<tool>.output_token_limit
        label: Output token limit
        section: mcp
        type: number
        description: Token budget for one MCP tool's output, before the standard 20% serialization allowance. Overrides the model's default output truncation budget for that tool.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L795
      - key: mcp_servers.<id>.scopes
        label: Scopes
        section: mcp
        type: list
        description: OAuth scopes to request at login. If omitted, Codex uses the initial authentication challenge's scopes, falling back to the protected resource's metadata.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L801
      - key: mcp_servers.<id>.oauth_resource
        label: Oauth resource
        section: mcp
        type: string
        description: Optional RFC 8707 OAuth resource parameter to include during MCP login.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L807
      - key: mcp_servers.<id>.environment_id
        label: Environment id
        section: mcp
        type: string
        description: Execution environment for the MCP server. Defaults to local.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L813
      - key: agents
        label: Agents
        section: agents
        type: map
        description: Multi-agent settings and custom role declarations. Scalar setting names are reserved and can't be used as custom role names.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L819
      - key: agents.enabled
        label: Agents enabled
        section: agents
        type: boolean
        default: true
        description: 'Enable or disable multi-agent tools (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L825
      - key: agents.max_concurrent_threads_per_session
        label: Max concurrent threads per session
        section: agents
        type: number
        description: Maximum number of spawned-agent threads that can be open concurrently, excluding the primary thread. When unset, Codex chooses the default.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L830
      - key: agents.max_threads
        label: Max threads
        section: agents
        type: number
        description: Legacy alias for agents.max_concurrent_threads_per_session.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L836
      - key: agents.default_subagent_model
        label: Default subagent model
        section: agents
        type: string
        description: Default model for spawned agents. An explicit spawn model takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L842
      - key: agents.default_subagent_reasoning_effort
        label: Default subagent reasoning effort
        section: agents
        type: string
        description: Default reasoning effort for spawned agents. An explicit spawn effort takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L848
      - key: agents.interrupt_message
        label: Interrupt message
        section: agents
        type: boolean
        default: true
        description: 'Record a model-visible message when an agent turn is interrupted (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L854
      - key: agents.<name>.description
        label: Description
        section: agents
        type: string
        description: Role guidance shown to Codex when choosing and spawning that agent type.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L860
      - key: agents.<name>.config_file
        label: Config file
        section: agents
        type: string
        description: Path to a TOML config layer for that role; relative paths resolve from the config file that declares the role.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L866
      - key: memories.version
        label: Version
        section: context
        type: enum
        values: [v1, v2]
        description: Select the local memory store. With memories enabled, Codex defaults to v2 for a fresh home and v1 if $CODEX_HOME/memories/ exists.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L872
      - key: memories.dual_write
        label: Dual write
        section: context
        type: boolean
        description: With v1 selected, set to true to generate both stores while continuing to read v1. With v2 selected, Codex writes only v2.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L878
      - key: memories.generate_memories
        label: Generate memories
        section: context
        type: boolean
        description: When false, newly created threads are not stored as memory-generation inputs. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L884
      - key: memories.use_memories
        label: Use memories
        section: context
        type: boolean
        description: When false, Codex skips injecting existing memories into future sessions. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L890
      - key: memories.disable_on_external_context
        label: Disable on external context
        section: context
        type: boolean
        description: When true, threads that use external context such as MCP tool calls, web search, or tool search are kept out of memory generation. Defaults to false.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L896
      - key: memories.max_raw_memories_for_consolidation
        label: Max raw memories for consolidation
        section: context
        type: number
        description: Maximum recent raw memories retained for global consolidation. Defaults to 256 and is capped at 4096.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L902
      - key: memories.max_unused_days
        label: Max unused days
        section: context
        type: number
        description: Maximum days since a memory was last used before it becomes ineligible for consolidation. Defaults to 30 and is clamped to 0-365.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L908
      - key: memories.max_rollout_age_days
        label: Max rollout age days
        section: context
        type: number
        description: Maximum age of threads considered for memory generation. Defaults to 30 and is clamped to 0-90.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L914
      - key: memories.max_rollouts_per_startup
        label: Max rollouts per startup
        section: context
        type: number
        description: Maximum rollout candidates processed per startup pass. Defaults to 16 and is capped at 128.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L920
      - key: memories.min_rollout_idle_hours
        label: Min rollout idle hours
        section: context
        type: number
        description: Minimum idle time before a thread is considered for memory generation. Defaults to 6 and is clamped to 1-48.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L926
      - key: memories.min_rate_limit_remaining_percent
        label: Min rate limit remaining percent
        section: context
        type: number
        description: Minimum remaining percentage required in Codex rate-limit windows before memory generation starts. Defaults to 25 and is clamped to 0-100.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L932
      - key: memories.extract_model
        label: Extract model
        section: context
        type: string
        description: Optional model override for per-thread memory extraction.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L938
      - key: memories.consolidation_model
        label: Consolidation model
        section: context
        type: string
        description: Optional model override for global memory consolidation.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L943
      - key: memories.consolidation_service_tier
        label: Consolidation service tier
        section: context
        type: string
        description: Service tier for global memory consolidation. Defaults to default (Standard).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L948
      - key: features.prefer_mxc
        label: Prefer mxc
        section: other
        type: boolean
        description: Prefer MXC for local Windows execution when native capabilities and policy allow it; otherwise retain the configured legacy sandbox and setup. Disabled by default in the standalone CLI; the desktop app can enable it through rollout configuration.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L954
      - key: features.unified_exec
        label: Unified exec
        section: other
        type: boolean
        description: Use resumable command execution (stable; enabled on all platforms). User opt-outs are ignored.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L960
      - key: features.view_image
        label: View image
        section: other
        type: boolean
        description: Enable the built-in view_image tool for opening local images. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L966
      - key: features.shell_snapshot
        label: Shell snapshot
        section: other
        type: boolean
        description: Snapshot shell environment to speed up repeated commands (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L972
      - key: features.multi_agent
        label: Multi agent
        section: agents
        type: boolean
        description: Enable multi-agent collaboration tools (spawn_agent, send_input, resume_agent, wait_agent, and close_agent) (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L978
      - key: features.goals
        label: Goals
        section: other
        type: boolean
        description: Enable persisted goals and automatic continuation (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L984
      - key: goals.max_goal_token_budget
        label: Max goal token budget
        section: other
        type: number
        description: Set the default token budget for new goals and the largest budget a goal can request. Omit to leave goals without a configured limit.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L990
      - key: features.remote_plugin
        label: Remote plugin
        section: extensions
        type: boolean
        description: Enable the remote plugin catalog (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L996
      - key: features.network_proxy
        label: Network proxy
        section: autonomy
        type: enum
        values: [boolean, table]
        description: Start the network proxy for sandboxed commands (experimental; off by default). Required to enforce permission-profile domain rules unless enabled administrator-managed network_proxy requirements start the proxy.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1007
      - key: features.network_proxy.enabled
        label: Network proxy enabled
        section: autonomy
        type: boolean
        description: Start the sandboxed-command network proxy when command network access is enabled. Defaults to false; permission-profile domain rules are not enforced while the proxy is off.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1013
      - key: features.network_proxy.domains
        label: Domains
        section: autonomy
        type: map
        description: Domain policy for sandboxed networking. Unset by default, which means no external destinations are allowed until you add allow rules.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1019
      - key: features.network_proxy.unix_sockets
        label: Unix sockets
        section: autonomy
        type: map
        description: Unix socket policy for sandboxed networking. Unset by default; add allow entries for permitted sockets.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1025
      - key: features.network_proxy.allow_local_binding
        label: Allow local binding
        section: autonomy
        type: boolean
        description: Allow broader local/private-network access. Defaults to false; exact local IP literal or localhost allow rules can still permit specific local targets.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1031
      - key: features.network_proxy.enable_socks5
        label: Enable socks5
        section: autonomy
        type: boolean
        description: Expose SOCKS5 support. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1037
      - key: features.network_proxy.enable_socks5_udp
        label: Enable socks5 udp
        section: autonomy
        type: boolean
        description: Allow UDP over SOCKS5. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1042
      - key: features.network_proxy.allow_upstream_proxy
        label: Allow upstream proxy
        section: autonomy
        type: boolean
        description: Allow chaining through an upstream proxy from the environment. Defaults to true.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1047
      - key: features.network_proxy.dangerously_allow_non_loopback_proxy
        label: Dangerously allow non loopback proxy
        section: autonomy
        type: boolean
        description: Permit non-loopback listener addresses. Defaults to false; enabling it can expose proxy listeners beyond localhost.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1053
      - key: features.network_proxy.dangerously_allow_all_unix_sockets
        label: Dangerously allow all unix sockets
        section: autonomy
        type: boolean
        description: Permit arbitrary Unix socket destinations instead of allowlist-only access. Defaults to false; use only in tightly controlled environments.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1059
      - key: features.web_search
        label: Web search
        section: other
        type: boolean
        description: Deprecated legacy toggle; prefer the top-level web_search setting.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1077
      - key: features.shell_tool
        label: Shell tool
        section: other
        type: boolean
        description: Enable command execution tools (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1095
      - key: features.enable_request_compression
        label: Enable request compression
        section: other
        type: boolean
        description: Compress streaming request bodies with zstd when supported (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1100
      - key: features.skill_mcp_dependency_install
        label: Skill MCP dependency install
        section: mcp
        type: boolean
        description: Allow prompting and installing missing MCP dependencies for skills (stable; on by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1106
      - key: features.fast_mode
        label: Fast mode
        section: other
        type: boolean
        description: Enable Fast mode controls advertised by the active model (stable; on by default), independently of features.ultrafast_mode. Availability still depends on the model and account.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1112
      - key: features.ultrafast_mode
        label: Ultrafast mode
        section: other
        type: boolean
        description: Enable Ultrafast mode controls (stable; on by default), independently of features.fast_mode. Availability still depends on the model and account.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1118
      - key: features.prevent_idle_sleep
        label: Prevent idle sleep
        section: other
        type: boolean
        description: Prevent the machine from sleeping while a turn is actively running (experimental; off by default).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1124
      - key: suppress_unstable_features_warning
        label: Suppress unstable features warning
        section: other
        type: boolean
        description: Suppress the warning that appears when under-development feature flags are enabled.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1130
      - key: model_providers.<id>
        label: Model providers
        section: model
        type: map
        description: Custom provider definition. Built-in provider IDs (openai, ollama, and lmstudio) are reserved and cannot be overridden.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1136
      - key: model_providers.<id>.name
        label: Model providers name
        section: model
        type: string
        default: ""
        description: Display name for a custom model provider.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1142
      - key: model_providers.<id>.base_url
        label: Base URL
        section: model
        type: string
        description: API base URL for the model provider.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1147
      - key: model_providers.<id>.model_catalog_url
        label: Model catalog URL
        section: model
        type: string
        description: Full URL for a Codex-native model catalog. Omit to keep the provider's default model discovery.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1152
      - key: model_providers.<id>.capabilities.external_web_access
        label: External web access
        section: model
        type: boolean
        description: Whether the provider's hosted web search can access the live web. Omit to keep provider defaults; model and turn settings may restrict access further.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1158
      - key: model_providers.<id>.capabilities.remote_compaction
        label: Remote compaction
        section: model
        type: enum
        values: [unsupported, v2]
        description: Provider compaction protocol. unsupported uses local compaction; v2 sends compaction triggers through Responses. Omit to keep provider defaults; model and turn settings may restrict support further.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1164
      - key: model_providers.<id>.env_key
        label: Env key
        section: model
        type: string
        description: Environment variable supplying the provider API key.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1170
      - key: model_providers.<id>.env_key_instructions
        label: Env key instructions
        section: model
        type: string
        description: Optional setup guidance for the provider API key.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1175
      - key: model_providers.<id>.experimental_bearer_token
        label: Experimental bearer token
        section: model
        type: string
        description: Direct bearer token for the provider (discouraged; use env_key).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1180
      - key: model_providers.<id>.requires_openai_auth
        label: Requires openai auth
        section: model
        type: boolean
        default: false
        description: The provider uses OpenAI authentication (defaults to false).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1186
      - key: model_providers.<id>.wire_api
        label: Wire API
        section: model
        type: enum
        default: responses
        values: [responses]
        description: Protocol used by the provider. responses is the only supported value, and it is the default when omitted.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1192
      - key: model_providers.<id>.query_params
        label: Query params
        section: model
        type: map
        description: Extra query parameters appended to provider requests.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1198
      - key: model_providers.<id>.http_headers
        label: Http headers
        section: model
        type: map
        description: Static HTTP headers added to provider requests.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1203
      - key: model_providers.<id>.env_http_headers
        label: Env http headers
        section: model
        type: map
        description: HTTP headers populated from environment variables when present.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1208
      - key: model_providers.<id>.request_max_retries
        label: Request max retries
        section: model
        type: number
        default: 4
        description: 'Retry count for HTTP requests to the provider (default: 4).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1214
      - key: model_providers.<id>.stream_max_retries
        label: Stream max retries
        section: model
        type: number
        default: 5
        description: 'Retry count for SSE streaming interruptions (default: 5).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1220
      - key: model_providers.<id>.stream_idle_timeout_ms
        label: Stream idle timeout ms
        section: model
        type: number
        default: 300000
        description: 'Idle timeout for SSE streams in milliseconds (default: 300000).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1225
      - key: model_providers.<id>.supports_websockets
        label: Supports websockets
        section: model
        type: boolean
        default: false
        description: Whether that provider supports the Responses API WebSocket transport.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1231
      - key: model_providers.<id>.supports_standalone_web_search
        label: Supports standalone web search
        section: model
        type: boolean
        default: false
        description: 'Advertise support for a compatible standalone web search endpoint (default: false). Standalone search remains under development and off by default; provider compatibility alone doesn''t enable it.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1237
      - key: model_providers.<id>.auth
        label: Auth
        section: model
        type: map
        description: Command-backed bearer token configuration for a custom provider. Do not combine with env_key, experimental_bearer_token, or requires_openai_auth.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1243
      - key: model_providers.<id>.auth.command
        label: Auth command
        section: model
        type: string
        description: Command to run when Codex needs a bearer token. The command must print the token to stdout.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1249
      - key: model_providers.<id>.auth.args
        label: Auth args
        section: model
        type: list
        description: Arguments passed to the token command.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1255
      - key: model_providers.<id>.auth.timeout_ms
        label: Timeout ms
        section: model
        type: number
        default: 5000
        description: 'Maximum token command runtime in milliseconds (default: 5000).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1260
      - key: model_providers.<id>.auth.refresh_interval_ms
        label: Refresh interval ms
        section: model
        type: number
        default: 300000
        description: 'How often Codex proactively refreshes the token in milliseconds (default: 300000). Set to 0 to refresh only after an authentication retry.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1266
      - key: model_providers.<id>.auth.cwd
        label: Cwd
        section: model
        type: string
        description: Working directory for the token command.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1272
      - key: model_providers.gcp.base_url
        label: Base URL
        section: model
        type: string
        description: Override the built-in Google Cloud Vertex AI endpoint. Otherwise, Codex builds it from the project ID and location.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1277
      - key: model_providers.gcp.project_id
        label: Project id
        section: model
        type: string
        description: Google Cloud project ID for the Vertex AI endpoint. Takes precedence over GOOGLE_CLOUD_PROJECT.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1283
      - key: model_providers.gcp.location
        label: Location
        section: model
        type: string
        description: Google Cloud location for the Vertex AI endpoint. Takes precedence over GOOGLE_CLOUD_LOCATION.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1289
      - key: model_providers.gcp.credential_file
        label: Credential file
        section: model
        type: string
        description: Path to a Google Application Default Credentials (ADC) file. Overrides GOOGLE_APPLICATION_CREDENTIALS only for the provider\u2019s authentication command.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1295
      - key: model_providers.amazon-bedrock.aws.profile
        label: Profile
        section: model
        type: string
        description: AWS profile name used by the built-in amazon-bedrock provider.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1301
      - key: model_providers.amazon-bedrock.aws.region
        label: Region
        section: model
        type: string
        description: AWS region used by the built-in amazon-bedrock provider.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1307
      - key: model_reasoning_effort
        label: Model reasoning effort
        section: model
        type: string
        description: Reasoning effort advertised by the selected model, such as low, medium, high, xhigh, max, or ultra. Available levels depend on the model and client.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1312
      - key: plan_mode_reasoning_effort
        label: Plan mode reasoning effort
        section: model
        type: string
        description: Plan-mode-specific reasoning override using a level supported by the selected model. When unset, Plan mode uses its built-in preset default.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1318
      - key: model_reasoning_summary
        label: Model reasoning summary
        section: model
        type: enum
        values: [auto, concise, detailed, none]
        description: Select reasoning summary detail or disable summaries entirely.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1324
      - key: model_verbosity
        label: Model verbosity
        section: model
        type: enum
        values: [low, medium, high]
        description: Optional GPT-5 Responses API verbosity override; when unset, the selected model/preset default is used.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1330
      - key: shell_environment_policy.inherit
        label: Inherit
        section: autonomy
        type: enum
        values: [all, core, none]
        description: Baseline environment inheritance when spawning subprocesses.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1336
      - key: shell_environment_policy.ignore_default_excludes
        label: Ignore default excludes
        section: autonomy
        type: boolean
        default: true
        description: 'Keep variables containing KEY, SECRET, or TOKEN before other filters run (default: true). Set to false to apply automatic secret-name exclusions.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1342
      - key: shell_environment_policy.filters
        label: Filters
        section: autonomy
        type: map
        description: Canonical case-insensitive environment-variable pattern filters. Include entries create an allowlist and can't restore excluded values.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1348
      - key: shell_environment_policy.exclude
        label: Exclude
        section: autonomy
        type: list
        description: Legacy environment-variable exclusion patterns. Use shell_environment_policy.filters for new configuration; don't combine both forms in the same layer.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1354
      - key: shell_environment_policy.include_only
        label: Include only
        section: autonomy
        type: list
        description: Legacy allowlist of environment-variable patterns. Use shell_environment_policy.filters for new configuration; don't combine both forms in the same layer.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1360
      - key: shell_environment_policy.set
        label: Set
        section: autonomy
        type: map
        description: Explicit environment values injected after exclusions; include filters can still remove them.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1366
      - key: shell_environment_policy.experimental_use_profile
        label: Experimental use profile
        section: autonomy
        type: boolean
        description: Use the user shell profile when spawning subprocesses.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1372
      - key: project_root_markers
        label: Project root markers
        section: context
        type: list
        description: List of project root marker filenames; used when searching parent directories for the project root.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1377
      - key: project_doc_max_bytes
        label: Project doc max bytes
        section: context
        type: number
        default: 32768
        description: Maximum bytes read from AGENTS.md when building project instructions.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1383
      - key: project_doc_fallback_filenames
        label: Project doc fallback filenames
        section: context
        type: list
        description: Additional filenames to try when AGENTS.md is missing.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1389
      - key: history.persistence
        label: Persistence
        section: telemetry
        type: enum
        default: save-all
        values: [save-all, none]
        description: Control whether Codex saves session transcripts to history.jsonl.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1394
      - key: tool_output_token_limit
        label: Tool output token limit
        section: other
        type: number
        description: Token budget for storing individual tool/function outputs in history.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1400
      - key: thread_unload_delay_secs
        label: Thread unload delay secs
        section: other
        type: number
        description: Seconds the app server waits before unloading an inactive thread with no subscribers. Set to 0 to unload it as soon as it meets both conditions.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1406
      - key: background_terminal_max_timeout
        label: Background terminal max timeout
        section: other
        type: number
        description: 'Maximum poll window in milliseconds for empty write_stdin polls (background terminal polling). Default: 300000 (5 minutes).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1412
      - key: history.max_bytes
        label: Max bytes
        section: telemetry
        type: number
        description: If set, caps the history file size in bytes by dropping oldest entries.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1418
      - key: file_opener
        label: File opener
        section: other
        type: enum
        default: vscode
        values: [vscode, vscode-insiders, windsurf, cursor, none]
        description: 'URI scheme used to open citations from Codex output (default: vscode).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1424
      - key: otel.environment
        label: Environment
        section: telemetry
        type: string
        default: dev
        description: 'Environment tag applied to emitted OpenTelemetry events (default: dev).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1430
      - key: otel.exporter
        label: Exporter
        section: telemetry
        type: enum
        values: [none, otlp-http, otlp-grpc]
        description: Select the OpenTelemetry exporter and provide any endpoint metadata.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1436
      - key: otel.trace_exporter
        label: Trace exporter
        section: telemetry
        type: enum
        values: [none, otlp-http, otlp-grpc]
        description: Select the OpenTelemetry trace exporter and provide any endpoint metadata.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1442
      - key: otel.metrics_exporter
        label: Metrics exporter
        section: telemetry
        type: enum
        values: [none, statsig, otlp-http, otlp-grpc]
        description: Select the OpenTelemetry metrics exporter. The default, statsig, follows analytics.enabled.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1448
      - key: otel.log_user_prompt
        label: Log user prompt
        section: telemetry
        type: boolean
        description: Opt in to exporting raw user prompts with OpenTelemetry logs.
        danger_when: true
        note: Sends your prompts to the telemetry endpoint.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1454
      - key: otel.log_agent_responses
        label: Log agent responses
        section: telemetry
        type: boolean
        description: Export final response text from the main agent and spawned subagents to the configured OTLP log exporter. Defaults to false.
        danger_when: true
        note: Sends agent replies to the telemetry endpoint.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1460
      - key: otel.log_guardian_assessments
        label: Log guardian assessments
        section: autonomy
        type: boolean
        description: Export completed automatic approval reviews to the configured OTLP log exporter. Defaults to false.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1466
      - key: otel.span_attributes
        label: Span attributes
        section: telemetry
        type: map
        description: Add string attributes to every exported trace span.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1472
      - key: otel.tracestate
        label: Tracestate
        section: telemetry
        type: map
        description: Set fields on W3C tracestate members when propagating trace context. Each member maps field names to string values.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1477
      - key: otel.tool_result.max_bytes
        label: Max bytes
        section: telemetry
        type: number
        default: 2048
        description: Maximum number of UTF-8 bytes from each tool result to include in logs, before the truncation notice. Defaults to 2048.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1483
      - key: otel.exporter.<id>.endpoint
        label: Endpoint
        section: telemetry
        type: string
        description: Exporter endpoint for OTEL logs.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1489
      - key: otel.exporter.<id>.protocol
        label: Protocol
        section: telemetry
        type: enum
        values: [binary, json]
        description: Protocol used by the OTLP/HTTP exporter.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1494
      - key: otel.exporter.<id>.headers
        label: Headers
        section: telemetry
        type: map
        description: Static headers included with OTEL exporter requests.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1499
      - key: otel.trace_exporter.<id>.endpoint
        label: Endpoint
        section: telemetry
        type: string
        description: Trace exporter endpoint for OTEL logs.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1504
      - key: otel.trace_exporter.<id>.protocol
        label: Protocol
        section: telemetry
        type: enum
        values: [binary, json]
        description: Protocol used by the OTLP/HTTP trace exporter.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1509
      - key: otel.trace_exporter.<id>.headers
        label: Headers
        section: telemetry
        type: map
        description: Static headers included with OTEL trace exporter requests.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1514
      - key: otel.exporter.<id>.tls.ca-certificate
        label: Ca-certificate
        section: telemetry
        type: string
        description: CA certificate path for OTEL exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1519
      - key: otel.exporter.<id>.tls.client-certificate
        label: Client-certificate
        section: telemetry
        type: string
        description: Client certificate path for OTEL exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1524
      - key: otel.exporter.<id>.tls.client-private-key
        label: Client-private-key
        section: telemetry
        type: string
        description: Client private key path for OTEL exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1529
      - key: otel.trace_exporter.<id>.tls.ca-certificate
        label: Ca-certificate
        section: telemetry
        type: string
        description: CA certificate path for OTEL trace exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1534
      - key: otel.trace_exporter.<id>.tls.client-certificate
        label: Client-certificate
        section: telemetry
        type: string
        description: Client certificate path for OTEL trace exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1539
      - key: otel.trace_exporter.<id>.tls.client-private-key
        label: Client-private-key
        section: telemetry
        type: string
        description: Client private key path for OTEL trace exporter TLS.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1544
      - key: desktop.custom_file_handlers.<id>
        label: Custom file handlers
        section: other
        type: map
        description: User-level only. Defines an additional Open in target for the ChatGPT desktop app.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1549
      - key: desktop.custom_file_handlers.<id>.label
        label: Label
        section: other
        type: string
        description: Display name shown in Open in menus. Required.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1555
      - key: desktop.custom_file_handlers.<id>.icon
        label: Icon
        section: other
        type: string
        description: Bundled asset path, Base64-encoded data:image/... URL, file URI, or absolute local path for the handler icon.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1560
      - key: desktop.custom_file_handlers.<id>.command
        label: Custom file handlers command
        section: other
        type: string
        description: Executable path or command name to detect and launch. Required.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1566
      - key: desktop.custom_file_handlers.<id>.args
        label: Custom file handlers args
        section: other
        type: list
        description: 'Arguments inserted between the command and file input (default: []).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1572
      - key: desktop.custom_file_handlers.<id>.input
        label: Input
        section: other
        type: enum
        default: path
        values: [path, json_argument, json_stdin]
        description: 'How the app sends file input to the handler (default: path).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1578
      - key: desktop.custom_file_handlers.<id>.supports_ssh
        label: Supports ssh
        section: other
        type: boolean
        default: false
        description: 'Offer the handler for files in SSH workspaces (default: false).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1584
      - key: tui
        label: Tui
        section: other
        type: map
        description: TUI-specific options such as enabling inline desktop notifications.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1590
      - key: tui.notifications
        label: Notifications
        section: other
        type: boolean
        default: true
        description: Enable TUI notifications; optionally restrict to specific event types.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1596
      - key: tui.notification_method
        label: Notification method
        section: other
        type: enum
        default: auto
        values: [auto, osc9, bel]
        description: 'Notification method for terminal notifications (default: auto).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1602
      - key: tui.notification_condition
        label: Notification condition
        section: other
        type: enum
        default: unfocused
        values: [unfocused, always]
        description: Control whether TUI notifications fire only when the terminal is unfocused or regardless of focus. Defaults to unfocused.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1608
      - key: tui.animations
        label: Animations
        section: other
        type: boolean
        default: true
        description: 'Enable terminal animations (welcome screen, shimmer, spinner) (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1614
      - key: tui.disable_paste_burst
        label: Disable paste burst
        section: other
        type: boolean
        default: false
        description: 'Disable burst-paste detection in the TUI (default: false). Takes precedence over the legacy top-level disable_paste_burst setting.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1620
      - key: tui.alternate_screen
        label: Alternate screen
        section: other
        type: enum
        default: auto
        values: [auto, always, never]
        description: 'Control alternate screen usage for the TUI (default: auto; auto skips it in Zellij to preserve scrollback).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1626
      - key: tui.resume_cwd
        label: Resume cwd
        section: other
        type: enum
        values: [current, session]
        description: Working directory to use when resuming or forking a session. When unset, Codex asks you to choose if your current directory differs from the session's saved directory.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1632
      - key: tui.vim_mode_default
        label: Vim mode default
        section: other
        type: boolean
        default: false
        description: 'Start the composer in Vim normal mode instead of insert mode (default: false). You can still toggle it per session with /vim.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1638
      - key: tui.raw_output_mode
        label: Raw output mode
        section: other
        type: boolean
        default: false
        description: 'Start the TUI in raw scrollback mode for copy-friendly terminal selection (default: false). You can toggle it with /raw or the default alt-r key binding.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1644
      - key: tui.show_tooltips
        label: Show tooltips
        section: other
        type: boolean
        default: true
        description: 'Show onboarding tooltips in the TUI welcome screen (default: true).'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1650
      - key: tui.auto_recap
        label: Auto recap
        section: other
        type: boolean
        default: true
        description: 'Generate automatic conversation recaps while the terminal is unfocused (default: true). Set to false to disable automatic recaps; /recap remains available.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1656
      - key: tui.show_server_version_notice
        label: Show server version notice
        section: other
        type: boolean
        default: true
        description: 'Show informational notices about connected app-server version differences (default: true). Does not hide compatibility errors or version status.'
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1662
      - key: tui.status_line
        label: Status line
        section: other
        type: list
        description: Ordered list of TUI footer status-line item identifiers. null disables the status line.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1668
      - key: tui.terminal_title
        label: Terminal title
        section: other
        type: list
        description: Ordered list of terminal title item identifiers. When set, the TUI renders the selected items into the terminal window/tab title.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1674
      - key: tui.theme
        label: Theme
        section: other
        type: string
        description: Syntax-highlighting theme override (kebab-case theme name).
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1680
      - key: tui.keymap.<context>.<action>
        label: Keymap
        section: other
        type: string
        description: Keyboard shortcut binding for a TUI action. Supported contexts include global, chat, composer, editor, vim_normal, vim_operator, vim_text_object, pager, list, and approval.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1686
      - key: marketplaces.<name>.source_type
        label: Source type
        section: extensions
        type: enum
        values: [git, local]
        description: Source kind for a configured plugin marketplace. Marketplaces can be defined in system, cloud-managed, user, or trusted-project config.toml.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1698
      - key: marketplaces.<name>.source
        label: Source
        section: extensions
        type: string
        description: Git repository location or local marketplace root directory. Use an absolute path for a local source; the directory contains .agents/plugins/marketplace.json.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1704
      - key: marketplaces.<name>.ref
        label: Ref
        section: extensions
        type: string
        description: Optional Git branch, tag, or commit for the marketplace.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1710
      - key: marketplaces.<name>.sparse_paths
        label: Sparse paths
        section: extensions
        type: list
        description: Optional sparse checkout paths for a Git marketplace. Include the marketplace catalog and any local plugin directories it references.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1715
      - key: plugins._default.enabled
        label: Default enabled
        section: extensions
        type: boolean
        default: true
        description: Set the default activation state for installed plugins. An explicit plugins.<plugin>.enabled overrides this default for plugins their source enables.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1721
      - key: plugins.<plugin>.enabled
        label: Plugins enabled
        section: extensions
        type: boolean
        description: Enable or disable a local-marketplace plugin using a plugin-name@marketplace-name key. Read from the effective merged config; trusted-project settings can override user, cloud-managed, and system defaults.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1727
      - key: plugins.<plugin>.mcp_servers.<server>.enabled
        label: MCP servers enabled
        section: mcp
        type: boolean
        description: Enable or disable an MCP server bundled by an installed plugin without changing the plugin manifest.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1733
      - key: plugins.<plugin>.mcp_servers.<server>.default_tools_approval_mode
        label: Default tools approval mode
        section: autonomy
        type: enum
        values: [auto, prompt, writes, approve]
        description: Default approval behavior for tools on a plugin-provided MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1739
      - key: plugins.<plugin>.mcp_servers.<server>.enabled_tools
        label: Enabled tools
        section: mcp
        type: list
        description: Allow list of tools exposed from a plugin-provided MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1745
      - key: plugins.<plugin>.mcp_servers.<server>.disabled_tools
        label: Disabled tools
        section: mcp
        type: list
        description: Deny list applied after enabled_tools for a plugin-provided MCP server.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1751
      - key: plugins.<plugin>.mcp_servers.<server>.tools.<tool>.approval_mode
        label: Approval mode
        section: autonomy
        type: enum
        values: [auto, prompt, writes, approve]
        description: Per-tool approval behavior override for a plugin-provided MCP tool.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1757
      - key: tui.presets.<digit>.input
        label: Input
        section: other
        type: string
        description: Save a prompt or slash command in one of the ten slots (0–9) shown by /presets. Use up to 8,000 UTF-8 bytes of nonempty text.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1763
      - key: tui.presets.<digit>.label
        label: Label
        section: other
        type: string
        description: Optional name for the preset in the picker and shortcut hints.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1769
      - key: tui.model_availability_nux.<model>
        label: Model availability nux
        section: other
        type: number
        description: Internal startup-tooltip state keyed by model slug.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1775
      - key: hide_agent_reasoning
        label: Hide agent reasoning
        section: model
        type: boolean
        default: false
        description: Suppress reasoning events in both the TUI and codex exec output.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1780
      - key: show_raw_agent_reasoning
        label: Show raw agent reasoning
        section: model
        type: boolean
        description: Surface raw reasoning content when the active model emits it.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1786
      - key: disable_paste_burst
        label: Disable paste burst
        section: other
        type: boolean
        description: Legacy fallback for tui.disable_paste_burst. Prefer the setting under [tui].
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1792
      - key: chatgpt_base_url
        label: Chatgpt base URL
        section: other
        type: string
        description: Override the base URL used during the ChatGPT login flow.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1798
      - key: cli_auth_credentials_store
        label: Cli auth credentials store
        section: startup
        type: enum
        values: [file, keyring, auto, ephemeral]
        description: Control where the CLI stores cached credentials.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1803
      - key: mcp_oauth_credentials_store
        label: MCP oauth credentials store
        section: mcp
        type: enum
        values: [auto, file, keyring]
        description: Preferred store for MCP OAuth credentials.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1808
      - key: mcp_oauth_callback_port
        label: MCP oauth callback port
        section: mcp
        type: number
        description: Optional global fixed port for the local HTTP callback server used during MCP OAuth login. A server-specific oauth.callback_port takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1813
      - key: mcp_oauth_callback_url
        label: MCP oauth callback URL
        section: mcp
        type: string
        description: Optional base callback URL for MCP OAuth login, such as a devbox ingress URL. Newly added pre-registered clients use this URL unchanged when the authorization server supports issuer identification; existing clients without a saved callback append a server-specific callback ID.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1819
      - key: experimental_use_unified_exec_tool
        label: Experimental use unified exec tool
        section: other
        type: boolean
        description: Legacy name for enabling unified exec; prefer [features].unified_exec or codex --enable unified_exec.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1825
      - key: tools.web_search
        label: Web search
        section: other
        type: string
        description: Optional web search tool configuration. The object form can set search context size, allowed search domains, and approximate user location.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1831
      - key: web_search
        label: Web search
        section: other
        type: enum
        values: [disabled, cached, indexed, live]
        description: 'Controls the web search tool mode: disabled, cached, indexed, or live.'
        danger_when: [live]
        note: Lets the agent fetch live web pages.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1837
      - key: default_permissions
        label: Default permissions
        section: autonomy
        type: string
        description: Name of the default permissions profile to apply to sandboxed tool calls. Built-ins are :read-only, :workspace, and :danger-full-access; custom profile names require matching [permissions.<name>] tables.
        danger_when: [':danger-full-access']
        note: Removes the sandbox so commands can touch the whole machine.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1843
      - key: permissions.<name>.description
        label: Description
        section: autonomy
        type: string
        description: Human-readable description for this named profile. A profile does not inherit its parent's description through extends.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1849
      - key: permissions.<name>.extends
        label: Extends
        section: autonomy
        type: string
        description: Optional parent profile applied before this named profile. Set it to another named profile, :read-only, or :workspace; :danger-full-access, undefined parents, and cycles are rejected.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1855
      - key: permissions.<name>.workspace_roots
        label: Workspace roots
        section: autonomy
        type: map
        description: Profile-defined workspace roots that receive :workspace_roots filesystem rules alongside the session's runtime workspace roots.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1861
      - key: permissions.<name>.workspace_roots.<path>
        label: Workspace roots
        section: autonomy
        type: boolean
        description: Opt a path into the profile's workspace root set when true. Disabled entries remain inactive.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1867
      - key: permissions.<name>.filesystem
        label: Filesystem
        section: autonomy
        type: map
        description: Named filesystem permission profile. Each key is an absolute path or special token such as :minimal or :workspace_roots.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1873
      - key: permissions.<name>.filesystem.glob_scan_max_depth
        label: Glob scan max depth
        section: autonomy
        type: number
        description: Maximum depth for expanding deny-read glob patterns on platforms that snapshot matches before sandbox startup. Must be at least 1 when set.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1879
      - key: permissions.<name>.network.enabled
        label: Network enabled
        section: autonomy
        type: boolean
        description: Enable network access for commands in this permission profile. This does not start the network proxy.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1897
      - key: permissions.<name>.network.proxy_url
        label: Proxy URL
        section: autonomy
        type: string
        description: HTTP listener URL used when this permissions profile enables sandboxed networking.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1903
      - key: permissions.<name>.network.enable_socks5
        label: Enable socks5
        section: autonomy
        type: boolean
        description: Expose SOCKS5 support when this permissions profile enables sandboxed networking.
        doc: docs/learn.chatgpt.com/docs/config-file/config-reference.md#L1909
      - key: permissions.<name>.network.socks_url
        label: Socks URL
        section: autonomy
        type: string
        description: SOCKS5 proxy endpoint used by this permissions profile.
