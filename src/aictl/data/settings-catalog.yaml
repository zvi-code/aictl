      - key: chat.copilot.localModel.useInAuto
        label: Use in auto
        section: model
        type: boolean
        default: false
        description: Enable Auto to route turns to the active on-device model, with cloud fallback. Changes take effect immediately.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L290
      - key: chat.copilot.localModel.llamaServerPath
        label: Llama server path
        section: model
        type: string
        default: ""
        description: Specify the absolute path to a user-installed llama-server executable. VS Code doesn't install llama.cpp.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L291
      - key: chat.agentHost.devContainer.enabled
        label: Dev container enabled
        section: autonomy
        type: boolean
        default: true
        description: Show Use Dev Container for eligible local folders and folders on SSH, Tunnel, or WSL hosts, and run sessions in the project's Dev Container.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L292
      - key: chat.agentHost.cloudSandbox.enabled
        label: Cloud sandbox enabled
        section: autonomy
        type: boolean
        default: false
        description: Create and discover cloud sessions. In the Agents window, use cloud sessions instead of the copilot cloud agent workflow on prodname github Actions for new Cloud sessions.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L293
      - key: chat.agentHost.cloudSandbox.autoConnectOnOpen
        label: Auto connect on open
        section: autonomy
        type: boolean
        default: true
        description: Connect to or wake a cloud environment when opening or restoring its chat in the Agents window. Turn off to wait until you start composing or explicitly connect.
