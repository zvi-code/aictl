        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L275
        locked_floor: true
      - key: chat.sessionSync.excludeRepositories
        label: Exclude repositories
        section: telemetry
        type: list
        default: []
        description: Repository patterns to exclude from session sync. Use exact owner/repo names or glob patterns like my-org/*.
