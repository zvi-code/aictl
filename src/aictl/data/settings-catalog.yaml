        locked_floor: true
      - key: chat.agent.allowedNetworkDomains
        label: Allowed network domains
        section: autonomy
        type: list
        default: []
        description: Configure allowed domains for the fetch tool and integrated browser when chat.agent.networkFilter is enabled, and for compatible terminal sandbox implementations. Terminal filtering capabilities vary by implementation and platform.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L198
        locked_floor: true
      - key: chat.agent.deniedNetworkDomains
        label: Denied network domains
        section: autonomy
        type: list
        default: []
        description: Configure denied domains for the fetch tool and integrated browser when chat.agent.networkFilter is enabled, and for compatible terminal sandbox implementations. Terminal filtering capabilities vary by implementation and platform.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L199
        locked_floor: true
      - key: chat.agent.sandbox.allowNetwork
        label: Allow network
        section: autonomy
        type: boolean
        default: true
        description: Former network access setting. Its value migrates to chat.agent.sandbox.network.allowNetwork.
        danger_when: true
        note: Lets sandboxed commands reach every network domain.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L211
        locked_floor: true
      - key: chat.agent.sandbox.retryWithAllowNetworkRequests
        label: Retry with allow network requests
        section: autonomy
        type: boolean
        default: true
        description: Allow a blocked terminal command in a Local harness session to retry inside the sandbox with unrestricted network access after user confirmation.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L212
      - key: chat.agent.sandbox.fileSystem.linux
        label: Linux
        section: autonomy
        type: map
        description: Configure Local harness sandbox file system access on Linux with allowRead, allowWrite, denyRead, and denyWrite.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L213
      - key: chat.agent.sandbox.fileSystem.mac
        label: Mac
        section: autonomy
        type: map
        description: Configure Local harness sandbox file system access on macOS with allowRead, allowWrite, denyRead, and denyWrite.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L214
      - key: chat.planWidget.inlineEditor.enabled
        label: Inline editor enabled
        section: other
        type: boolean
        default: true
        description: Use an inline editor inside the plan control to edit plans, instead of opening a separate editor tab.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L221
      - key: chat.planAgent.defaultModel
        label: Plan agent default model
        section: model
        type: string
        default: Auto (Vendor Default)
        description: Select a default language model for the plan agent.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L222
      - key: workbench.startupEditor
        label: Startup editor
        section: startup
        type: string
        default: welcomePage
        description: Set to agentSessionsWelcomePage to show the sessions welcome page with recent sessions, embedded chat, and quick actions when no editors are restored.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L238
      - key: chat.viewSessions.enabled
        label: View sessions enabled
        section: other
        type: boolean
        default: true
        description: Show the agent sessions list in the chat view.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L239
      - key: chat.viewSessions.orientation
        label: Orientation
        section: other
        type: string
        default: sideBySide
        description: Control the layout orientation of the sessions list in the chat view.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L240
      - key: chat.agentSessions.showExternal
        label: Show external
        section: other
        type: string
        default: last7Days
        description: Control which sessions from supported external applications appear in the session lists. Values are none, recent, last24Hours, last7Days, and last30Days.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L241
      - key: chat.agentSessions.sessionStorageCleanupSuggestion.enabled
        label: Session storage cleanup suggestion enabled
        section: other
        type: boolean
        default: false
        description: Show a suggestion to clean up inactive session worktrees when they use at least 5 GiB or 20 worktrees are eligible for cleanup.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L242
      - key: chat.agentSessions.autoMarkAsDoneMergedSessionsAfterDays
        label: Auto mark as done merged sessions after days
        section: other
        type: number
        default: 0
        description: Control the number of inactive days before an eligible session with a merged pull request is automatically marked as done. Set to 0 to disable automatic cleanup.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L243
      - key: chat.agentSessions.autoDeleteMarkedAsDoneMergedSessionsAfterDays
        label: Auto delete marked as done merged sessions after days
        section: other
        type: number
        default: 0
        description: Control the number of days after an eligible session is automatically marked as done before it is permanently deleted. Sessions that you mark as done manually aren't deleted automatically.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L244
      - key: sessions.showChatTabs
        label: Show chat tabs
        section: other
        type: string
        default: multiple
        description: Show each chat as a tab with multiple, or show only the active chat as the session view with single.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L245
      - key: chat.agentHost.multipleChatProviders.enabled
        label: Multiple chat providers enabled
        section: other
        type: boolean
        default: false
        description: Use different harnesses for chats in one session in the Agents window, with each chat's own model and permission settings.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L246
      - key: chat.agentHost.moveChats.enabled
        label: Move chats enabled
        section: other
        type: boolean
        default: true
        description: Move chats between sessions or into a new session in the Agents window. Moving between harnesses also requires chat.agentHost.multipleChatProviders.enabled. The default differs between Insiders and Stable builds.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L247
      - key: sessions.chat.compareAgents.enabled
        label: Compare agents enabled
        section: other
        type: boolean
        default: true
        description: Enable model comparison for eligible new sessions in the Agents window. Run the same prompt with multiple models in independent chats or isolated worktrees.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L248
      - key: sessions.chat.unifiedWorkspacePicker.enabled
        label: Unified workspace picker enabled
        section: other
        type: boolean
        default: true
        description: Use the unified workspace picker in the Agents window to search local, GitHub, and remote workspaces and, when supported, start a session without a workspace.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L249
      - key: sessions.chat.experimental.newSessionComposerLayout
        label: New session composer layout
        section: other
        type: boolean
        default: true
        description: Group workspace, repository, worktree, and harness controls above the new-session input. Requires the unified workspace picker. The default differs between Insiders and Stable builds.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L250
      - key: sessions.chat.experimental.environmentPicker
        label: Environment picker
        section: other
        type: boolean
        default: true
        description: Show a separate Environment picker for new sessions in the Agents window. Requires the unified workspace picker and experimental new-session composer layout.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L251
      - key: sessions.chat.experimental.environmentPickerManageRemotes
        label: Environment picker manage remotes
        section: other
        type: boolean
        default: true
        description: Enable remote environment management and its picker visibility preferences. Requires the Environment picker and chat.remoteAgentHostsEnabled.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L252
      - key: sessions.chat.experimental.welcomePhrases
        label: Welcome phrases
        section: other
        type: boolean
