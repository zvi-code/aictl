        description: "Authentication token. Takes precedence over GITHUB_TOKEN."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L956
      - key: env.GITHUB_COPILOT_PROMPT_MODE_EXTENSIONS
        label: Github copilot prompt mode extensions
        section: other
        type: string
        description: "Set to true to load project extensions and allow extension management tools in prompt mode (-p). Disabled by default to prevent running repository-controlled extension code without interactive trust."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L957
      - key: env.GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS
