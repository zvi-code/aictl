        default: ""
        description: Set the name in new-session welcome messages. Leave empty to use the first name from the signed-in GitHub profile when available.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L254
      - key: sessions.chat.experimental.welcomeMessages
        label: Welcome messages
        section: other
        type: map
        description: Add custom welcome phrases to the defaults with append, or use only custom phrases with replace. Use {name} to position the welcome name in a phrase.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L255
      - key: chat.editMode.hidden
        label: Hidden
        section: other
        type: boolean
        default: true
        description: Restore the deprecated Edit mode for multi-file code edits.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L256
      - key: chat.agentsControl.enabled
        label: Agents control enabled
        section: other
        type: boolean
        default: true
        description: Enable the session status indicator in the command center. Shows unread and in-progress session badges.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L257
      - key: chat.agentsControl.clickBehavior
        label: Click behavior
        section: other
        type: string
        default: cycle
        description: Configure the behavior when selecting the chat icon in the agent status indicator. The default differs between Insiders and Stable builds.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L258
      - key: sessions.showApplicationBadge
        label: Show application badge
        section: other
        type: boolean
        default: true
        description: Show the number of unarchived sessions that need attention on the application icon. The default differs between Insiders and Stable builds.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L259
      - key: chat.agentSessions.appearanceTools.enabled
        label: Appearance tools enabled
        section: other
        type: boolean
        default: true
        description: Enable the agent tools and built-in skill for generating and setting chat backgrounds in the Agents window. Disabling the setting doesn't remove existing backgrounds or affect manual background controls.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L260
      - key: chat.agentSessions.preferredDarkBackgroundImageLayout
        label: Preferred dark background image layout
        section: other
        type: string
        default: repeat
        description: Control the chat background image layout in the Agents window when using a dark color theme.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L261
      - key: chat.agentSessions.preferredLightBackgroundImageLayout
        label: Preferred light background image layout
        section: other
        type: string
        default: repeat
        description: Control the chat background image layout in the Agents window when using a light color theme.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L262
      - key: chat.unifiedAgentsBar.enabled
        label: Unified agents bar enabled
        section: other
        type: boolean
        default: false
        description: Replace the command center search box with a unified chat and search control.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L263
      - key: sessions.layout.singlePaneDetailPanel
        label: Single pane detail panel
        section: other
        type: boolean
        default: false
        description: Dock the Agents window detail panel inside the editor with a shared tab bar. Requires a window reload to take effect.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L264
      - key: sessions.editor.wordWrap
        label: Word wrap
        section: other
        type: string
        default: inherit
        description: Control how code editors in the Agents window wrap long lines. Values are off, on, and inherit.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L265
      - key: sessions.diffEditor.wordWrap
        label: Word wrap
        section: other
        type: string
        default: inherit
        description: Control how diff editors in the Changes view wrap long lines. Values are off, on, and inherit.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L266
      - key: chat.experimental.agentsWindowPRComments
        label: Agents window PR comments
        section: other
        type: boolean
        default: false
        description: Show Add PR Comment when you add range comments while reviewing agent changes.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L267
      - key: sessions.useWorktree
        label: Use worktree
