      - key: chat.agentMerge.fixCI
        label: Fix ci
        section: autonomy
        type: boolean
        default: true
        description: Ask the agent to fix failed required CI checks.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L309
      - key: chat.agentMerge.resolveConflicts
        label: Resolve conflicts
        section: autonomy
        type: boolean
        default: true
        description: Ask the agent to update branches that are behind and resolve merge conflicts.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L310
      - key: chat.agentMerge.mergePullRequest
        label: Merge pull request
        section: autonomy
        type: string
        default: never
        description: Control whether agent merge merges or enqueues the pull request when it is ready. always merges after any selected maintenance work, ifUnchanged merges only until an agent repair turn changes the pull request, and never turns off automatic merging.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L311
      - key: chat.agentMerge.mergeMethod
        label: Merge method
        section: autonomy
        type: string
        default: auto
        description: 'Select the merge method. auto uses the first repository-compatible method in this order: squash, merge commit, or rebase. You can also require squash, merge, or rebase.'
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L312
      - key: chat.agentMerge.replyAttribution
        label: Reply attribution
        section: autonomy
        type: boolean
        default: true
        description: Include an automated-reply attribution in review-thread replies posted by agent merge.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L313
      - key: inlineChat.defaultModel
        label: Inline chat default model
        section: model
