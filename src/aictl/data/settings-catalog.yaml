        locked_floor: true
      - key: chat.agentHost.codexAgent.enabled
        label: Codex agent enabled
        section: agents
        type: boolean
        default: false
        description: Make the Codex provider available to the Agent Host, unless enterprise-managed settings disable it. Enabling takes effect without a restart.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L287
        locked_floor: true
      - key: chat.agentHost.computerUse.enabled
        label: Computer use enabled
        section: other
        type: boolean
        default: false
        description: Offer Computer Use in local Copilot sessions on macOS and Windows to interact with desktop applications. The plugin downloads on first use and requires activation and application approvals.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L288
      - key: chat.copilot.localModel.enabled
        label: Local model enabled
        section: model
        type: boolean
        default: false
        description: Offer on-device models to download and run on this device with llama.cpp. Changes restart the local Copilot runtime after active turns finish.
