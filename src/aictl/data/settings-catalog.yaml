      - key: chat.agent.sandbox.mcpServers
        label: MCP servers
        section: autonomy
        type: boolean
        default: true
        description: Apply sandboxing to MCP servers launched or managed for the session when sandboxing is enabled.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L193
      - key: chat.agent.sandbox.lspServers
        label: Lsp servers
        section: autonomy
        type: boolean
        default: true
        description: Apply sandboxing to language servers launched or managed for the session when sandboxing is enabled.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L194
      - key: chat.agent.sandbox.credentials.authenticategit
        label: Authenticategit
        section: autonomy
        type: boolean
        default: true
        description: Provide Git authentication to sandboxed processes.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L195
      - key: chat.agent.sandbox.credentials.authenticategh
        label: Authenticategh
        section: autonomy
        type: boolean
        default: true
        description: Provide GitHub CLI authentication to sandboxed processes.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L196
      - key: chat.agent.networkFilter
        label: Network filter
        section: autonomy
        type: boolean
        default: false
