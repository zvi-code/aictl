        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L958
      - key: env.GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP
        label: Github copilot prompt mode workspace mcp
        section: other
        type: string
