      - key: chat.agentHost.githubEnvironments.enabled
        label: Github environments enabled
        section: other
        type: boolean
        default: true
        description: Allow sharing this machine as a GitHub Environment, and discovering and connecting to other registered machines. Subject to rollout and organization policy.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L272
      - key: chat.remoteAgentHostsAutoConnect
        label: Remote agent hosts auto connect
        section: other
        type: boolean
        default: true
        description: Automatically connect to eligible remote hosts. For GitHub Environments on desktop, first connect explicitly.
