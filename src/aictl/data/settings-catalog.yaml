      - key: chat.agentHost.claudeAgent.enabled
        label: Claude agent enabled
        section: agents
        type: boolean
        default: true
        description: Make the Claude provider available to the Agent Host, unless enterprise-managed settings disable it. Restart the Agent Host process for the change to take effect.
