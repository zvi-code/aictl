        type: string
        description: Comma-separated list of additional anthropic-beta header values to include in API requests. Claude Code already sends the beta headers it needs; use this to opt into an Anthropic API beta before Claude Code adds native support.
        doc: docs/code.claude.com/docs/en/env-vars.md#L143
      - key: env.ANTHROPIC_CUSTOM_HEADERS
        label: Anthropic custom headers
        section: other
        type: string
        description: 'Custom headers to add to requests (Name: Value format, newline-separated for multiple headers). If a name or value contains a character an HTTP header can''t carry, such as a curly quote or a zero-width space, the request fails with an error that identifies the pair by position.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L144
      - key: env.ANTHROPIC_CUSTOM_MODEL_OPTION
        label: Anthropic custom model option
        section: model
        type: string
        description: Model ID to add as a custom entry in the /model picker. Use this to make a non-standard or gateway-specific model selectable without replacing built-in aliases.
        doc: docs/code.claude.com/docs/en/env-vars.md#L145
      - key: env.ANTHROPIC_CUSTOM_MODEL_OPTION_DESCRIPTION
        label: Anthropic custom model option description
        section: model
        type: string
        description: Display description for the custom model entry in the /model picker. Defaults to Custom model (<model-id>) when not set
        doc: docs/code.claude.com/docs/en/env-vars.md#L146
      - key: env.ANTHROPIC_CUSTOM_MODEL_OPTION_NAME
        label: Anthropic custom model option name
        section: model
        type: string
        description: Display name for the custom model entry in the /model picker. When not set, the entry shows the model's name if Claude Code recognizes the ID, and the model ID otherwise
        doc: docs/code.claude.com/docs/en/env-vars.md#L147
      - key: env.ANTHROPIC_CUSTOM_MODEL_OPTION_SUPPORTED_CAPABILITIES
        label: Anthropic custom model option supported capabilities
        section: model
        type: string
        description: Comma-separated list of capabilities the custom model supports, for example effort,thinking. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L148
      - key: env.ANTHROPIC_DEFAULT_FABLE_MODEL
        label: Anthropic default fable model
        section: model
        type: string
        description: Model ID that the fable alias resolves to, and the ID Claude Code recognizes as a Fable model for automatic model fallback on third-party providers. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L149
      - key: env.ANTHROPIC_DEFAULT_FABLE_MODEL_DESCRIPTION
        label: Anthropic default fable model description
        section: model
        type: string
        description: Display description for the pinned Fable model in the /model picker. When not set, the row shows a default description that begins Custom Fable model.
        doc: docs/code.claude.com/docs/en/env-vars.md#L150
      - key: env.ANTHROPIC_DEFAULT_FABLE_MODEL_NAME
        label: Anthropic default fable model name
        section: model
        type: string
        description: Display name for the pinned Fable model in the /model picker. When not set, the row shows the model's name if Claude Code recognizes the pinned ID, and the pinned ID otherwise.
        doc: docs/code.claude.com/docs/en/env-vars.md#L151
      - key: env.ANTHROPIC_DEFAULT_FABLE_MODEL_SUPPORTED_CAPABILITIES
        label: Anthropic default fable model supported capabilities
        section: model
        type: string
        description: Comma-separated list of capabilities the pinned Fable model supports, for example effort,thinking. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L152
      - key: env.ANTHROPIC_DEFAULT_HAIKU_MODEL
        label: Anthropic default haiku model
        section: model
        type: string
        description: Model ID that the haiku alias resolves to, also used for background functionality. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L153
      - key: env.ANTHROPIC_DEFAULT_HAIKU_MODEL_DESCRIPTION
        label: Anthropic default haiku model description
        section: model
        type: string
        description: Display description for the pinned Haiku model in the /model picker. When not set, the row shows a default description that begins Custom Haiku model.
        doc: docs/code.claude.com/docs/en/env-vars.md#L154
      - key: env.ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME
        label: Anthropic default haiku model name
        section: model
        type: string
        description: Display name for the pinned Haiku model in the /model picker. When not set, the row shows the model's name if Claude Code recognizes the pinned ID, and the pinned ID otherwise.
        doc: docs/code.claude.com/docs/en/env-vars.md#L155
      - key: env.ANTHROPIC_DEFAULT_HAIKU_MODEL_SUPPORTED_CAPABILITIES
        label: Anthropic default haiku model supported capabilities
        section: model
        type: string
        description: Comma-separated list of capabilities the pinned Haiku model supports, for example effort,thinking. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L156
      - key: env.ANTHROPIC_DEFAULT_MODEL
        label: Anthropic default model
        section: model
        type: string
        description: Model that new sessions start on by default. Requires Claude Code v2.1.236 or later.
        doc: docs/code.claude.com/docs/en/env-vars.md#L157
      - key: env.ANTHROPIC_DEFAULT_OPUS_MODEL
        label: Anthropic default opus model
        section: model
        type: string
        description: Model ID that the opus alias resolves to, and that opusplan uses while Plan Mode is active. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L158
      - key: env.ANTHROPIC_DEFAULT_OPUS_MODEL_DESCRIPTION
        label: Anthropic default opus model description
        section: model
        type: string
        description: Display description for the pinned Opus model in the /model picker. When not set, the row shows a default description that begins Custom Opus model.
        doc: docs/code.claude.com/docs/en/env-vars.md#L159
      - key: env.ANTHROPIC_DEFAULT_OPUS_MODEL_NAME
        label: Anthropic default opus model name
        section: model
        type: string
        description: Display name for the pinned Opus model in the /model picker. When not set, the row shows the model's name if Claude Code recognizes the pinned ID, and the pinned ID otherwise.
        doc: docs/code.claude.com/docs/en/env-vars.md#L160
      - key: env.ANTHROPIC_DEFAULT_OPUS_MODEL_SUPPORTED_CAPABILITIES
        label: Anthropic default opus model supported capabilities
        section: model
        type: string
        description: Comma-separated list of capabilities the pinned Opus model supports, for example effort,thinking. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L161
      - key: env.ANTHROPIC_DEFAULT_SONNET_MODEL
        label: Anthropic default sonnet model
        section: model
        type: string
        description: Model ID that the sonnet alias resolves to, and that opusplan uses when Plan Mode is not active. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L162
      - key: env.ANTHROPIC_DEFAULT_SONNET_MODEL_DESCRIPTION
        label: Anthropic default sonnet model description
        section: model
        type: string
        description: Display description for the pinned Sonnet model in the /model picker. When not set, the row shows a default description that begins Custom Sonnet model.
        doc: docs/code.claude.com/docs/en/env-vars.md#L163
      - key: env.ANTHROPIC_DEFAULT_SONNET_MODEL_NAME
        label: Anthropic default sonnet model name
        section: model
        type: string
        description: Display name for the pinned Sonnet model in the /model picker. When not set, the row shows the model's name if Claude Code recognizes the pinned ID, and the pinned ID otherwise.
        doc: docs/code.claude.com/docs/en/env-vars.md#L164
      - key: env.ANTHROPIC_DEFAULT_SONNET_MODEL_SUPPORTED_CAPABILITIES
        label: Anthropic default sonnet model supported capabilities
        section: model
        type: string
        description: Comma-separated list of capabilities the pinned Sonnet model supports, for example effort,thinking. See Model configuration
        doc: docs/code.claude.com/docs/en/env-vars.md#L165
      - key: env.ANTHROPIC_FEDERATION_RULE_ID
        label: Anthropic federation rule id
        section: startup
        type: string
        description: Federation rule ID for Workload Identity Federation. When you set it together with ANTHROPIC_ORGANIZATION_ID, Claude Code selects federation credentials, which rank above your /login credential.
        doc: docs/code.claude.com/docs/en/env-vars.md#L166
      - key: env.ANTHROPIC_FOUNDRY_API_KEY
        label: Anthropic foundry api key
        section: startup
        type: string
        description: API key for Microsoft Foundry authentication (see Microsoft Foundry)
        doc: docs/code.claude.com/docs/en/env-vars.md#L167
      - key: env.ANTHROPIC_FOUNDRY_AUTH_TOKEN
        label: Anthropic foundry auth token
        section: startup
        type: string
        description: 'Bearer token for Microsoft Foundry authentication, such as a Microsoft Entra access token. Claude Code sends it as the Authorization: Bearer header.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L168
      - key: env.ANTHROPIC_FOUNDRY_BASE_URL
        label: Anthropic foundry base url
        section: other
        type: string
        description: Full base URL for the Microsoft Foundry resource (for example, https://my-resource.services.ai.azure.com/anthropic). Alternative to ANTHROPIC_FOUNDRY_RESOURCE (see Microsoft Foundry)
        doc: docs/code.claude.com/docs/en/env-vars.md#L169
      - key: env.ANTHROPIC_FOUNDRY_RESOURCE
        label: Anthropic foundry resource
        section: other
        type: string
        description: Microsoft Foundry resource name (for example, my-resource). Claude Code refuses a URL or host name.
        doc: docs/code.claude.com/docs/en/env-vars.md#L170
      - key: env.ANTHROPIC_MODEL
        label: Anthropic model
        section: model
        type: string
        description: Name of the model setting to use (see Model Configuration)
        doc: docs/code.claude.com/docs/en/env-vars.md#L171
      - key: env.ANTHROPIC_ORGANIZATION_ID
        label: Anthropic organization id
        section: startup
        type: string
        description: Organization ID for Workload Identity Federation. Set it together with ANTHROPIC_FEDERATION_RULE_ID.
        doc: docs/code.claude.com/docs/en/env-vars.md#L172
      - key: env.ANTHROPIC_PROFILE
        label: Anthropic profile
        section: startup
        type: string
        description: Name of the Anthropic profile to authenticate with, such as one created by ant auth login or by signing in to a Console account without an API key. See authentication precedence
        doc: docs/code.claude.com/docs/en/env-vars.md#L173
      - key: env.ANTHROPIC_SMALL_FAST_MODEL
        label: Anthropic small fast model
        section: model
        type: string
        description: \[DEPRECATED] Name of Haiku-class model for background tasks
        doc: docs/code.claude.com/docs/en/env-vars.md#L174
      - key: env.ANTHROPIC_SMALL_FAST_MODEL_AWS_REGION
        label: Anthropic small fast model aws region
        section: model
        type: string
        description: Override AWS region for the Haiku-class model when using Amazon Bedrock or Amazon Bedrock Mantle.
        doc: docs/code.claude.com/docs/en/env-vars.md#L175
      - key: env.ANTHROPIC_VERTEX_BASE_URL
        label: Anthropic vertex base url
        section: other
        type: string
        description: Override Google Cloud's Agent Platform endpoint URL. Use for custom Google Cloud's Agent Platform endpoints or when routing through an LLM gateway.
        doc: docs/code.claude.com/docs/en/env-vars.md#L176
      - key: env.ANTHROPIC_VERTEX_PROJECT_ID
        label: Anthropic vertex project id
        section: other
        type: string
        description: GCP project ID that Google Cloud's Agent Platform requests are addressed to. See Configure GCP credentials
        doc: docs/code.claude.com/docs/en/env-vars.md#L177
      - key: env.ANTHROPIC_WORKSPACE_ID
        label: Anthropic workspace id
        section: startup
        type: string
        description: Workspace ID for workload identity federation. Set this when your federation rule is scoped to more than one workspace so the token exchange knows which workspace to target
        doc: docs/code.claude.com/docs/en/env-vars.md#L178
      - key: env.API_FORCE_IDLE_TIMEOUT
        label: Api force idle timeout
        section: other
        type: boolean
        description: Override the 5-minute body idle timeout that aborts a streaming model response when no bytes arrive. Set to 0 to turn the timeout off, for example when a slow gateway or local model pauses longer than 5 minutes between chunks, or 1 to keep it on for every provider.
        doc: docs/code.claude.com/docs/en/env-vars.md#L179
      - key: env.API_TIMEOUT_MS
        label: Api timeout ms
        section: other
        type: number
        default: 600000
        description: Time in milliseconds that each API request attempt has to receive its response headers. It doesn't limit how long a streaming response runs after that.
        doc: docs/code.claude.com/docs/en/env-vars.md#L180
      - key: env.AWS_BEARER_TOKEN_BEDROCK
        label: Aws bearer token bedrock
        section: other
        type: string
        description: Amazon Bedrock API key for authentication (see Amazon Bedrock API keys)
        doc: docs/code.claude.com/docs/en/env-vars.md#L181
      - key: env.BASH_DEFAULT_TIMEOUT_MS
        label: Bash default timeout ms
        section: other
        type: number
        default: 120000
        description: 'Default timeout for a foreground Bash or PowerShell tool command, in milliseconds (default: 120000, or 2 minutes). A value above the default time limit for background commands replaces that default in unattended sessions.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L182
      - key: env.BASH_MAX_OUTPUT_LENGTH
        label: Bash max output length
        section: other
        type: number
        default: 30000
        description: 'Maximum number of characters of bash output that Claude Code reads back into a command''s result (default: 30000; maximum: 150000). If you set the bashOutputMaxChars setting, Claude Code ignores this variable.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L183
      - key: env.BASH_MAX_TIMEOUT_MS
        label: Bash max timeout ms
        section: other
        type: number
        default: 600000
        description: 'Maximum timeout the model can set for a foreground Bash or PowerShell tool command, in milliseconds (default: 600000, or 10 minutes). The effective ceiling is the larger of this and BASH_DEFAULT_TIMEOUT_MS.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L184
      - key: env.BETA_TRACING_ENDPOINT
        label: Beta tracing endpoint
        section: telemetry
        type: string
        description: 'OTLP/HTTP endpoint for detailed beta tracing: with ENABLE_BETA_TRACING_DETAILED=1, logs and traces go there instead of to the configured exporters. Set it in your shell, user settings, or managed settings.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L185
      - key: env.CCR_FORCE_BUNDLE
        label: Ccr force bundle
        section: other
        type: boolean
        description: Set to 1 to force claude --cloud to bundle and upload your local repository instead of cloning from its remote
        doc: docs/code.claude.com/docs/en/env-vars.md#L186
      - key: env.CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS
        label: Claude agent sdk disable builtin agents
        section: agents
        type: boolean
        description: Set to 1 to disable all built-in subagent types such as Explore and Plan. Only applies in non-interactive mode (the -p flag).
        doc: docs/code.claude.com/docs/en/env-vars.md#L188
      - key: env.CLAUDE_AGENT_SDK_MCP_NO_PREFIX
        label: Claude agent sdk mcp no prefix
        section: mcp
        type: string
        description: Set to 1 to skip the mcp__<server>__ prefix on tool names from SDK-created MCP servers. Tools use their original names.
        doc: docs/code.claude.com/docs/en/env-vars.md#L189
      - key: env.CLAUDE_ASYNC_AGENT_STALL_TIMEOUT_MS
        label: Claude async agent stall timeout ms
        section: agents
        type: number
        description: Stall timeout in milliseconds for subagents. Also covers workflow agents on Claude Code v2.1.286 or later.
        doc: docs/code.claude.com/docs/en/env-vars.md#L190
      - key: env.CLAUDE_AUTOCOMPACT_PCT_OVERRIDE
        label: Claude autocompact pct override
        section: context
        type: number
        description: Set the percentage (1-100) of the auto-compact window at which auto-compaction triggers. Use lower values like 50 to compact earlier; the variable can't raise the threshold, so values above the default percentage are ignored.
        doc: docs/code.claude.com/docs/en/env-vars.md#L191
      - key: env.CLAUDE_AUTO_BACKGROUND_TASKS
        label: Claude auto background tasks
        section: other
        type: boolean
        description: Set to 1 to force-enable automatic backgrounding of long-running agent tasks. When enabled, a subagent moves to the background after running for approximately two minutes.
        doc: docs/code.claude.com/docs/en/env-vars.md#L192
      - key: env.CLAUDE_AX_PREPARK_MS
        label: Claude ax prepark ms
        section: other
        type: number
        description: In screen reader mode, how many milliseconds Claude Code waits before it writes a new or changed line. Default 0, so Claude Code doesn't wait.
        doc: docs/code.claude.com/docs/en/env-vars.md#L193
      - key: env.CLAUDE_AX_SCREEN_READER
        label: Claude ax screen reader
        section: other
        type: boolean
        description: 'Set to 1 to render screen-reader friendly output: flat text without decorative borders or animations. Set to 0 to force screen-reader mode off even when axScreenReader is true.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L194
      - key: env.CLAUDE_AX_STARTUP_QUIET_MS
        label: Claude ax startup quiet ms
        section: startup
        type: number
        description: In screen reader mode, how many milliseconds Claude Code holds the first interface render after the startup confirmation line. Your screen reader can then speak the line in full before new output interrupts it.
        doc: docs/code.claude.com/docs/en/env-vars.md#L195
      - key: env.CLAUDE_BASH_MAINTAIN_PROJECT_WORKING_DIR
        label: Claude bash maintain project working dir
        section: other
        type: string
        description: Return to the original working directory after each Bash or PowerShell command in the main session
        doc: docs/code.claude.com/docs/en/env-vars.md#L196
      - key: env.CLAUDE_BYTE_STREAM_IDLE_TIMEOUT_MS
        label: Claude byte stream idle timeout ms
        section: other
        type: number
        description: Timeout in milliseconds for the byte-level streaming idle watchdog; when set, it takes precedence over CLAUDE_STREAM_IDLE_TIMEOUT_MS for that watchdog and leaves the event-level watchdog unchanged. Claude Code clamps this variable to between 10 seconds and 30 minutes.
        doc: docs/code.claude.com/docs/en/env-vars.md#L197
      - key: env.CLAUDE_CLIENT_PRESENCE_FILE
        label: Claude client presence file
        section: other
        type: string
        description: Path to a file that an external tool, such as a screen-lock listener, creates when you unlock your screen and deletes when you lock it. While the file exists, Claude Code skips Remote Control mobile push notifications, so you stop getting pushes while you are actively using the computer.
        doc: docs/code.claude.com/docs/en/env-vars.md#L198
      - key: env.CLAUDE_CODE_ACCESSIBILITY
        label: Claude code accessibility
        section: other
        type: boolean
        description: Set to 1 to keep the native terminal cursor visible and disable the inverted-text cursor indicator. Allows screen magnifiers like macOS Zoom to track cursor position
        doc: docs/code.claude.com/docs/en/env-vars.md#L199
      - key: env.CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD
        label: Claude code additional directories claude md
        section: context
        type: boolean
        description: Set to 1 to load memory files from directories specified with --add-dir. Loads CLAUDE.md, .claude/CLAUDE.md, .claude/rules/*.md, and CLAUDE.local.md.
        doc: docs/code.claude.com/docs/en/env-vars.md#L200
      - key: env.CLAUDE_CODE_ALT_SCREEN_FULL_REPAINT
        label: Claude code alt screen full repaint
        section: other
        type: boolean
        description: Set to 1 to repaint the entire screen on every frame in fullscreen rendering instead of sending incremental updates. Use this if fullscreen mode shows stale or misplaced text fragments.
        doc: docs/code.claude.com/docs/en/env-vars.md#L201
      - key: env.CLAUDE_CODE_ALWAYS_ENABLE_EFFORT
        label: Claude code always enable effort
        section: model
        type: boolean
        description: Set to 1 to send the effort parameter with every request, even when Claude Code does not recognize the model ID as effort-capable. Use this when routing through an LLM gateway or third-party provider that serves models under custom identifiers.
        doc: docs/code.claude.com/docs/en/env-vars.md#L202
      - key: env.CLAUDE_CODE_API_KEY_HELPER_TTL_MS
        label: Claude code api key helper ttl ms
        section: startup
        type: number
        description: Interval in milliseconds at which credentials should be refreshed (when using apiKeyHelper)
        doc: docs/code.claude.com/docs/en/env-vars.md#L203
      - key: env.CLAUDE_CODE_ARTIFACT_AUTO_OPEN
        label: Claude code artifact auto open
        section: other
        type: boolean
        description: Set to 0 to stop Claude Code from opening the browser automatically when a new artifact is published
        doc: docs/code.claude.com/docs/en/env-vars.md#L204
      - key: env.CLAUDE_CODE_ARTIFACT_COMMENTS
        label: Claude code artifact comments
        section: other
        type: boolean
        description: Set to 0 to stop Claude reading and replying to comments on an artifact. Has no effect when CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC has turned artifacts off.
        doc: docs/code.claude.com/docs/en/env-vars.md#L205
      - key: env.CLAUDE_CODE_ARTIFACT_COMMENTS_AUTOREACT
        label: Claude code artifact comments autoreact
        section: other
        type: boolean
        description: Set to 0 to stop Claude replying on its own to comments sent to it. Requires Claude Code v2.1.228 or later
        doc: docs/code.claude.com/docs/en/env-vars.md#L206
      - key: env.CLAUDE_CODE_ARTIFACT_PUBLISH_EDITS
        label: Claude code artifact publish edits
        section: other
        type: boolean
        description: Set to 0 to stop Claude from applying small changes to an artifact's file as part of publishing it. Claude then edits the file with its file-editing tools and publishes it as a separate step.
        doc: docs/code.claude.com/docs/en/env-vars.md#L207
      - key: env.CLAUDE_CODE_ATTRIBUTION_HEADER
        label: Claude code attribution header
        section: telemetry
        type: boolean
        description: Set to 0 to omit the attribution block, which carries the client version and a prompt fingerprint, from the start of the system prompt. Caching on a direct connection to the Anthropic API is unaffected either way.
        doc: docs/code.claude.com/docs/en/env-vars.md#L208
      - key: env.CLAUDE_CODE_AUTO_COMPACT_WINDOW
        label: Claude code auto compact window
        section: context
        type: number
        description: Set the auto-compact window, how full the context gets before compaction, from 100000 to 1000000 tokens. Suffixed values such as 200k require v2.1.304 or later.
        doc: docs/code.claude.com/docs/en/env-vars.md#L210
      - key: env.CLAUDE_CODE_AUTO_CONNECT_IDE
        label: Claude code auto connect ide
        section: other
        type: boolean
        description: Override automatic IDE connection. By default, Claude Code connects automatically when launched inside a supported IDE's integrated terminal.
        doc: docs/code.claude.com/docs/en/env-vars.md#L211
      - key: env.CLAUDE_CODE_AUTO_MODE_MODEL
        label: Claude code auto mode model
        section: autonomy
        type: string
        description: Sets the model for the classifier requests Claude Code sends in auto mode. Use a full model ID such as claude-sonnet-4-6.
        doc: docs/code.claude.com/docs/en/env-vars.md#L212
      - key: env.CLAUDE_CODE_AUTO_MODE_SERVER
        label: Claude code auto mode server
        section: autonomy
        type: boolean
        description: Controls whether Claude Code asks the server to review auto mode actions. Set to 0 to use Claude Code's own classifier requests instead.
        doc: docs/code.claude.com/docs/en/env-vars.md#L213
      - key: env.CLAUDE_CODE_AWS_CHAIN_RESOLVE_TIMEOUT_MS
        label: Claude code aws chain resolve timeout ms
        section: other
        type: number
        default: 60000
        description: 'Time in milliseconds Claude Code waits for the AWS default credential provider chain to produce credentials before the request fails with AWS default-chain credential resolve timed out (default: 60000).'
        doc: docs/code.claude.com/docs/en/env-vars.md#L214
      - key: env.CLAUDE_CODE_BASH_EDIT_DIFF
        label: Claude code bash edit diff
        section: other
        type: boolean
        description: Set to 0 to turn off the diff of the files that changed while a Bash command ran, or 1 to record it in every permission mode. Takes precedence over the bashEditDiffEnabled setting.
        doc: docs/code.claude.com/docs/en/env-vars.md#L215
      - key: env.CLAUDE_CODE_BG_TASKS_REPORT_RUNNING
        label: Claude code bg tasks report running
        section: other
        type: string
        description: Set to 0 to make a non-interactive session report an idle status to its host at every turn end, even while background work is still running. By default, the session keeps reporting a running status past turn end while background work such as a background agent or a workflow run is still live.
        doc: docs/code.claude.com/docs/en/env-vars.md#L216
      - key: env.CLAUDE_CODE_BS_AS_CTRL_BACKSPACE
        label: Claude code bs as ctrl backspace
        section: other
        type: boolean
        description: Set to 0 to make Claude Code read the 0x08 byte, also written ^H, as plain Backspace, or 1 to read it as Ctrl+Backspace. Either value replaces the platform default.
        doc: docs/code.claude.com/docs/en/env-vars.md#L218
      - key: env.CLAUDE_CODE_CERT_STORE
        label: Claude code cert store
        section: other
        type: string
        description: 'Comma-separated list of CA certificate sources for TLS connections. bundled is the Mozilla CA set shipped with Claude Code. system is the operating system trust store, read only on runtimes with tls.getCACertificates: the native binary, or Node 22.15 or later for npm installs. See CA certificate store.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L219
      - key: env.CLAUDE_CODE_CLIENT_CERT
        label: Claude code client cert
        section: other
        type: string
        description: Path to client certificate file for mTLS authentication
        doc: docs/code.claude.com/docs/en/env-vars.md#L221
      - key: env.CLAUDE_CODE_CLIENT_KEY
        label: Claude code client key
        section: other
        type: string
        description: Path to client private key file for mTLS authentication
        doc: docs/code.claude.com/docs/en/env-vars.md#L222
      - key: env.CLAUDE_CODE_CLIENT_KEY_PASSPHRASE
        label: Claude code client key passphrase
        section: other
        type: string
        description: Passphrase for encrypted CLAUDE_CODE_CLIENT_KEY (optional)
        doc: docs/code.claude.com/docs/en/env-vars.md#L223
      - key: env.CLAUDE_CODE_DEBUG_LOGS_DIR
        label: Claude code debug logs dir
        section: telemetry
        type: string
        description: Override the debug log file path. Despite the name, this is a file path, not a directory.
        doc: docs/code.claude.com/docs/en/env-vars.md#L225
      - key: env.CLAUDE_CODE_DEBUG_LOG_LEVEL
        label: Claude code debug log level
        section: telemetry
        type: string
        description: 'Minimum log level written to the debug log file. Values: verbose, debug (default), info, warn, error.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L226
      - key: env.CLAUDE_CODE_DISABLE_1M_CONTEXT
        label: Claude code disable 1m context
        section: model
        type: boolean
        description: Set to 1 to turn off 1M context window support. Claude Code removes [1m] model variants from the model picker and holds models that run with the 1M window by default to a 200K window.
        doc: docs/code.claude.com/docs/en/env-vars.md#L227
      - key: env.CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING
        label: Claude code disable adaptive thinking
        section: other
        type: boolean
        description: Set to 1 to disable adaptive reasoning on Opus 4.6 and Sonnet 4.6 and fall back to the fixed thinking budget controlled by MAX_THINKING_TOKENS. Has no effect on Fable models, Sonnet 5 and later, Haiku 5.5, or Opus 4.7 and later, which always use adaptive reasoning
        doc: docs/code.claude.com/docs/en/env-vars.md#L228
      - key: env.CLAUDE_CODE_DISABLE_ADVISOR_TOOL
        label: Claude code disable advisor tool
        section: other
        type: boolean
        description: Set to 1 to disable the advisor tool. The /advisor command becomes unavailable, any configured advisorModel is ignored, and the --advisor flag is accepted but has no effect, so existing scripts that pass it continue to work without errors
        doc: docs/code.claude.com/docs/en/env-vars.md#L229
      - key: env.CLAUDE_CODE_DISABLE_AGENT_VIEW
        label: Claude code disable agent view
        section: agents
        type: boolean
        description: 'Set to 1 to turn off background agents and agent view: claude agents, --bg, /background, and the on-demand supervisor. Equivalent to the disableAgentView setting'
        doc: docs/code.claude.com/docs/en/env-vars.md#L230
      - key: env.CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN
        label: Claude code disable alternate screen
        section: other
        type: boolean
        description: Set to 1 to disable fullscreen rendering and use the classic main-screen renderer. The conversation stays in your terminal's native scrollback so Cmd+f and tmux copy mode work as usual.
        doc: docs/code.claude.com/docs/en/env-vars.md#L231
      - key: env.CLAUDE_CODE_DISABLE_ARTIFACT
        label: Claude code disable artifact
        section: other
        type: boolean
        description: Set to 1 to turn off the Artifact tool, which publishes session output as a private web page on claude.ai. Once you set it, no settings file turns the tool back on.
        doc: docs/code.claude.com/docs/en/env-vars.md#L232
      - key: env.CLAUDE_CODE_DISABLE_ATTACHMENTS
        label: Claude code disable attachments
        section: other
        type: boolean
        description: Set to 1 to disable attachment processing. File mentions with @ syntax are sent as plain text instead of being expanded into file content.
        doc: docs/code.claude.com/docs/en/env-vars.md#L233
      - key: env.CLAUDE_CODE_DISABLE_AUTH_REFRESH_LOCK
        label: Claude code disable auth refresh lock
        section: startup
        type: boolean
        description: Set to 1 to make a Claude Code process run its gcpAuthRefresh or awsAuthRefresh command itself instead of waiting while another process runs it. Requires Claude Code v2.1.286 or later
        doc: docs/code.claude.com/docs/en/env-vars.md#L234
      - key: env.CLAUDE_CODE_DISABLE_AUTO_MEMORY
        label: Claude code disable auto memory
        section: context
        type: boolean
        description: 'Set to 1 to disable auto memory. Set to 0 to force auto memory on even when --bare mode or autoMemoryEnabled: false would otherwise disable it.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L235
      - key: env.CLAUDE_CODE_DISABLE_BACKGROUND_TASKS
        label: Claude code disable background tasks
        section: other
        type: boolean
        description: Set to 1 to remove the run_in_background parameter from the Bash, PowerShell, and subagent tools and to turn off the Ctrl+B shortcut and background runs of forked skills. Claude Code then also stops moving subagents, long MCP tool calls, and timed-out shell commands to the background automatically.
        doc: docs/code.claude.com/docs/en/env-vars.md#L236
      - key: env.CLAUDE_CODE_DISABLE_BEDROCK_CONTENT_TYPE_DEFAULT
        label: Claude code disable bedrock content type default
        section: other
        type: boolean
        description: Set to 1 to stop Claude Code from treating an Amazon Bedrock streaming response with a missing or empty Content-Type header as Amazon Bedrock's binary event stream. By default, Claude Code assumes a gateway dropped the header from an otherwise unmodified response, so it decodes the body and streaming keeps working.
        doc: docs/code.claude.com/docs/en/env-vars.md#L237
      - key: env.CLAUDE_CODE_DISABLE_BEDROCK_CONTENT_TYPE_GUARD
        label: Claude code disable bedrock content type guard
        section: other
        type: boolean
        description: Set to 1 to skip the check that an Amazon Bedrock streaming response carries the application/vnd.amazon.eventstream content-type.
        doc: docs/code.claude.com/docs/en/env-vars.md#L238
      - key: env.CLAUDE_CODE_DISABLE_BG_EXIT_HANDOFF
        label: Claude code disable bg exit handoff
        section: other
        type: boolean
        description: Set to 1 to stop a background session's in-flight work when the supervisor stops, restarts, or updates that session's process, instead of handing it to the session's next process. That work is the session's running background shell commands, plus background subagents as of v2.1.198.
        doc: docs/code.claude.com/docs/en/env-vars.md#L239
      - key: env.CLAUDE_CODE_DISABLE_BG_SHELL_PRESSURE_REAP
        label: Claude code disable bg shell pressure reap
        section: other
        type: boolean
        description: Set to 1 to stop Claude Code from terminating background shell commands under memory pressure. By default, on macOS and Linux, Claude Code terminates background shells when the operating system reports critical memory pressure and the session has been idle for 30 minutes with no turn or subagent running.
        doc: docs/code.claude.com/docs/en/env-vars.md#L240
      - key: env.CLAUDE_CODE_DISABLE_BG_STABLE_PATH
        label: Claude code disable bg stable path
        section: other
        type: string
        description: On macOS with the native installer, set to 1 to run each background session's host process from the installed binary, not ~/.local/share/claude/ClaudeCode.app. macOS may then ask again for permissions such as folder access, including after each update.
        doc: docs/code.claude.com/docs/en/env-vars.md#L241
      - key: env.CLAUDE_CODE_DISABLE_BUNDLED_SKILLS
        label: Claude code disable bundled skills
        section: extensions
        type: boolean
        description: 'Set to 1 to disable the skills and workflows included with Claude Code: bundled skills and workflows are removed entirely, while built-in commands like /init stay typable but are hidden from the model. /doctor stays typable like the built-in commands; hide it with DISABLE_DOCTOR_COMMAND instead.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L242
      - key: env.CLAUDE_CODE_DISABLE_CFC_PROMPT
        label: Claude code disable cfc prompt
        section: context
        type: boolean
        description: For hosts that embed Claude Code and supply their own browser guidance. Set to 1 to keep the Claude in Chrome browser tools available while omitting the Chrome section of the system prompt and the /claude-in-chrome bundled skill.
        doc: docs/code.claude.com/docs/en/env-vars.md#L243
      - key: env.CLAUDE_CODE_DISABLE_CLAUDE_MDS
        label: Claude code disable claude mds
        section: context
        type: boolean
        description: Set to 1 to prevent loading any CLAUDE.md memory files into context, including user, project, and auto memory files
        doc: docs/code.claude.com/docs/en/env-vars.md#L244
      - key: env.CLAUDE_CODE_DISABLE_CRON
        label: Claude code disable cron
        section: other
        type: boolean
        description: Set to 1 to disable session-scoped scheduled tasks. The /loop skill and cron tools become unavailable and any already-scheduled tasks stop firing, including tasks that are already running mid-session
        doc: docs/code.claude.com/docs/en/env-vars.md#L245
      - key: env.CLAUDE_CODE_DISABLE_DANGEROUS_RM_TIMEOUT
        label: Claude code disable dangerous rm timeout
        section: autonomy
        type: boolean
        description: Set to 1 to turn off the auto and bypassPermissions time limit and denials on critical-path removals. These removals then go to the classifier in auto mode, and get an untimed prompt in bypassPermissions mode wherever Claude Code can show one.
        doc: docs/code.claude.com/docs/en/env-vars.md#L246
      - key: env.CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
        label: Claude code disable experimental betas
        section: other
        type: string
        description: Set to 1 to strip pre-release anthropic-beta request headers, the body fields that pair with them, and beta tool-schema fields such as defer_loading and eager_input_streaming from API requests.
        doc: docs/code.claude.com/docs/en/env-vars.md#L247
      - key: env.CLAUDE_CODE_DISABLE_EXPLORE_PLAN_AGENTS
        label: Claude code disable explore plan agents
        section: agents
        type: boolean
        description: Set to 1 to disable the built-in Explore and Plan subagents. Claude explores with its search tools or the general-purpose subagent instead, and plan mode reads files directly rather than launching Explore and Plan agents.
        doc: docs/code.claude.com/docs/en/env-vars.md#L248
      - key: env.CLAUDE_CODE_DISABLE_FAST_MODE
        label: Claude code disable fast mode
        section: other
        type: boolean
        description: Set to 1 to disable fast mode
        doc: docs/code.claude.com/docs/en/env-vars.md#L249
      - key: env.CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY
        label: Claude code disable feedback survey
        section: telemetry
        type: boolean
        description: Set to 1 to disable the "How is Claude doing?" session quality surveys. Surveys are also disabled when DISABLE_TELEMETRY, DO_NOT_TRACK, or CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC is set, unless CLAUDE_CODE_ENABLE_FEEDBACK_SURVEY_FOR_OTEL opts back in.
        doc: docs/code.claude.com/docs/en/env-vars.md#L250
      - key: env.CLAUDE_CODE_DISABLE_FILE_CHECKPOINTING
        label: Claude code disable file checkpointing
        section: other
        type: boolean
        description: Set to 1 to disable file checkpointing. The /rewind command will not be able to restore code changes.
        doc: docs/code.claude.com/docs/en/env-vars.md#L251
      - key: env.CLAUDE_CODE_DISABLE_FILE_MENTIONS
        label: Claude code disable file mentions
        section: other
        type: boolean
        description: Set to 1 to stop Claude Code from expanding @ mentions of files and directories. Claude instead gets the mentioned paths with a note to read them using its file tools.
        doc: docs/code.claude.com/docs/en/env-vars.md#L252
      - key: env.CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS
        label: Claude code disable git instructions
        section: context
        type: boolean
        description: Set to 1 to remove built-in commit and PR workflow instructions and the git status snapshot from Claude's context. Useful when using your own git workflow skills.
        doc: docs/code.claude.com/docs/en/env-vars.md#L253
      - key: env.CLAUDE_CODE_DISABLE_INLINE_SHELL_RM_PROMPT
        label: Claude code disable inline shell rm prompt
        section: autonomy
        type: boolean
        description: Set to 1 to stop Claude Code from reading scripts passed to a shell with -c, such as bash -c 'rm -rf ~', for critical-path removals. Claude Code still checks the shell variable and positional parameter targets in those scripts, and the other critical-path checks keep running.
        doc: docs/code.claude.com/docs/en/env-vars.md#L254
      - key: env.CLAUDE_CODE_DISABLE_LEGACY_MODEL_REMAP
        label: Claude code disable legacy model remap
        section: model
        type: boolean
        description: Set to 1 to prevent automatic remapping of Opus 4 and Opus 4.1 to the current Opus version on the Anthropic API. Use when you intentionally want to pin an older model.
        doc: docs/code.claude.com/docs/en/env-vars.md#L255
      - key: env.CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND
        label: Claude code disable mcp task background
        section: mcp
        type: boolean
        description: Set to 1 so that Claude waits for the result of an MCP task in an interactive session. While automatic backgrounding is on, it still moves the call to the background after two minutes by default.
        doc: docs/code.claude.com/docs/en/env-vars.md#L256
      - key: env.CLAUDE_CODE_DISABLE_MODEL_ACCESS_FALLBACK
        label: Claude code disable model access fallback
        section: model
        type: boolean
        description: Set to 1 to stop Claude Code on Amazon Bedrock and Google Cloud's Agent Platform from switching to an older model when your account loses access to a session's model mid-session; the refused request fails at once instead.
        doc: docs/code.claude.com/docs/en/env-vars.md#L257
      - key: env.CLAUDE_CODE_DISABLE_MOUNTED_DRIVE_RM_PROMPT
        label: Claude code disable mounted drive rm prompt
        section: autonomy
        type: boolean
        description: Set to 1 to turn off the mounted drive prompt for paths such as /Volumes/USB. Set it in the environment that launches Claude Code, because Claude Code ignores it in a settings env block.
        doc: docs/code.claude.com/docs/en/env-vars.md#L258
      - key: env.CLAUDE_CODE_DISABLE_MOUSE
        label: Claude code disable mouse
        section: other
        type: boolean
        description: Set to 1 to disable mouse tracking in fullscreen rendering. Keyboard scrolling with PgUp and PgDn still works.
        doc: docs/code.claude.com/docs/en/env-vars.md#L259
      - key: env.CLAUDE_CODE_DISABLE_MOUSE_CLICKS
        label: Claude code disable mouse clicks
        section: other
        type: boolean
        description: Set to 1 to disable click, drag, and hover handling in fullscreen rendering while keeping mouse-wheel scrolling. Use this when you want wheel scroll to work inside Claude Code but don't want clicks to position the cursor, expand tool output, or open links.
        doc: docs/code.claude.com/docs/en/env-vars.md#L260
      - key: env.CLAUDE_CODE_DISABLE_MTLS_RELOAD_ON_STALE_CONNECTION
        label: Claude code disable mtls reload on stale connection
        section: other
        type: boolean
        description: Set to 1 to stop Claude Code from re-reading the mTLS client certificate and key when an API request fails with a connection-level error, such as a connection reset or a TLS handshake error. With the reload disabled, Claude Code loads rotated files only when it next applies settings or at the next startup.
        doc: docs/code.claude.com/docs/en/env-vars.md#L261
      - key: env.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
        label: Claude code disable nonessential traffic
        section: telemetry
        type: boolean
        description: 'Set to any non-empty value, such as 1, to disable nonessential network traffic: auto-updates, telemetry, error reporting, the /feedback command, Claude-drafted feedback, release notes, the PR and MR status badge checks, and availability checks such as the fast mode check.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L262
      - key: env.CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK
        label: Claude code disable nonstreaming fallback
        section: other
        type: boolean
        description: Set to 1 to disable the non-streaming fallback when a streaming request fails mid-stream. Streaming errors propagate to the retry layer instead.
        doc: docs/code.claude.com/docs/en/env-vars.md#L263
      - key: env.CLAUDE_CODE_DISABLE_NOTIFICATION_PRESENCE_CHECK
        label: Claude code disable notification presence check
        section: other
        type: boolean
        description: Set to 1 to send the PushNotification tool's desktop notification even while you are typing in or focused on the terminal. By default the tool skips both the desktop notification and the mobile push when it detects recent keyboard activity or terminal focus.
        doc: docs/code.claude.com/docs/en/env-vars.md#L264
      - key: env.CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL
        label: Claude code disable official marketplace autoinstall
        section: extensions
        type: boolean
        description: Set to 1 to disable automatic registration of the official plugin marketplace. Claude Code reads the variable when it is about to register the marketplace, usually during a machine's first interactive launch.
        doc: docs/code.claude.com/docs/en/env-vars.md#L265
      - key: env.CLAUDE_CODE_DISABLE_PERMISSION_PROMPT_NOTIFY_HOOKS
        label: Claude code disable permission prompt notify hooks
        section: hooks
        type: boolean
        description: Set to 1 to stop Claude Code from running your Notification hooks for unanswered permission requests in sessions where Claude Code sends them to the Agent SDK's canUseTool callback, which is how Claude Desktop and the VS Code extension host Claude Code. Has no effect in terminal sessions.
        doc: docs/code.claude.com/docs/en/env-vars.md#L266
      - key: env.CLAUDE_CODE_DISABLE_POLICY_SKILLS
        label: Claude code disable policy skills
        section: extensions
        type: boolean
        description: Set to 1 to skip loading skills from the system-wide managed skills directory. Useful for container or CI sessions that should not load operator-provisioned skills
        doc: docs/code.claude.com/docs/en/env-vars.md#L267
      - key: env.CLAUDE_CODE_DISABLE_POWERSHELL_CMD_RM_DENY
        label: Claude code disable powershell cmd rm deny
        section: autonomy
        type: boolean
        description: Set to 1 to turn off the PowerShell tool check that denies the cmd built-ins rd, rmdir, del, and erase on a system path, such as a drive root or your home directory. Claude Code ignores this variable in a settings file's env block.
        doc: docs/code.claude.com/docs/en/env-vars.md#L268
      - key: env.CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK
        label: Claude code disable refusal fallback
        section: other
        type: boolean
        description: Set to 1 to turn off the automatic model switch when a safety classifier flags a request, the behavior the switchModelsOnFlag setting controls
        doc: docs/code.claude.com/docs/en/env-vars.md#L269
      - key: env.CLAUDE_CODE_DISABLE_STRUCTURED_OUTPUTS
        label: Claude code disable structured outputs
        section: other
        type: boolean
        description: Set to 1 to stop Claude Code from sending the structured-output output_config.format field and the anthropic-beta value that pairs with it, for an LLM gateway whose upstream rejects them. This leaves on the other pre-release capabilities that CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS turns off.
        doc: docs/code.claude.com/docs/en/env-vars.md#L270
      - key: env.CLAUDE_CODE_DISABLE_SUBSTITUTION_RM_PROMPT
        label: Claude code disable substitution rm prompt
        section: autonomy
        type: boolean
        description: Set to 1 to turn off the critical-path check for a recursive rm whose target is entirely the output of a command substitution, such as rm -rf "$(pwd)". The other critical-path checks keep running.
        doc: docs/code.claude.com/docs/en/env-vars.md#L271
      - key: env.CLAUDE_CODE_DISABLE_TERMINAL_TITLE
        label: Claude code disable terminal title
        section: other
        type: boolean
        description: Set to 1 to disable automatic terminal title updates based on conversation context. This also skips the background small/fast-model request that generates a session title, and turns off status reports to your terminal
        doc: docs/code.claude.com/docs/en/env-vars.md#L272
      - key: env.CLAUDE_CODE_DISABLE_THINKING
        label: Claude code disable thinking
        section: other
        type: boolean
        description: Set to 1 to omit the thinking parameter from API requests entirely. This is a compatibility option for proxies and gateways that reject the parameter.
        doc: docs/code.claude.com/docs/en/env-vars.md#L273
      - key: env.CLAUDE_CODE_DISABLE_ULTRAREVIEW_TRUST_CHECK
        label: Claude code disable ultrareview trust check
        section: autonomy
        type: boolean
        description: 'Set to 1 so that claude ultrareview doesn''t exit with Error: Workspace not trusted in a folder you haven''t trusted when it can''t ask you to trust it, such as in CI. Set it in the environment that launches Claude Code, not a settings env block, and only where every such run starts in a folder you trust.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L274
      - key: env.CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT
        label: Claude code disable unknown model window enforcement
        section: model
        type: boolean
        description: Set to 1 to skip proactive auto-compaction when Claude Code doesn't recognize the model ID, such as an LLM gateway alias. Without this variable, Claude Code compacts at the context window it assumes for the ID.
        doc: docs/code.claude.com/docs/en/env-vars.md#L275
      - key: env.CLAUDE_CODE_DISABLE_VIRTUAL_SCROLL
        label: Claude code disable virtual scroll
        section: other
        type: boolean
        description: Set to 1 to disable virtual scrolling in fullscreen rendering and render every message in the transcript. Use this if scrolling in fullscreen mode shows blank regions where messages should appear
        doc: docs/code.claude.com/docs/en/env-vars.md#L276
      - key: env.CLAUDE_CODE_DISABLE_WEB_FETCH
        label: Claude code disable web fetch
        section: autonomy
        type: boolean
        description: Set to 1 to turn off the WebFetch tool. The WebSearch tool stays available.
        doc: docs/code.claude.com/docs/en/env-vars.md#L277
      - key: env.CLAUDE_CODE_DISABLE_WINDOWS_SHELL_LAUNCHER
        label: Claude code disable windows shell launcher
        section: other
        type: boolean
        description: Set to 1 to start PowerShell tool commands on Windows directly instead of through the cmd.exe launcher. By default, the launcher lets a PowerShell command running in the background carry over to the session's next process, such as when you background the session.
        doc: docs/code.claude.com/docs/en/env-vars.md#L278
      - key: env.CLAUDE_CODE_DISABLE_WORKFLOWS
        label: Claude code disable workflows
        section: other
        type: boolean
        description: Set to 1 to disable workflows. Equivalent to the disableWorkflows setting
        doc: docs/code.claude.com/docs/en/env-vars.md#L279
      - key: env.CLAUDE_CODE_EFFORT_LEVEL
        label: Claude code effort level
        section: model
        type: string
        description: 'Set the effort level for supported models. Values: low, medium, high, xhigh, or max.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L280
      - key: env.CLAUDE_CODE_EMIT_SESSION_STATE_EVENTS
        label: Claude code emit session state events
        section: other
        type: boolean
        description: Set to 1 to add session_state_changed messages, which carry the session's state, to the message stream. Requires either the Agent SDK or --print, --output-format stream-json, and --verbose
        doc: docs/code.claude.com/docs/en/env-vars.md#L281
      - key: env.CLAUDE_CODE_ENABLE_AUTO_MODE
        label: Claude code enable auto mode
        section: autonomy
        type: boolean
        description: Accepted for compatibility with older releases and has no effect. Auto mode is available by default on every provider, including Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry, and signed-in Claude apps gateway sessions.
        doc: docs/code.claude.com/docs/en/env-vars.md#L282
      - key: env.CLAUDE_CODE_ENABLE_AWAY_SUMMARY
        label: Claude code enable away summary
        section: other
        type: boolean
        description: Override session recap availability. Set to 0 to force recaps off regardless of the /config toggle.
        doc: docs/code.claude.com/docs/en/env-vars.md#L283
      - key: env.CLAUDE_CODE_ENABLE_BACKGROUND_PLUGIN_REFRESH
        label: Claude code enable background plugin refresh
        section: extensions
        type: boolean
        description: Set to 1 to refresh plugin state at turn boundaries in non-interactive mode after a background install completes. Off by default because the refresh changes the system prompt mid-session, which invalidates prompt caching for that turn
        doc: docs/code.claude.com/docs/en/env-vars.md#L284
      - key: env.CLAUDE_CODE_ENABLE_CFC
        label: Claude code enable cfc
        section: other
        type: boolean
        description: Set to 1 to start a CLI session with Chrome integration on, or 0 to start with it off. Takes precedence over the claudeInChromeDefaultEnabled setting.
        doc: docs/code.claude.com/docs/en/env-vars.md#L285
      - key: env.CLAUDE_CODE_ENABLE_FEEDBACK_SURVEY_FOR_OTEL
        label: Claude code enable feedback survey for otel
        section: telemetry
        type: boolean
        description: Set to 1 to route the "How is Claude doing?" session quality survey to your own OpenTelemetry collector when Anthropic-bound nonessential traffic is blocked. Survey ratings are emitted only as OTEL events to your configured collector.
        doc: docs/code.claude.com/docs/en/env-vars.md#L286
      - key: env.CLAUDE_CODE_ENABLE_FINE_GRAINED_TOOL_STREAMING
        label: Claude code enable fine grained tool streaming
        section: other
        type: boolean
        description: Controls whether tool call inputs stream from the API as Claude generates them. With this off, a large tool input such as a long file write arrives only after Claude finishes generating it, which can look like it's hanging.
        doc: docs/code.claude.com/docs/en/env-vars.md#L287
      - key: env.CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
        label: Claude code enable gateway model discovery
        section: model
        type: boolean
        description: Set to 1 to populate the /model picker from your gateway's /v1/models endpoint when ANTHROPIC_BASE_URL points at an Anthropic-compatible gateway such as LiteLLM, Kong, or an internal proxy. Off by default because gateways backed by a shared API key would otherwise show every user every model the key can access.
        doc: docs/code.claude.com/docs/en/env-vars.md#L288
      - key: env.CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION
        label: Claude code enable prompt suggestion
        section: context
        type: boolean
        description: Set to false to turn off prompt suggestions, the grayed-out predictions that appear in your prompt input. Takes precedence over the promptSuggestionEnabled setting, which is what the Prompt suggestions toggle in /config writes.
        doc: docs/code.claude.com/docs/en/env-vars.md#L290
      - key: env.CLAUDE_CODE_ENABLE_SHARE_BUNDLE
        label: Claude code enable share bundle
        section: other
        type: boolean
        description: Set to 1 to make /share save its report and the whole session transcript to a local archive under ~/.claude/feedback-bundles/ instead of sending the report to Anthropic. If your organization's policy turns off /share, you can't turn it back on with this variable.
        doc: docs/code.claude.com/docs/en/env-vars.md#L291
      - key: env.CLAUDE_CODE_ENABLE_TASKS
        label: Claude code enable tasks
        section: agents
        type: boolean
        description: Selects which task-tracking tools Claude Code provides in sessions that have them. By default, Claude Code provides the Task tools TaskCreate, TaskUpdate, TaskGet, and TaskList.
        doc: docs/code.claude.com/docs/en/env-vars.md#L292
      - key: env.CLAUDE_CODE_ENABLE_TELEMETRY
        label: Claude code enable telemetry
        section: telemetry
        type: boolean
        description: Set to 1 to enable OpenTelemetry data collection for metrics and logging. Required before configuring OTel exporters.
        doc: docs/code.claude.com/docs/en/env-vars.md#L293
      - key: env.CLAUDE_CODE_ENABLE_TODO_TOOLS
        label: Claude code enable todo tools
        section: other
        type: boolean
        description: Set to 1 to get the task-tracking tools on every model. Without it, Claude Code provides them by default only on the models listed under Task tool availability.
        doc: docs/code.claude.com/docs/en/env-vars.md#L294
      - key: env.CLAUDE_CODE_EVEN_MORE_DANGEROUSLY_SKIP_PERMISSIONS
        label: Claude code even more dangerously skip permissions
        section: autonomy
        type: boolean
        description: Set to 1 to run dangerous rm commands with no prompt in bypassPermissions mode, which removes a safety prompt for destructive deletes. The linked section lists where it has no effect.
        danger_when: '1'
        note: Skips permission checks entirely.
        doc: docs/code.claude.com/docs/en/env-vars.md#L295
      - key: env.CLAUDE_CODE_EXIT_AFTER_STOP_DELAY
        label: Claude code exit after stop delay
        section: other
        type: number
        description: Time in milliseconds to wait after the query loop becomes idle before automatically exiting. Useful for automated workflows and scripts using SDK mode
        doc: docs/code.claude.com/docs/en/env-vars.md#L296
      - key: env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS
        label: Claude code experimental agent teams
        section: agents
        type: boolean
        description: Set to 1 to enable agent teams. Agent teams are experimental and disabled by default
        doc: docs/code.claude.com/docs/en/env-vars.md#L297
      - key: env.CLAUDE_CODE_EXTRA_BODY
        label: Claude code extra body
        section: other
        type: string
        description: JSON object to merge into the top level of every API request body. Useful for passing provider-specific parameters that Claude Code doesn't expose directly.
        doc: docs/code.claude.com/docs/en/env-vars.md#L298
      - key: env.CLAUDE_CODE_FILE_READ_MAX_OUTPUT_TOKENS
        label: Claude code file read max output tokens
        section: context
        type: number
        description: Override the default token limit for file reads, which is 25,000 tokens. Useful when you need to read larger files in full.
        doc: docs/code.claude.com/docs/en/env-vars.md#L299
      - key: env.CLAUDE_CODE_FORCE_SESSION_PERSISTENCE
        label: Claude code force session persistence
        section: telemetry
        type: boolean
        description: Set to 1 to force transcript persistence, prompt history, and claude agents registration even when this claude was launched from inside another Claude Code session.
        doc: docs/code.claude.com/docs/en/env-vars.md#L300
      - key: env.CLAUDE_CODE_FORCE_STRIKETHROUGH
        label: Claude code force strikethrough
        section: other
        type: boolean
        description: Set to 1 to force strikethrough rendering for ~~text~~ in Claude's responses when your terminal supports it but is not auto-detected, such as over SSH without TERM_PROGRAM forwarded. Without this, undetected terminals show the literal ~~ markers instead of rendering the text as strikethrough.
        doc: docs/code.claude.com/docs/en/env-vars.md#L301
      - key: env.CLAUDE_CODE_FORCE_SYNC_OUTPUT
        label: Claude code force sync output
        section: other
        type: boolean
        description: Set to 1 to force-enable DEC private mode 2026 synchronized output when your terminal supports it but is not auto-detected. Useful for emulators such as Emacs eat that implement BSU/ESU but do not reply to the capability probe.
        doc: docs/code.claude.com/docs/en/env-vars.md#L302
      - key: env.CLAUDE_CODE_FORCE_TERMINAL_IMAGES
        label: Claude code force terminal images
        section: other
        type: boolean
        description: Set to 1 to draw mod Image elements as pictures when your terminal draws kitty graphics protocol images with Unicode placeholders and you still see an Image's dimmed alt text. See which terminals draw an Image and where not to set this variable
        doc: docs/code.claude.com/docs/en/env-vars.md#L303
      - key: env.CLAUDE_CODE_FORK_SUBAGENT
        label: Claude code fork subagent
        section: agents
        type: boolean
        description: Controls fork mode, which is on by default and lets Claude start forks on its own. While fork mode is on, Claude also can't wait for a subagent in interactive terminal, VS Code, or desktop sessions on your machine.
        doc: docs/code.claude.com/docs/en/env-vars.md#L304
      - key: env.CLAUDE_CODE_FORWARD_SUBAGENT_TEXT
        label: Claude code forward subagent text
        section: agents
        type: boolean
        description: Set to 1 to emit subagent text and thinking blocks in claude -p --output-format stream-json output, the same behavior as the --forward-subagent-text flag. Use the variable when a harness invokes claude and can't pass the flag itself.
        doc: docs/code.claude.com/docs/en/env-vars.md#L305
      - key: env.CLAUDE_CODE_GATEWAY_HINT_HEADERS
        label: Claude code gateway hint headers
        section: other
        type: string
        description: Set to 1 to send the gateway hint headers, such as x-claude-code-request-class and x-claude-code-compaction, on a custom proxy or a third-party provider such as Amazon Bedrock or Claude Platform on AWS.
        doc: docs/code.claude.com/docs/en/env-vars.md#L306
      - key: env.CLAUDE_CODE_GATEWAY_MODEL_DISCOVERY_TIMEOUT_MS
        label: Claude code gateway model discovery timeout ms
        section: model
        type: number
        default: 3000
        description: 'Timeout in milliseconds for the gateway model discovery request that CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY turns on (default: 3000). Raise it when your gateway needs longer than three seconds to answer /v1/models at startup.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L307
      - key: env.CLAUDE_CODE_GIT_BASH_PATH
        label: Claude code git bash path
        section: other
        type: string
        description: 'Windows only: path to the Git Bash executable (bash.exe). Use when Git Bash is installed but not in your PATH.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L308
      - key: env.CLAUDE_CODE_GLOB_HIDDEN
        label: Claude code glob hidden
        section: other
        type: boolean
        description: Set to false to exclude dotfiles from results when Claude invokes the Glob tool. Included by default.
        doc: docs/code.claude.com/docs/en/env-vars.md#L309
      - key: env.CLAUDE_CODE_GLOB_NO_IGNORE
        label: Claude code glob no ignore
        section: other
        type: boolean
        description: Set to false to make the Glob tool respect .gitignore patterns. By default, Glob returns all matching files including gitignored ones.
        doc: docs/code.claude.com/docs/en/env-vars.md#L310
      - key: env.CLAUDE_CODE_GLOB_TIMEOUT_SECONDS
        label: Claude code glob timeout seconds
        section: other
        type: number
        default: 20
        description: Timeout in seconds for Glob and Grep tool searches. Defaults to 20 seconds on most platforms and 60 seconds on WSL
        doc: docs/code.claude.com/docs/en/env-vars.md#L311
      - key: env.CLAUDE_CODE_GOAL_CHECKIN_MINUTES
        label: Claude code goal checkin minutes
        section: other
        type: number
        description: How many minutes background work can keep an active goal waiting before Claude Code asks Claude to check on it. Default 30.
        doc: docs/code.claude.com/docs/en/env-vars.md#L312
      - key: env.CLAUDE_CODE_GZIP_REQUEST_BODIES
        label: Claude code gzip request bodies
        section: other
        type: boolean
        description: Set to 0 to turn off gzip compression of Claude API, telemetry, and artifact publish request bodies sent to api.anthropic.com.
        doc: docs/code.claude.com/docs/en/env-vars.md#L313
      - key: env.CLAUDE_CODE_HIDE_CWD
        label: Claude code hide cwd
        section: other
        type: boolean
        description: Set to 1 to hide the working directory in the startup logo. Useful for screenshares or recordings where the path exposes your OS username
        doc: docs/code.claude.com/docs/en/env-vars.md#L314
      - key: env.CLAUDE_CODE_IDE_HOST_OVERRIDE
        label: Claude code ide host override
        section: other
        type: string
        description: Override the host address used to connect to the IDE extension. By default Claude Code auto-detects the correct address, including WSL-to-Windows routing
        doc: docs/code.claude.com/docs/en/env-vars.md#L315
      - key: env.CLAUDE_CODE_IDE_SKIP_AUTO_INSTALL
        label: Claude code ide skip auto install
        section: startup
        type: boolean
        description: Set to 1 to stop /ide from installing the IDE extension. Equivalent to setting autoInstallIdeExtension to false
        doc: docs/code.claude.com/docs/en/env-vars.md#L316
      - key: env.CLAUDE_CODE_IDE_SKIP_VALID_CHECK
        label: Claude code ide skip valid check
        section: other
        type: boolean
        description: Set to 1 to skip validation of IDE lockfile entries during connection. Use when auto-connect fails to find your IDE despite it running
        doc: docs/code.claude.com/docs/en/env-vars.md#L317
      - key: env.CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS
        label: Claude code idle compact min tokens
        section: context
        type: number
        default: 200000
        description: 'Context size, in tokens, at which idle compaction applies to a conversation (default: 200000). Accepts a positive whole number, and anything else is ignored.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L318
      - key: env.CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS
        label: Claude code max concurrent subagents
        section: agents
        type: string
        description: 'How many subagents can be running in one session before the Agent tool refuses to spawn another (default: 20). Accepts a positive whole number in plain digits; anything else is ignored, so the variable can adjust the cap but can''t disable it.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L319
      - key: env.CLAUDE_CODE_MAX_CONTEXT_TOKENS
        label: Claude code max context tokens
        section: context
        type: number
        description: Override the context window size Claude Code assumes for the active model. As of v2.1.193, how it applies depends on how Claude Code resolves the model ID; see Correct the window for a gateway or custom model ID.
        doc: docs/code.claude.com/docs/en/env-vars.md#L320
      - key: env.CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH
        label: Claude code max mcp description length
        section: mcp
        type: number
        description: 'Maximum length in characters of MCP tool descriptions and MCP server instructions that Claude Code sends to the model. The value you set replaces both default limits: 4096, and 16384 for the description of a tool that Claude loads through tool search.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L321
      - key: env.CLAUDE_CODE_MAX_OUTPUT_TOKENS
        label: Claude code max output tokens
        section: model
        type: number
        default: 32000
        description: Set the maximum number of output tokens for most requests. Defaults and caps vary by model; see max output tokens.
        doc: docs/code.claude.com/docs/en/env-vars.md#L322
      - key: env.CLAUDE_CODE_MAX_RETRIES
        label: Claude code max retries
        section: other
        type: number
        default: 10
        description: 'Override the number of times to retry failed API requests (default: 10). Retrying can stop earlier on 529 overloaded errors.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L323
      - key: env.CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH
        label: Claude code max subagent spawn depth
        section: agents
        type: number
        default: 3
        description: 'Number of subagent layers allowed below the main conversation (default: 3). At the default, subagents can spawn their own subagents, and a subagent at the third layer can''t spawn further; set 1 to turn nesting off.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L325
      - key: env.CLAUDE_CODE_MAX_TURNS
        label: Claude code max turns
        section: autonomy
        type: number
        description: Cap the number of agentic turns when no explicit limit is passed. Equivalent to passing --max-turns, which takes precedence when both are set.
        doc: docs/code.claude.com/docs/en/env-vars.md#L326
      - key: env.CLAUDE_CODE_MAX_WEB_SEARCHES_PER_SESSION
        label: Claude code max web searches per session
        section: other
        type: string
        description: 'Cap on WebSearch calls (default: 200). When Claude reaches the cap, further WebSearch calls return a notice telling it to continue with the information it already gathered and say so in its answer.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L327
      - key: env.CLAUDE_CODE_MCP_ALLOWLIST_ENV
        label: Claude code mcp allowlist env
        section: mcp
        type: boolean
        description: Set to 1 to spawn stdio MCP servers with only a safe baseline environment plus the server's configured env, instead of inheriting your shell environment
        doc: docs/code.claude.com/docs/en/env-vars.md#L328
      - key: env.CLAUDE_CODE_MCP_AUTO_BACKGROUND_MS
        label: Claude code mcp auto background ms
        section: mcp
        type: number
        default: 120000
        description: 'Elapsed time in milliseconds before a still-running MCP tool call moves to a background task (default: 120000, or 2 minutes). Set to 0 to turn automatic backgrounding off and, in an interactive session, to make Claude wait for MCP tasks.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L329
      - key: env.CLAUDE_CODE_MCP_STARTUP_WAIT_MS
        label: Claude code mcp startup wait ms
        section: mcp
        type: number
        description: How long in milliseconds the first turn of a non-interactive session waits for MCP servers that are still connecting, in place of the default first-turn wait. In a self-hosted environment, it changes only how long the wait lasts.
        doc: docs/code.claude.com/docs/en/env-vars.md#L330
      - key: env.CLAUDE_CODE_MCP_TOOL_IDLE_TIMEOUT
        label: Claude code mcp tool idle timeout
        section: mcp
        type: number
        default: 300000
        description: Idle timeout in milliseconds for MCP tool calls. When a stdio, HTTP, SSE, WebSocket, or claude.ai connector MCP server sends no response and no progress notification for this long, the tool call aborts with an error instead of waiting for the overall MCP_TOOL_TIMEOUT.
        doc: docs/code.claude.com/docs/en/env-vars.md#L331
      - key: env.CLAUDE_CODE_NATIVE_CURSOR
        label: Claude code native cursor
        section: other
        type: boolean
        description: Set to 1 to show the terminal's own cursor at the input caret instead of a drawn block. The cursor respects the terminal's blink, shape, and focus settings.
        doc: docs/code.claude.com/docs/en/env-vars.md#L334
      - key: env.CLAUDE_CODE_NEW_INIT
        label: Claude code new init
        section: other
        type: boolean
        description: Set to 1 to make /init run an interactive setup flow. The flow asks which files to generate, including CLAUDE.md, skills, and hooks, before exploring the codebase and writing them.
        doc: docs/code.claude.com/docs/en/env-vars.md#L335
      - key: env.CLAUDE_CODE_NONBLOCKING_STDOUT
        label: Claude code nonblocking stdout
        section: other
        type: boolean
        description: Set to 1 to write terminal output through a second non-blocking file descriptor, so a terminal that stops reading, such as a paused tmux control-mode pane or a stalled SSH connection, can't freeze Claude Code mid-session. Applies on macOS, Linux, and WSL when stdout is a terminal.
        doc: docs/code.claude.com/docs/en/env-vars.md#L336
      - key: env.CLAUDE_CODE_NONSTREAMING_TIMEOUT_RETRIES
        label: Claude code nonstreaming timeout retries
        section: other
        type: number
        description: Limit how many times Claude Code re-sends a non-streaming request that times out. With 0, the request fails on the first timeout.
        doc: docs/code.claude.com/docs/en/env-vars.md#L337
      - key: env.CLAUDE_CODE_NO_FLICKER
        label: Claude code no flicker
        section: other
        type: boolean
        description: Set to 1 to enable fullscreen rendering, a research preview that reduces flicker and keeps memory flat in long conversations. Overrides the tui setting; you can also switch with /tui fullscreen
        doc: docs/code.claude.com/docs/en/env-vars.md#L338
      - key: env.CLAUDE_CODE_OAUTH_REFRESH_TOKEN
        label: Claude code oauth refresh token
        section: startup
        type: string
        description: OAuth refresh token for claude.ai authentication. When set, claude auth login exchanges this token directly instead of opening a browser.
        doc: docs/code.claude.com/docs/en/env-vars.md#L339
      - key: env.CLAUDE_CODE_OAUTH_SCOPES
        label: Claude code oauth scopes
        section: startup
        type: string
        description: Space-separated OAuth scopes the refresh token was issued with, such as "user:profile user:inference user:sessions:claude_code". Required when CLAUDE_CODE_OAUTH_REFRESH_TOKEN is set.
        doc: docs/code.claude.com/docs/en/env-vars.md#L340
      - key: env.CLAUDE_CODE_OAUTH_TOKEN
        label: Claude code oauth token
        section: startup
        type: string
        description: OAuth access token for claude.ai authentication. Alternative to /login for SDK and automated environments.
        doc: docs/code.claude.com/docs/en/env-vars.md#L341
      - key: env.CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH
        label: Claude code otel content max length
        section: telemetry
        type: number
        default: 61440
        description: 'Maximum length of content-bearing OpenTelemetry attributes (model responses, tool content, system prompts, raw API bodies), truncation marker included, in UTF-16 code units (default: 61440, i.e. 60 KB).'
        doc: docs/code.claude.com/docs/en/env-vars.md#L343
      - key: env.CLAUDE_CODE_OTEL_DIAG_STDERR
        label: Claude code otel diag stderr
        section: telemetry
        type: string
        description: Set to 1 to write OpenTelemetry exporter diagnostic errors to stderr. By default these errors only appear with --debug, so a misconfigured exporter such as a Prometheus port collision otherwise fails silently.
        doc: docs/code.claude.com/docs/en/env-vars.md#L344
      - key: env.CLAUDE_CODE_OTEL_FLUSH_TIMEOUT_MS
        label: Claude code otel flush timeout ms
        section: telemetry
        type: number
        default: 5000
        description: 'Timeout in milliseconds for flushing pending OpenTelemetry spans (default: 5000). See Monitoring'
        doc: docs/code.claude.com/docs/en/env-vars.md#L345
      - key: env.CLAUDE_CODE_OTEL_HEADERS_HELPER_DEBOUNCE_MS
        label: Claude code otel headers helper debounce ms
        section: telemetry
        type: number
        default: 1740000
        description: 'Interval for refreshing dynamic OpenTelemetry headers in milliseconds (default: 1740000 / 29 minutes). See Dynamic headers'
        doc: docs/code.claude.com/docs/en/env-vars.md#L346
      - key: env.CLAUDE_CODE_OTEL_SHUTDOWN_TIMEOUT_MS
        label: Claude code otel shutdown timeout ms
        section: telemetry
        type: number
        default: 2000
        description: 'Timeout in milliseconds for the OpenTelemetry exporter to finish on shutdown (default: 2000). Increase if metrics are dropped at exit.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L347
      - key: env.CLAUDE_CODE_OVERLOADED_RETRY_BASE_DELAY_MS
        label: Claude code overloaded retry base delay ms
        section: other
        type: number
        description: Starting delay in milliseconds, in place of the default 500, of the exponential backoff between automatic retries of a request that the API rejects with a 529 overloaded error. Raise it to spread the retries over a longer window when the API is at capacity.
        doc: docs/code.claude.com/docs/en/env-vars.md#L348
      - key: env.CLAUDE_CODE_OVERLOADED_RETRY_MAX_DELAY_MS
        label: Claude code overloaded retry max delay ms
        section: other
        type: number
        description: Ceiling in milliseconds, in place of the default 32000, on the exponential backoff between automatic retries of a request that the API rejects with a 529 overloaded error. Raise it so that later retries keep spreading apart when the API is at capacity.
        doc: docs/code.claude.com/docs/en/env-vars.md#L349
      - key: env.CLAUDE_CODE_PACKAGE_MANAGER_AUTO_UPDATE
        label: Claude code package manager auto update
        section: startup
        type: boolean
        description: Set to 1 to let Claude Code run your package manager's upgrade command in the background when a new version is available. Applies to Homebrew and WinGet installations.
        doc: docs/code.claude.com/docs/en/env-vars.md#L350
      - key: env.CLAUDE_CODE_PERFORCE_MODE
        label: Claude code perforce mode
        section: other
        type: boolean
        description: Set to 1 to enable Perforce-aware write protection. When set, Edit, Write, and NotebookEdit fail with a p4 edit <file> hint if the target file lacks the owner-write bit, which Perforce clears on synced files until p4 edit opens them.
        doc: docs/code.claude.com/docs/en/env-vars.md#L351
      - key: env.CLAUDE_CODE_PLUGIN_CACHE_DIR
        label: Claude code plugin cache dir
        section: extensions
        type: string
        description: 'Override the plugins root directory. Despite the name, this sets the parent directory, not the cache itself: marketplaces and the plugin cache live in subdirectories under this path.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L352
      - key: env.CLAUDE_CODE_PLUGIN_DIRS
        label: Claude code plugin dirs
        section: extensions
        type: string
        description: 'Plugin directories to load for the session, each loaded the way a --plugin-dir flag loads it. Separate multiple paths with : on Unix or ; on Windows.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L353
      - key: env.CLAUDE_CODE_PLUGIN_DIR_WATCH
        label: Claude code plugin dir watch
        section: extensions
        type: boolean
        description: Controls whether Claude Code reloads a mod when the mod's files change. Reloading applies to a mod you load from a directory with --plugin-dir, and it's on by default in interactive sessions.
        doc: docs/code.claude.com/docs/en/env-vars.md#L354
      - key: env.CLAUDE_CODE_PLUGIN_GIT_TIMEOUT_MS
        label: Claude code plugin git timeout ms
        section: extensions
        type: number
        default: 120000
        description: 'Timeout in milliseconds for cloning or refreshing a plugin marketplace (default: 120000). Increase this value for large repositories or slow network connections.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L355
      - key: env.CLAUDE_CODE_PLUGIN_KEEP_MARKETPLACE_ON_FAILURE
        label: Claude code plugin keep marketplace on failure
        section: extensions
        type: boolean
        description: Set to 1 to skip the re-clone attempt and keep using the existing marketplace checkout when a marketplace refresh can't reach or authenticate to the remote. Useful in offline or airgapped environments where re-cloning would fail the same way.
        doc: docs/code.claude.com/docs/en/env-vars.md#L356
      - key: env.CLAUDE_CODE_PLUGIN_PREFER_HTTPS
        label: Claude code plugin prefer https
        section: extensions
        type: boolean
        description: Set to 1 to clone GitHub owner/repo shorthand sources over HTTPS instead of SSH. Applies to plugin install and update, and to /plugin marketplace add and update.
        doc: docs/code.claude.com/docs/en/env-vars.md#L357
      - key: env.CLAUDE_CODE_PLUGIN_SEED_DIR
        label: Claude code plugin seed dir
        section: extensions
        type: string
        description: 'Path to one or more read-only plugin seed directories, separated by : on Unix or ; on Windows. Use this to bundle a pre-populated plugins directory into a container image.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L358
      - key: env.CLAUDE_CODE_POWERSHELL_RESPECT_EXECUTION_POLICY
        label: Claude code powershell respect execution policy
        section: autonomy
        type: boolean
        description: Set to 1 to stop Claude Code from passing -ExecutionPolicy Bypass when spawning PowerShell for tool calls, hooks, and status line commands, and respect the machine's effective execution policy instead.
        doc: docs/code.claude.com/docs/en/env-vars.md#L359
      - key: env.CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS
        label: Claude code print bg wait ceiling ms
        section: other
        type: number
        description: Ceiling in milliseconds on idle waiting for background work, such as subagents and workflows, after the final turn in non-interactive mode with the -p flag. Idle waiting starts over each time Claude takes a turn to handle a background result.
        doc: docs/code.claude.com/docs/en/env-vars.md#L360
      - key: env.CLAUDE_CODE_PROCESS_WRAPPER
        label: Claude code process wrapper
        section: other
        type: string
        description: Launch the processes Claude Code starts from its own binary, such as the background service that hosts agent view sessions, through a corporate launcher given as an argv prefix like /opt/corp/launcher.
        doc: docs/code.claude.com/docs/en/env-vars.md#L361
      - key: env.CLAUDE_CODE_PROJECT_DIR_NAME
        label: Claude code project dir name
        section: other
        type: string
        description: Set together with CLAUDE_CONFIG_DIR to choose the projects/ directory name Claude Code stores that session's transcripts and auto memory under, in place of one derived from the working directory path.
        doc: docs/code.claude.com/docs/en/env-vars.md#L362
      - key: env.CLAUDE_CODE_PROMPT_CACHE_TTL
        label: Claude code prompt cache ttl
        section: context
        type: number
        description: 'Set 5m or 1h, the only values Claude Code accepts, to choose the prompt cache TTL for the main conversation: your interactive, -p, and SDK turns, plus the helpers that run inline with them. Takes precedence over the promptCacheTtl setting and over ENABLE_PROMPT_CACHING_1H, and FORCE_PROMPT_CACHING_5M overrides it.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L363
      - key: env.CLAUDE_CODE_PROPAGATE_TRACEPARENT
        label: Claude code propagate traceparent
        section: telemetry
        type: string
        description: Set to 1 to propagate W3C trace context when ANTHROPIC_BASE_URL points at a custom proxy. Propagation covers the traceparent header on model and HTTP MCP requests and the TRACEPARENT environment variable for Bash, PowerShell, and hook subprocesses.
        doc: docs/code.claude.com/docs/en/env-vars.md#L364
      - key: env.CLAUDE_CODE_PROXY_RESOLVES_HOSTS
        label: Claude code proxy resolves hosts
        section: other
        type: boolean
        description: Set to 1 to allow the proxy to perform DNS resolution instead of the caller. Opt-in for environments where the proxy should handle hostname resolution
        doc: docs/code.claude.com/docs/en/env-vars.md#L366
      - key: env.CLAUDE_CODE_REMOTE
        label: Claude code remote
        section: other
        type: boolean
        description: Set automatically to true when Claude Code is running as a cloud session. Read this from a hook or setup script to detect whether you are in a cloud session
        doc: docs/code.claude.com/docs/en/env-vars.md#L367
      - key: env.CLAUDE_CODE_RESTRICTED
        label: Claude code restricted
        section: autonomy
        type: boolean
        description: Set to 1 to start the session in restricted mode, the same as passing --restricted. Claude Code ignores this variable in a settings file's env block.
        doc: docs/code.claude.com/docs/en/env-vars.md#L369
      - key: env.CLAUDE_CODE_RESUME_INTERRUPTED_TURN
        label: Claude code resume interrupted turn
        section: other
        type: boolean
        description: Set to 1 to automatically resume if the previous session ended mid-turn. Used in SDK mode so the model continues without requiring the SDK to re-send the prompt.
        doc: docs/code.claude.com/docs/en/env-vars.md#L370
      - key: env.CLAUDE_CODE_RESUME_INTERRUPTED_TURN_MAX_AGE_MS
        label: Claude code resume interrupted turn max age ms
        section: other
        type: number
        description: Maximum age in milliseconds of the last transcript message for a session that ended mid-turn to continue automatically on resume.
        doc: docs/code.claude.com/docs/en/env-vars.md#L371
      - key: env.CLAUDE_CODE_RESUME_PROMPT
        label: Claude code resume prompt
        section: context
        type: string
        description: Override the continuation message Claude Code sends to Claude when CLAUDE_CODE_RESUME_INTERRUPTED_TURN continues an interrupted turn instead of resending its prompt, or when you resume a deferred tool call with -p. Defaults to Continue from where you left off..
        doc: docs/code.claude.com/docs/en/env-vars.md#L372
      - key: env.CLAUDE_CODE_RESUME_SHOWS_CUT_OFF_CALLS
        label: Claude code resume shows cut off calls
        section: other
        type: boolean
        description: Set to 1 to keep interrupted tool calls, marked as cut off, in a turn that CLAUDE_CODE_RESUME_INTERRUPTED_TURN continues. When unset, those calls are dropped before the turn continues.
        doc: docs/code.claude.com/docs/en/env-vars.md#L373
      - key: env.CLAUDE_CODE_RETRY_WATCHDOG
        label: Claude code retry watchdog
        section: other
        type: boolean
        description: Set to 1 for unattended sessions such as eval harnesses, CI jobs, or remote workers. Retries 429 and 529 capacity errors indefinitely instead of failing after CLAUDE_CODE_MAX_RETRIES attempts.
        doc: docs/code.claude.com/docs/en/env-vars.md#L374
      - key: env.CLAUDE_CODE_RETRY_WATCHDOG_MAX_WAIT_MS
        label: Claude code retry watchdog max wait ms
        section: other
        type: number
        description: Maximum time in milliseconds that each API request spends waiting out 429 and 529 errors when CLAUDE_CODE_RETRY_WATCHDOG is set. Once that time is spent, the next such error ends the request.
        doc: docs/code.claude.com/docs/en/env-vars.md#L375
      - key: env.CLAUDE_CODE_RETRY_WATCHDOG_USAGE_LIMIT_RECHECK_MS
        label: Claude code retry watchdog usage limit recheck ms
        section: other
        type: number
        description: Minimum interval in milliseconds between checks of whether a usage limit was already lifted, while a request waits for that limit to reset with CLAUDE_CODE_RETRY_WATCHDOG set. When a check finds the limit lifted, the request goes out at once.
        doc: docs/code.claude.com/docs/en/env-vars.md#L376
      - key: env.CLAUDE_CODE_SAFE_MODE
        label: Claude code safe mode
        section: autonomy
        type: boolean
        description: 'Set to 1 to start in safe mode: CLAUDE.md, skills, plugins, hooks, MCP servers, custom commands and agents, output styles, workflows, custom themes, custom keybindings, status line and file-suggestion commands, LSP servers, and auto memory do not load, for troubleshooting a broken configuration.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L377
      - key: env.CLAUDE_CODE_SCRIPT_CAPS
        label: Claude code script caps
        section: other
        type: number
        description: JSON object limiting how many times specific scripts may be invoked per session when CLAUDE_CODE_SUBPROCESS_ENV_SCRUB is set. Keys are substrings matched against the command text; values are integer call limits.
        doc: docs/code.claude.com/docs/en/env-vars.md#L378
      - key: env.CLAUDE_CODE_SCROLL_SPEED
        label: Claude code scroll speed
        section: other
        type: number
        description: Set the mouse wheel scroll multiplier in fullscreen rendering. Accepts any positive value up to 20, including fractional values below 1 such as 0.5 to slow accelerated trackpad and wheel scrolling in terminals that already amplify wheel events.
        doc: docs/code.claude.com/docs/en/env-vars.md#L379
      - key: env.CLAUDE_CODE_SEND_FEEDBACK
        label: Claude code send feedback
        section: telemetry
        type: boolean
        description: Set to 0 to turn off Claude-drafted feedback for a session. Set to 1 to turn it on where your account already has access; the variable can't grant access itself, and the other switches that turn feedback off, such as DISABLE_FEEDBACK_COMMAND and the feedbackDrafts setting's off value, still apply
        doc: docs/code.claude.com/docs/en/env-vars.md#L380
      - key: env.CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS
        label: Claude code sessionend hooks timeout ms
        section: hooks
        type: number
        description: Override the time budget in milliseconds for SessionEnd hooks. The value is also the timeout for each hook that sets no timeout of its own.
        doc: docs/code.claude.com/docs/en/env-vars.md#L381
      - key: env.CLAUDE_CODE_SHELL
        label: Claude code shell
        section: other
        type: string
        description: Set the shell Claude Code uses to run Bash tool commands. Accepts a path to a bash or zsh binary, for example /opt/homebrew/bin/bash.
        doc: docs/code.claude.com/docs/en/env-vars.md#L383
      - key: env.CLAUDE_CODE_SHELL_PREFIX
        label: Claude code shell prefix
        section: other
        type: string
        description: 'Command prefix that wraps shell commands Claude Code spawns: Bash tool calls, hook commands, status line commands, and stdio MCP server startup commands. PowerShell hooks and exec-form hooks run without the prefix.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L384
      - key: env.CLAUDE_CODE_SIMPLE
        label: Claude code simple
        section: other
        type: boolean
        description: Set to 1 to run with a minimal system prompt and only the Bash, file read, and file edit tools. MCP tools from --mcp-config are still available.
        doc: docs/code.claude.com/docs/en/env-vars.md#L385
      - key: env.CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT
        label: Claude code simple system prompt
        section: context
        type: boolean
        description: Choose between Claude Code's full system prompt and a shorter one with abbreviated tool descriptions. When unset, Haiku 4.5, Sonnet 5, Opus 4.7, and earlier models in those families use the full prompt by default, and newer models use the shorter one.
        doc: docs/code.claude.com/docs/en/env-vars.md#L386
      - key: env.CLAUDE_CODE_SKIP_ANTHROPIC_AWS_AUTH
        label: Claude code skip anthropic aws auth
        section: startup
        type: boolean
        description: Skip client-side authentication for Claude Platform on AWS, for gateways that sign requests themselves
        doc: docs/code.claude.com/docs/en/env-vars.md#L387
      - key: env.CLAUDE_CODE_SKIP_AWS_CRED_CACHE
        label: Claude code skip aws cred cache
        section: other
        type: boolean
        description: Set to 1 to turn off the in-process cache of credentials resolved from the AWS default credential provider chain, so Claude Code resolves the chain on every API request. With the cache off, an SSO-backed profile requests credentials from IAM Identity Center on every request.
        doc: docs/code.claude.com/docs/en/env-vars.md#L388
      - key: env.CLAUDE_CODE_SKIP_BEDROCK_AUTH
        label: Claude code skip bedrock auth
        section: startup
        type: boolean
        description: Skip AWS authentication for Amazon Bedrock (for example, when using an LLM gateway)
        doc: docs/code.claude.com/docs/en/env-vars.md#L389
      - key: env.CLAUDE_CODE_SKIP_FAST_MODE_NETWORK_ERRORS
        label: Claude code skip fast mode network errors
        section: other
        type: boolean
        description: Set to 1 to treat a failed fast mode availability check as available, for networks that block the check's direct request to api.anthropic.com. Claude Code still honors a "disabled by your organization" response
        doc: docs/code.claude.com/docs/en/env-vars.md#L390
      - key: env.CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK
        label: Claude code skip fast mode org check
        section: other
        type: boolean
        description: Set to 1 to skip the client-side fast mode availability check, for proxies that intercept the check's request rather than refuse it. The API still rejects fast mode requests when your organization has fast mode disabled
        doc: docs/code.claude.com/docs/en/env-vars.md#L391
      - key: env.CLAUDE_CODE_SKIP_FOUNDRY_AUTH
        label: Claude code skip foundry auth
        section: startup
        type: boolean
        description: Skip Azure authentication for Microsoft Foundry, for a proxy or gateway that injects its own Authorization header. Claude Code sends requests without an Azure credential and preserves the Authorization header you supply, for example through ANTHROPIC_CUSTOM_HEADERS.
        doc: docs/code.claude.com/docs/en/env-vars.md#L392
      - key: env.CLAUDE_CODE_SKIP_MANTLE_AUTH
        label: Claude code skip mantle auth
        section: startup
        type: boolean
        description: Skip AWS authentication for Amazon Bedrock Mantle (for example, when using an LLM gateway)
        doc: docs/code.claude.com/docs/en/env-vars.md#L393
      - key: env.CLAUDE_CODE_SKIP_MODEL_ACCESS_MEMORY
        label: Claude code skip model access memory
        section: context
        type: boolean
        description: The startup model checks on Amazon Bedrock and Google Cloud's Agent Platform remember on this machine which models they found your account can't invoke, for up to a day. Set to 1 to turn that memory off.
        doc: docs/code.claude.com/docs/en/env-vars.md#L394
      - key: env.CLAUDE_CODE_SKIP_PROMPT_HISTORY
        label: Claude code skip prompt history
        section: telemetry
        type: boolean
        description: Set to 1 to skip writing prompt history and session transcripts to disk. Sessions started with this variable set do not appear in --resume, --continue, or up-arrow history.
        doc: docs/code.claude.com/docs/en/env-vars.md#L395
      - key: env.CLAUDE_CODE_SKIP_VERTEX_AUTH
        label: Claude code skip vertex auth
        section: startup
        type: boolean
        description: Skip Google authentication for Google Cloud's Agent Platform (for example, when using an LLM gateway)
        doc: docs/code.claude.com/docs/en/env-vars.md#L396
      - key: env.CLAUDE_CODE_STARTUP_FAILURE_RESULTS
        label: Claude code startup failure results
        section: startup
        type: boolean
        description: Set to 1 to have a session started with --output-format stream-json write a result message naming why Claude Code refused to start for startup failures that otherwise end with stderr alone. Requires Claude Code v2.1.274 or later
        doc: docs/code.claude.com/docs/en/env-vars.md#L397
      - key: env.CLAUDE_CODE_STOP_HOOK_BLOCK_CAP
        label: Claude code stop hook block cap
        section: hooks
        type: number
        default: 8
        description: 'Maximum number of consecutive times a Stop or SubagentStop hook may block the turn from ending before Claude Code overrides it and ends the turn anyway (default: 8). Set to 0 to disable the cap.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L398
      - key: env.CLAUDE_CODE_SUBAGENT_MODEL
        label: Claude code subagent model
        section: agents
        type: string
        description: The default model for subagents, agent team teammates, and workflow agents that aren't assigned a model another way. Accepts an alias such as haiku or a full model name.
        doc: docs/code.claude.com/docs/en/env-vars.md#L399
      - key: env.CLAUDE_CODE_SUBAGENT_MODEL_FORCE
        label: Claude code subagent model force
        section: agents
        type: boolean
        description: Set to 1 to force one model onto subagents, teammates, and workflow agents. Run every subagent on one model says which model that is.
        doc: docs/code.claude.com/docs/en/env-vars.md#L400
      - key: env.CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL
        label: Claude code subagent prompt cache ttl
        section: agents
        type: number
        description: Set 5m or 1h, the only values Claude Code accepts, to choose the prompt cache TTL for requests outside the main conversation, such as subagents, workflows, and background work. Takes precedence over the subagentPromptCacheTtl setting and over ENABLE_PROMPT_CACHING_1H, and FORCE_PROMPT_CACHING_5M overrides it.
        doc: docs/code.claude.com/docs/en/env-vars.md#L401
      - key: env.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
        label: Claude code subprocess env scrub
        section: autonomy
        type: boolean
        description: Set to 1 to strip credentials from the environments of the subprocesses Claude Code starts, such as Bash commands, hooks, and stdio MCP servers. The scrub recognizes a credential by its variable name or its value, and it leaves GitHub tokens and proxy settings in place.
        doc: docs/code.claude.com/docs/en/env-vars.md#L402
      - key: env.CLAUDE_CODE_SYNC_PLUGIN_INSTALL
        label: Claude code sync plugin install
        section: extensions
        type: boolean
        description: Set to 1 in non-interactive mode (the -p flag) to wait for plugin installation to complete before the first query. Without this, plugins install in the background and may not be available on the first turn.
        doc: docs/code.claude.com/docs/en/env-vars.md#L403
      - key: env.CLAUDE_CODE_SYNC_PLUGIN_INSTALL_TIMEOUT_MS
        label: Claude code sync plugin install timeout ms
        section: extensions
        type: number
        description: Timeout in milliseconds for synchronous plugin installation. When exceeded, Claude Code proceeds without plugins and logs an error.
        doc: docs/code.claude.com/docs/en/env-vars.md#L404
      - key: env.CLAUDE_CODE_SYNC_SKILLS
        label: Claude code sync skills
        section: extensions
        type: boolean
        description: Set to 1 in non-interactive mode with the -p flag to make Claude Code download the skills enabled for your claude.ai account in that run and wait for the list of them, up to CLAUDE_CODE_SYNC_SKILLS_WAIT_TIMEOUT_MS, before it runs the first query. Requires claude.ai authentication.
        doc: docs/code.claude.com/docs/en/env-vars.md#L405
      - key: env.CLAUDE_CODE_SYNC_SKILLS_INSTALL_TIMEOUT_MS
        label: Claude code sync skills install timeout ms
        section: extensions
        type: number
        default: 30000
        description: 'Timeout in milliseconds for the skills resync that runs mid-session when an app built on the Agent SDK reloads skills (default: 30000). When exceeded, the reload continues with whichever skills have arrived, and the remaining downloads finish in the background'
        doc: docs/code.claude.com/docs/en/env-vars.md#L406
      - key: env.CLAUDE_CODE_SYNC_SKILLS_WAIT_TIMEOUT_MS
        label: Claude code sync skills wait timeout ms
        section: extensions
        type: number
        default: 5000
        description: 'Timeout in milliseconds for the first query to wait for the initial skill list when CLAUDE_CODE_SYNC_SKILLS is set (default: 5000). When exceeded, the first query runs with whichever skills have arrived.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L407
      - key: env.CLAUDE_CODE_SYNTAX_HIGHLIGHT
        label: Claude code syntax highlight
        section: other
        type: boolean
        description: Set to false to disable syntax highlighting in diff output. Useful when colors interfere with your terminal setup.
        doc: docs/code.claude.com/docs/en/env-vars.md#L408
      - key: env.CLAUDE_CODE_TASK_LIST_ID
        label: Claude code task list id
        section: other
        type: string
        description: Share a task list across sessions. Set the same ID in multiple Claude Code instances to coordinate on a shared task list, in sessions that have the Task tools.
        doc: docs/code.claude.com/docs/en/env-vars.md#L409
      - key: env.CLAUDE_CODE_TMPDIR
        label: Claude code tmpdir
        section: other
        type: string
        description: Override the temp directory used for internal temp files. Claude Code appends /claude-{uid}/ to this path on Unix, or /claude/ on Windows.
        doc: docs/code.claude.com/docs/en/env-vars.md#L410
      - key: env.CLAUDE_CODE_TMUX_TRUECOLOR
        label: Claude code tmux truecolor
        section: other
        type: string
        description: Set to any non-empty value, such as 1, to allow 24-bit truecolor output inside tmux. Setting it to 0 or false still allows truecolor, unlike most on/off variables; unset the variable to restore the 256-color clamp.
        doc: docs/code.claude.com/docs/en/env-vars.md#L411
      - key: env.CLAUDE_CODE_TOOL_MEMORY_CGROUP_EXCLUDE
        label: Claude code tool memory cgroup exclude
        section: context
        type: string
        description: On Linux and WSL, set to a comma-separated list of the kinds of processes Claude Code excludes from the tool memory cap, such as mcp or lsp. Set none to cap every kind, or all-new to cap only Bash, PowerShell, and Monitor tool commands.
        doc: docs/code.claude.com/docs/en/env-vars.md#L412
      - key: env.CLAUDE_CODE_TOOL_MEMORY_LIMIT
        label: Claude code tool memory limit
        section: context
        type: number
        description: On Linux and WSL, set to a size such as 4G to cap the memory that Bash and PowerShell tool commands can use, and Monitor tool commands on v2.1.246 or later. Write the size in plain digits, alone for a number of bytes or with a K, M, G, or T suffix.
        doc: docs/code.claude.com/docs/en/env-vars.md#L413
      - key: env.CLAUDE_CODE_TRANSCRIPT_LOCAL_GC
        label: Claude code transcript local gc
        section: telemetry
        type: boolean
        description: Set to 1 to limit how large the transcript file of a long -p or Agent SDK session grows. After each compaction, once the file is larger than 5 MB, Claude Code removes the history from before that compaction.
        doc: docs/code.claude.com/docs/en/env-vars.md#L414
      - key: env.CLAUDE_CODE_USER_DIALOG_TIMEOUT_MS
        label: Claude code user dialog timeout ms
        section: other
        type: number
        description: Deadline in milliseconds before Claude Code cancels a dialog it forwards to a remote client such as a Remote Control or SDK host, or the approval dialog for a held cross-session message; permission prompts and AskUserQuestion questions use their own flows and aren't governed by it.
        doc: docs/code.claude.com/docs/en/env-vars.md#L415
      - key: env.CLAUDE_CODE_USE_ANTHROPIC_AWS
        label: Claude code use anthropic aws
        section: model
        type: boolean
        description: Use Claude Platform on AWS
        doc: docs/code.claude.com/docs/en/env-vars.md#L416
      - key: env.CLAUDE_CODE_USE_BEDROCK
        label: Claude code use bedrock
        section: model
        type: boolean
        description: Use Amazon Bedrock
        doc: docs/code.claude.com/docs/en/env-vars.md#L417
      - key: env.CLAUDE_CODE_USE_FOUNDRY
        label: Claude code use foundry
        section: model
        type: boolean
        description: Use Microsoft Foundry
        doc: docs/code.claude.com/docs/en/env-vars.md#L418
      - key: env.CLAUDE_CODE_USE_MANTLE
        label: Claude code use mantle
        section: model
        type: boolean
        description: Use the Amazon Bedrock Mantle endpoint
        doc: docs/code.claude.com/docs/en/env-vars.md#L419
      - key: env.CLAUDE_CODE_USE_POWERSHELL_TOOL
        label: Claude code use powershell tool
        section: other
        type: boolean
        description: Controls the PowerShell tool. On Windows without Git Bash, the tool is enabled automatically; set to 0 to disable it.
        doc: docs/code.claude.com/docs/en/env-vars.md#L420
      - key: env.CLAUDE_CODE_USE_VERTEX
        label: Claude code use vertex
        section: model
        type: boolean
        description: Use Google Cloud's Agent Platform
        doc: docs/code.claude.com/docs/en/env-vars.md#L421
      - key: env.CLAUDE_CODE_WARN_DISK_FREE_GIB
        label: Claude code warn disk free gib
        section: other
        type: number
        description: Set to a whole number of GiB, such as 10, to have Claude Code warn Claude when free space on the working directory's filesystem falls below that amount. The warning is a system reminder saying how much is free.
        doc: docs/code.claude.com/docs/en/env-vars.md#L422
      - key: env.CLAUDE_CODE_WARN_MEMORY_FREE_GIB
        label: Claude code warn memory free gib
        section: context
        type: number
        description: On Linux and WSL, set to a whole number of GiB such as 4 to have Claude Code warn Claude when available memory falls below that amount. The warning is a system reminder saying how much is available.
        doc: docs/code.claude.com/docs/en/env-vars.md#L423
      - key: env.CLAUDE_CODE_WEBFETCH_CACHE_TTL_MS
        label: Claude code webfetch cache ttl ms
        section: other
        type: number
        default: 900000
        description: Set to the number of milliseconds WebFetch keeps each fetched URL's response cached. The default is 900000, which is 15 minutes.
        doc: docs/code.claude.com/docs/en/env-vars.md#L424
      - key: env.CLAUDE_CODE_WEBFETCH_DEADLINE_MS
        label: Claude code webfetch deadline ms
        section: other
        type: number
        default: 300000
        description: Upper bound in milliseconds on how long WebFetch waits for a page to download, including any redirects it follows. A download that hasn't completed by then fails with a deadline error.
        doc: docs/code.claude.com/docs/en/env-vars.md#L425
      - key: env.CLAUDE_CODE_WEB_SEARCH_REFILLS_PER_HOUR
        label: Claude code web search refills per hour
        section: other
        type: number
        default: 100
        description: Rate at which a session's WebSearch limit refills, in calls per hour. The default is 100 in an interactive terminal session.
        doc: docs/code.claude.com/docs/en/env-vars.md#L426
      - key: env.CLAUDE_CODE_WORKER_CHECKIN_SCHEDULE
        label: Claude code worker checkin schedule
        section: other
        type: string
        description: When CLAUDE_AUTO_BACKGROUND_TASKS is set to 1, how long Claude Code waits before each reminder to Claude to check on background subagents that are still running. Takes one or more comma-separated waits in whole seconds from 1 to 86400, such as 600 or 600,1800,3600.
        doc: docs/code.claude.com/docs/en/env-vars.md#L427
      - key: env.CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS
        label: Claude code workflow max concurrent agents
        section: agents
        type: string
        description: How many agents a single workflow run executes at once, from 1 to 256. By default, a run executes up to 16 agents at once, fewer when Claude Code has fewer CPUs available; queued agent() calls wait for a free slot.
        doc: docs/code.claude.com/docs/en/env-vars.md#L428
      - key: env.CLAUDE_CODE_WORKFLOW_PREFIX_STAGGER_MS
        label: Claude code workflow prefix stagger ms
        section: other
        type: number
        description: Upper bound in milliseconds on how long a workflow agent waits for a same-prefix sibling's first response to begin before sending its own first request.
        doc: docs/code.claude.com/docs/en/env-vars.md#L429
      - key: env.CLAUDE_CODE_YOU_SHOULD_KNOW_DEBUG
        label: Claude code you should know debug
        section: other
        type: boolean
        description: Set to 1 to show, above the prompt, a line for each of the last three checks the You should know mod made in this session. Use it to confirm the mod is checking when no notes appear.
        doc: docs/code.claude.com/docs/en/env-vars.md#L430
      - key: env.CLAUDE_CONFIG_DIR
        label: Claude config dir
        section: startup
        type: string
        description: 'Override the configuration directory (default: ~/.claude). All settings, session history, and plugins are stored under this path.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L431
      - key: env.CLAUDE_EFFORT
        label: Claude effort
        section: model
        type: string
        description: 'Set automatically in Bash tool subprocesses and hook commands to the effort level setting when the subprocess starts: low, medium, high, xhigh, or max. Matches the effort.level field passed to hooks.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L432
      - key: env.CLAUDE_ENABLE_BYTE_WATCHDOG
        label: Claude enable byte watchdog
        section: other
        type: boolean
        description: Set to 1 to force-enable the byte-level streaming idle watchdog, or set to 0 to force-disable it. 0 also turns off the first-byte deadline on the connections where that deadline runs.
        doc: docs/code.claude.com/docs/en/env-vars.md#L433
      - key: env.CLAUDE_ENABLE_BYTE_WATCHDOG_BEDROCK
        label: Claude enable byte watchdog bedrock
        section: other
        type: boolean
        description: Set to 1 to enable the byte-level streaming idle watchdog on Amazon Bedrock vnd.amazon.eventstream responses, which also enables the first-byte deadline on Bedrock streaming requests. Off by default.
        doc: docs/code.claude.com/docs/en/env-vars.md#L434
      - key: env.CLAUDE_ENABLE_STREAM_WATCHDOG
        label: Claude enable stream watchdog
        section: other
        type: boolean
        description: Set to 0 to force-disable the event-level streaming idle watchdog, or set to 1 to force-enable it. When unset, the watchdog is on by default for all providers.
        doc: docs/code.claude.com/docs/en/env-vars.md#L435
      - key: env.CLAUDE_ENV_FILE
        label: Claude env file
        section: other
        type: string
        description: Path to a shell script whose contents Claude Code runs before each Bash command in the same shell process, so exports in the file are visible to the command. Use to persist virtualenv or conda activation across commands.
        doc: docs/code.claude.com/docs/en/env-vars.md#L436
      - key: env.CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
        label: Claude remote control session name prefix
        section: other
        type: string
        description: Prefix for auto-generated Remote Control session names when no explicit name is provided. Defaults to your machine's hostname, producing names like myhost-graceful-unicorn.
        doc: docs/code.claude.com/docs/en/env-vars.md#L439
      - key: env.CLAUDE_STREAM_FIRST_BYTE_TIMEOUT_MS
        label: Claude stream first byte timeout ms
        section: other
        type: number
        description: Deadline in milliseconds for the first response byte of a streaming request, on the connections where the first-byte deadline runs. For how Claude Code clamps it, the extra time it adds for large request bodies, and how it picks the deadline when you leave this unset, see No response from API.
        doc: docs/code.claude.com/docs/en/env-vars.md#L440
      - key: env.CLAUDE_STREAM_IDLE_TIMEOUT_MS
        label: Claude stream idle timeout ms
        section: other
        type: number
        description: Timeout in milliseconds before the event- and byte-level streaming idle watchdogs close a stalled connection.
        doc: docs/code.claude.com/docs/en/env-vars.md#L441
      - key: env.DEBUG
        label: Debug
        section: telemetry
        type: boolean
        description: Set to 1 to enable debug mode, equivalent to launching with --debug. Debug logs are written to ~/.claude/debug/<session-id>.txt, or to the path set by CLAUDE_CODE_DEBUG_LOGS_DIR.
        doc: docs/code.claude.com/docs/en/env-vars.md#L443
      - key: env.DISABLE_AUTOUPDATER
        label: Disable autoupdater
        section: startup
        type: boolean
        description: Set to 1 to disable automatic background updates. Manual claude update still works.
        doc: docs/code.claude.com/docs/en/env-vars.md#L444
      - key: env.DISABLE_AUTO_COMPACT
        label: Disable auto compact
        section: context
        type: boolean
        description: Set to 1 to disable automatic compaction when approaching the context limit, along with idle compaction. The manual /compact command remains available.
        doc: docs/code.claude.com/docs/en/env-vars.md#L445
      - key: env.DISABLE_COMPACT
        label: Disable compact
        section: context
        type: boolean
        description: 'Set to 1 to disable all compaction: both automatic compaction and the manual /compact command'
        doc: docs/code.claude.com/docs/en/env-vars.md#L446
      - key: env.DISABLE_COST_WARNINGS
        label: Disable cost warnings
        section: telemetry
        type: boolean
        description: Set to 1 to disable cost warning messages
        doc: docs/code.claude.com/docs/en/env-vars.md#L447
      - key: env.DISABLE_DOCTOR_COMMAND
        label: Disable doctor command
        section: other
        type: boolean
        description: Set to 1 to hide the /doctor setup checkup skill and its /checkup alias. Useful for managed deployments where users shouldn't run setup diagnostics from a session.
        doc: docs/code.claude.com/docs/en/env-vars.md#L448
      - key: env.DISABLE_ERROR_REPORTING
        label: Disable error reporting
        section: telemetry
        type: boolean
        description: Set to any non-empty value, such as 1, to opt out of error reporting. Setting it to 0 or false still opts out, unlike most on/off variables; unset the variable to turn error reporting back on
        doc: docs/code.claude.com/docs/en/env-vars.md#L449
      - key: env.DISABLE_EXTRA_USAGE_COMMAND
        label: Disable extra usage command
        section: other
        type: boolean
        description: Set to 1 to hide the /usage-credits command that lets users purchase additional usage beyond rate limits
        doc: docs/code.claude.com/docs/en/env-vars.md#L450
      - key: env.DISABLE_FEEDBACK_COMMAND
        label: Disable feedback command
        section: telemetry
        type: boolean
        description: Set to 1 to disable the /feedback command and Claude-drafted feedback. Also disables /bug and /share, which report through the same path; before v2.1.212 they were aliases of /feedback, so the command was disabled under every name.
        doc: docs/code.claude.com/docs/en/env-vars.md#L451
      - key: env.DISABLE_GROWTHBOOK
        label: Disable growthbook
        section: telemetry
        type: boolean
        description: Set to 1 or true to disable feature-flag fetching and use code defaults for every flag. This makes Remote Control and the other features that need feature-flag fetching unavailable.
        doc: docs/code.claude.com/docs/en/env-vars.md#L452
      - key: env.DISABLE_INSTALLATION_CHECKS
        label: Disable installation checks
        section: startup
        type: boolean
        description: Set to 1 to disable installation warnings. Use only when manually managing the installation location, as this can mask issues with standard installations
        doc: docs/code.claude.com/docs/en/env-vars.md#L453
      - key: env.DISABLE_INSTALL_GITHUB_APP_COMMAND
        label: Disable install github app command
        section: startup
        type: boolean
        description: Set to 1 to hide the /install-github-app command. Already hidden when using third-party providers (Amazon Bedrock, Google Cloud's Agent Platform, or Microsoft Foundry)
        doc: docs/code.claude.com/docs/en/env-vars.md#L454
      - key: env.DISABLE_INTERLEAVED_THINKING
        label: Disable interleaved thinking
        section: other
        type: boolean
        description: Set to 1 to prevent sending the interleaved-thinking beta header. Useful when your LLM gateway or provider does not support interleaved thinking
        doc: docs/code.claude.com/docs/en/env-vars.md#L455
      - key: env.DISABLE_LOGIN_COMMAND
        label: Disable login command
        section: startup
        type: boolean
        description: Set to 1 to hide the /login command. Useful when authentication is handled externally via API keys or apiKeyHelper
        doc: docs/code.claude.com/docs/en/env-vars.md#L456
      - key: env.DISABLE_LOGOUT_COMMAND
        label: Disable logout command
        section: startup
        type: boolean
        description: Set to 1 to hide the /logout command
        doc: docs/code.claude.com/docs/en/env-vars.md#L457
      - key: env.DISABLE_PROMPT_CACHING
        label: Disable prompt caching
        section: context
        type: boolean
        description: Set to 1 to disable prompt caching for all models (takes precedence over per-model settings)
        doc: docs/code.claude.com/docs/en/env-vars.md#L458
      - key: env.DISABLE_PROMPT_CACHING_FABLE
        label: Disable prompt caching fable
        section: context
        type: boolean
        description: Set to 1 to disable prompt caching for Fable models
        doc: docs/code.claude.com/docs/en/env-vars.md#L459
      - key: env.DISABLE_PROMPT_CACHING_HAIKU
        label: Disable prompt caching haiku
        section: context
        type: boolean
        description: Set to 1 to disable prompt caching for the default Haiku model, wherever it runs
        doc: docs/code.claude.com/docs/en/env-vars.md#L460
      - key: env.DISABLE_PROMPT_CACHING_OPUS
        label: Disable prompt caching opus
        section: context
        type: boolean
        description: Set to 1 to disable prompt caching for the default Opus model
        doc: docs/code.claude.com/docs/en/env-vars.md#L461
      - key: env.DISABLE_PROMPT_CACHING_SONNET
        label: Disable prompt caching sonnet
        section: context
        type: boolean
        description: Set to 1 to disable prompt caching for the default Sonnet model
        doc: docs/code.claude.com/docs/en/env-vars.md#L462
      - key: env.DISABLE_TELEMETRY
        label: Disable telemetry
        section: telemetry
        type: boolean
        description: Set to any non-empty value, such as 1, to opt out of telemetry. Setting it to 0 or false still opts out, unlike most on/off variables; unset the variable to turn telemetry back on.
        doc: docs/code.claude.com/docs/en/env-vars.md#L463
      - key: env.DISABLE_UPDATES
        label: Disable updates
        section: startup
        type: boolean
        description: Set to 1 to block all updates including manual claude update and claude install. Stricter than DISABLE_AUTOUPDATER.
        doc: docs/code.claude.com/docs/en/env-vars.md#L464
      - key: env.DISABLE_UPGRADE_COMMAND
        label: Disable upgrade command
        section: startup
        type: boolean
        description: Set to 1 to hide the /upgrade command
        doc: docs/code.claude.com/docs/en/env-vars.md#L465
      - key: env.DO_NOT_TRACK
        label: Do not track
        section: telemetry
        type: boolean
        description: Set to 1 to opt out of telemetry, with the same effect as DISABLE_TELEMETRY, including on feature-flag fetching. Claude Code reads this variable as a standard boolean, so 0 leaves telemetry on, and honors it as the cross-tool convention recognized by many developer CLIs
        doc: docs/code.claude.com/docs/en/env-vars.md#L466
      - key: env.ENABLE_BETA_TRACING_DETAILED
        label: Enable beta tracing detailed
        section: telemetry
        type: boolean
        description: Set to 1, and set BETA_TRACING_ENDPOINT to your OTLP/HTTP collector endpoint, to turn on detailed beta tracing, which adds content-bearing span attributes and the claude_code.hook span. Interactive CLI sessions also require your organization to be allowlisted for the beta.
        doc: docs/code.claude.com/docs/en/env-vars.md#L467
      - key: env.ENABLE_CLAUDEAI_MCP_SERVERS
        label: Enable claudeai mcp servers
        section: mcp
        type: boolean
        description: Set to false to stop Claude Code from fetching claude.ai MCP servers. Enabled by default for logged-in users.
        doc: docs/code.claude.com/docs/en/env-vars.md#L468
      - key: env.ENABLE_PROMPT_CACHING_1H
        label: Enable prompt caching 1h
        section: model
        type: boolean
        description: Set to 1 to request a 1-hour prompt cache TTL instead of the default 5 minutes. Intended for API key, Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry, and Claude Platform on AWS users.
        doc: docs/code.claude.com/docs/en/env-vars.md#L469
      - key: env.ENABLE_PROMPT_CACHING_1H_BEDROCK
        label: Enable prompt caching 1h bedrock
        section: context
        type: boolean
        description: Deprecated. Use ENABLE_PROMPT_CACHING_1H instead.
        doc: docs/code.claude.com/docs/en/env-vars.md#L470
      - key: env.ENABLE_TOOL_SEARCH
        label: Enable tool search
        section: extensions
        type: boolean
        description: Controls MCP tool search. Unset or true defers MCP tools, except in the cases that keep tool search off. auto turns tool search on once definitions reach 10% of the context window. auto:N sets a custom threshold, such as auto:5 for 5%. false loads all tools upfront.
        doc: docs/code.claude.com/docs/en/env-vars.md#L471
      - key: env.FORCE_AUTOUPDATE_PLUGINS
        label: Force autoupdate plugins
        section: extensions
        type: boolean
        description: Set to 1 to force plugin auto-updates even when the main auto-updater is disabled via DISABLE_AUTOUPDATER
        doc: docs/code.claude.com/docs/en/env-vars.md#L472
      - key: env.FORCE_HYPERLINK
        label: Force hyperlink
        section: other
        type: boolean
        description: Set to 1 to enable clickable OSC 8 hyperlinks when your terminal supports them but isn't auto-detected. When unset, Claude Code enables most hyperlinks only when it detects terminal support.
        doc: docs/code.claude.com/docs/en/env-vars.md#L473
      - key: env.FORCE_PROMPT_CACHING_5M
        label: Force prompt caching 5m
        section: model
        type: boolean
        description: Set to 1 to force the 5-minute prompt cache TTL even when 1-hour TTL would otherwise apply. Overrides CLAUDE_CODE_PROMPT_CACHE_TTL, CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL, ENABLE_PROMPT_CACHING_1H, and the promptCacheTtl and subagentPromptCacheTtl settings
        doc: docs/code.claude.com/docs/en/env-vars.md#L474
      - key: env.HTTP_PROXY
        label: Http proxy
        section: other
        type: string
        description: Specify HTTP proxy server for network connections
        doc: docs/code.claude.com/docs/en/env-vars.md#L475
      - key: env.HTTPS_PROXY
        label: Https proxy
        section: other
        type: string
        description: Specify HTTPS proxy server for network connections
        doc: docs/code.claude.com/docs/en/env-vars.md#L476
      - key: env.IS_DEMO
        label: Is demo
        section: other
        type: boolean
        description: 'Set to any non-empty value, such as 1, to enable demo mode: hides your email and organization name from the header and /status output, and skips onboarding. Setting it to 0 or false still enables demo mode, unlike most on/off variables; unset the variable to turn it off.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L477
      - key: env.MAX_MCP_OUTPUT_TOKENS
        label: Max mcp output tokens
        section: mcp
        type: number
        default: 25000
        description: 'Maximum number of tokens allowed in MCP tool responses (default: 25000). Claude Code displays a warning when output exceeds 10,000 tokens.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L478
      - key: env.MAX_STRUCTURED_OUTPUT_RETRIES
        label: Max structured output retries
        section: other
        type: number
        default: 5
        description: Number of attempts Claude Code allows when the model's response fails validation against the --json-schema in non-interactive mode with the -p flag; after that many failed attempts with no valid output, the run fails. The same cap applies when a workflow subagent's structured output fails validation.
        doc: docs/code.claude.com/docs/en/env-vars.md#L479
      - key: env.MAX_THINKING_TOKENS
        label: Max thinking tokens
        section: model
        type: number
        description: Fixed token budget for extended thinking. Claude Code caps it at one token below the request's max output tokens and never below 1,024.
        doc: docs/code.claude.com/docs/en/env-vars.md#L480
      - key: env.MCP_CLIENT_SECRET
        label: Mcp client secret
        section: mcp
        type: string
        description: OAuth client secret for MCP servers that require pre-configured credentials. Avoids the interactive prompt when adding a server with --client-secret
        doc: docs/code.claude.com/docs/en/env-vars.md#L481
      - key: env.MCP_CONNECTION_NONBLOCKING
        label: Mcp connection nonblocking
        section: mcp
        type: boolean
        description: 'Controls whether startup waits for MCP servers to connect before the first query. MCP startup is non-blocking by default: servers connect in the background and their tools become available as they finish.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L482
      - key: env.MCP_CONNECT_TIMEOUT_MS
        label: Mcp connect timeout ms
        section: mcp
        type: number
        default: 5000
        description: 'How long blocking MCP startup waits, in milliseconds, for the connection batch before snapshotting the tool list (default: 5000). Applies when MCP_CONNECTION_NONBLOCKING=0 or for servers marked alwaysLoad: true.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L483
      - key: env.MCP_DISCOVERY_CACHE
        label: Mcp discovery cache
        section: mcp
        type: boolean
        description: Turns the MCP discovery cache on or off. With the cache on, a remote HTTP or SSE server you've used before can show the cached status, and Claude Code connects it on its first tool call instead of at startup.
        doc: docs/code.claude.com/docs/en/env-vars.md#L484
      - key: env.MCP_DISCOVERY_CACHE_MAX_STALE_S
        label: Mcp discovery cache max stale s
        section: mcp
        type: number
        default: 14400
        description: 'Maximum age, in seconds, of a discovery-cache entry (default: 14400, or 4 hours). At a start where the entry is older than that, Claude Code discards it and connects the server at startup, as it does with the cache off.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L485
      - key: env.MCP_DISCOVERY_CACHE_STRIKES
        label: Mcp discovery cache strikes
        section: mcp
        type: number
        default: 1
        description: 'At a start where a discovery-cache entry is older than MCP_DISCOVERY_CACHE_TTL_S, Claude Code refreshes it in the background. This variable sets how many refreshes in a row can fail before Claude Code discards the entry and connects the server at the next start instead (default: 1).'
        doc: docs/code.claude.com/docs/en/env-vars.md#L486
      - key: env.MCP_DISCOVERY_CACHE_TTL_S
        label: Mcp discovery cache ttl s
        section: mcp
        type: number
        default: 900
        description: 'Seconds for which Claude Code uses a discovery-cache entry without refreshing it (default: 900). At a start where the entry is older than that, Claude Code still uses it but refreshes it in the background.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L487
      - key: env.MCP_OAUTH_CALLBACK_PORT
        label: Mcp oauth callback port
        section: mcp
        type: number
        description: Fixed port for the OAuth redirect callback, as an alternative to --callback-port when adding an MCP server with pre-configured credentials
        doc: docs/code.claude.com/docs/en/env-vars.md#L488
      - key: env.MCP_PROTOCOL_NEGOTIATION
        label: Mcp protocol negotiation
        section: mcp
        type: string
        description: On the v2 MCP client runtime only, controls whether Claude Code probes servers for MCP protocol revision 2026-07-28. Set legacy to skip the probe, so that every server connects with the handshake from before that revision.
        doc: docs/code.claude.com/docs/en/env-vars.md#L489
      - key: env.MCP_REMOTE_SERVER_CONNECTION_BATCH_SIZE
        label: Mcp remote server connection batch size
        section: mcp
        type: number
        default: 20
        description: 'Maximum number of remote MCP servers (HTTP/SSE) to connect in parallel during startup (default: 20)'
        doc: docs/code.claude.com/docs/en/env-vars.md#L490
      - key: env.MCP_SDK_GENERATION
        label: Mcp sdk generation
        section: mcp
        type: string
        description: 'Pin which MCP client runtime this process connects to MCP servers with: v1, built on MCP TypeScript SDK 1.x, or v2, built on MCP TypeScript SDK 2.0. Without the variable, Claude Code uses v2, starting with the versions listed in that section.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L491
      - key: env.MCP_SERVER_CONNECTION_BATCH_SIZE
        label: Mcp server connection batch size
        section: mcp
        type: number
        default: 3
        description: 'Maximum number of local MCP servers (stdio) to connect in parallel during startup (default: 3)'
        doc: docs/code.claude.com/docs/en/env-vars.md#L492
      - key: env.MCP_TIMEOUT
        label: Mcp timeout
        section: mcp
        type: number
        default: 30000
        description: 'Timeout in milliseconds for MCP server startup (default: 30000, or 30 seconds)'
        doc: docs/code.claude.com/docs/en/env-vars.md#L493
      - key: env.MCP_TOOL_TIMEOUT
        label: Mcp tool timeout
        section: mcp
        type: number
        default: 100000000
        description: 'Timeout in milliseconds for MCP tool execution (default: 100000000, about 28 hours). For an HTTP, SSE, or claude.ai connector server, each request also times out after 60 seconds by default; set this variable, or the per-server timeout, above 60000 to raise that per-request limit.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L494
      - key: env.NO_PROXY
        label: No proxy
        section: other
        type: string
        description: List of domains and IPs to which requests will be directly issued, bypassing proxy
        doc: docs/code.claude.com/docs/en/env-vars.md#L495
      - key: env.OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
        label: Otel attribute value length limit
        section: telemetry
        type: number
        description: Standard OpenTelemetry SDK limit on attribute value length. Claude Code caps content-bearing telemetry attributes at the smaller of this and CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH, so the truncation marker stays within the SDK limit.
        doc: docs/code.claude.com/docs/en/env-vars.md#L496
      - key: env.OTEL_LOG_ASSISTANT_RESPONSES
        label: Otel log assistant responses
        section: telemetry
        type: boolean
        description: Set to 1 to include the model's response text on assistant_response OpenTelemetry log events. When unset, Claude Code uses the value of OTEL_LOG_USER_PROMPTS instead.
        danger_when: '1'
        note: Sends the assistant replies to the telemetry endpoint.
        doc: docs/code.claude.com/docs/en/env-vars.md#L497
      - key: env.OTEL_LOG_MANAGED_SETTINGS
        label: Otel log managed settings
        section: telemetry
        type: boolean
        description: Set to 1 to add the redacted managed settings, and a SHA-256 digest of the settings before redaction, to managed_settings_resolved OpenTelemetry log events. Disabled by default.
        doc: docs/code.claude.com/docs/en/env-vars.md#L498
      - key: env.OTEL_LOG_RAW_API_BODIES
        label: Otel log raw api bodies
        section: telemetry
        type: boolean
        description: Emit Anthropic Messages API request and response JSON as api_request_body / api_response_body log events. Set to 1 for inline bodies truncated at the content limit, or file:<dir> to write untruncated bodies to disk and emit a body_ref path instead.
        danger_when: '1'
        note: Sends the full conversation to the telemetry endpoint.
        doc: docs/code.claude.com/docs/en/env-vars.md#L499
      - key: env.OTEL_LOG_TOOL_CONTENT
        label: Otel log tool content
        section: telemetry
        type: boolean
        description: Set to 1 to include tool content in the tool.output OpenTelemetry span event. Span attributes carry tool content under their own gates.
        danger_when: '1'
        note: Sends tool content to the telemetry endpoint.
        doc: docs/code.claude.com/docs/en/env-vars.md#L500
      - key: env.OTEL_LOG_TOOL_DETAILS
        label: Otel log tool details
        section: telemetry
        type: boolean
        description: Set to 1 to include tool input arguments; MCP server names; user-authored workflow names; raw error strings on tool failures; the refusal category on api_refusal events; real agent, skill, plugin, and MCP server names on cost and token metrics; and other tool details in OpenTelemetry metrics, traces, and logs.
        danger_when: '1'
        note: Sends tool arguments, such as shell commands, to the telemetry endpoint.
        doc: docs/code.claude.com/docs/en/env-vars.md#L501
      - key: env.OTEL_LOG_USER_PROMPTS
        label: Otel log user prompts
        section: telemetry
        type: boolean
        description: Set to 1 to include user prompt text in OpenTelemetry traces and logs. Disabled by default (prompts are redacted).
        danger_when: '1'
        note: Sends your prompts to the telemetry endpoint.
        doc: docs/code.claude.com/docs/en/env-vars.md#L502
      - key: env.OTEL_METRICS_INCLUDE_ACCOUNT_UUID
        label: Otel metrics include account uuid
        section: telemetry
        type: boolean
        description: 'Set to false to exclude account UUID from metrics attributes (default: included). See Monitoring'
        doc: docs/code.claude.com/docs/en/env-vars.md#L503
      - key: env.OTEL_METRICS_INCLUDE_ENTRYPOINT
        label: Otel metrics include entrypoint
        section: telemetry
        type: boolean
        description: 'Set to true to include the session entrypoint in metrics attributes (default: excluded). Added in v2.1.152.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L504
      - key: env.OTEL_METRICS_INCLUDE_REPOSITORY
        label: Otel metrics include repository
        section: telemetry
        type: boolean
        description: 'Set to true to tag OpenTelemetry metrics and events with vcs.* attributes identifying the session''s repository (default: excluded). Requires Claude Code v2.1.269 or later.'
        doc: docs/code.claude.com/docs/en/env-vars.md#L505
      - key: env.OTEL_METRICS_INCLUDE_RESOURCE_ATTRIBUTES
        label: Otel metrics include resource attributes
        section: telemetry
        type: string
        description: 'As of v2.1.161, Claude Code attaches OTEL_RESOURCE_ATTRIBUTES keys to metric datapoint labels. Set to false to exclude them (default: included).'
        doc: docs/code.claude.com/docs/en/env-vars.md#L506
      - key: env.OTEL_METRICS_INCLUDE_SESSION_ID
        label: Otel metrics include session id
        section: telemetry
        type: string
        description: 'Set to false to exclude session ID from metrics attributes (default: included). See Monitoring'
        doc: docs/code.claude.com/docs/en/env-vars.md#L507
      - key: env.OTEL_METRICS_INCLUDE_VERSION
        label: Otel metrics include version
        section: telemetry
        type: boolean
        description: 'Set to true to include Claude Code version in metrics attributes (default: excluded). See Monitoring'
        doc: docs/code.claude.com/docs/en/env-vars.md#L508
      - key: env.SLASH_COMMAND_TOOL_CHAR_BUDGET
        label: Slash command tool char budget
        section: extensions
        type: number
