        description: Group tool activity into expandable summaries in the timeline.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L808
      - key: allowedMcpServers
        label: Allowed MCP servers
        section: mcp
        type: list
        description: Managed allowlist of MCP servers users may load, matched by URL, command or name. An empty list denies all.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L939
        locked_floor: true
      - key: deniedMcpServers
        label: Denied MCP servers
        section: mcp
        type: list
        description: Managed denylist of MCP servers that never load. Deny wins over allow.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L942
        locked_floor: true
      - key: forceLoginOrgs
        label: Force login orgs
        section: startup
        type: list
        description: Managed list of GitHub organizations. Copilot runs only for an account in at least one of them.
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L945
        locked_floor: true
      - key: forceRemoteSettingsRefresh
        label: Force remote settings refresh
        section: startup
        type: boolean
        description: 'Managed: require a fresh server settings fetch at startup, even when a cached policy exists.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L946
        locked_floor: true
      - key: policyHelper
        label: Policy helper
        section: other
        type: map
        description: 'Managed: an executable that supplies the lowest-priority managed settings layer.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L949
        locked_floor: true
      - key: remoteControl
        label: Remote control
        section: autonomy
        type: map
        description: 'Managed: whether sessions on this device can be controlled from other devices (enabled, disabled or requireSSO).'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L950
        locked_floor: true
      - key: requireBase64ImageAttachments
        label: Require base64 image attachments
        section: other
        type: boolean
        description: 'Managed: require base64 image attachments instead of attachment URLs.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L951
        locked_floor: true
      - key: communication.support.url
        label: Support URL
        section: other
        type: string
        description: 'Managed: link to an organization help page, shown wherever the CLI says to contact your administrator.'
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md#L941
        locked_floor: true
      - key: env.COPILOT_ALLOW_ALL
        label: Copilot allow all
        section: autonomy
        type: boolean
        description: Allow all tools to run automatically without confirmation. Accepts "true", "1", "yes", "on", or "y", case-insensitively and ignoring surrounding whitespace; "false", "0", "no", "off", "n", or an empty value turn it off.
        danger_when: ['true', '1', 'yes', 'on', y]
        note: Approves every tool call, and the value true also trusts the working directory.
        doc: copilot help environment
      - key: env.COPILOT_ASSISTED_APPROVAL
        label: Copilot assisted approval
        section: autonomy
        type: boolean
        description: Set to "true" (or "1", "yes", "on") to review tool permission requests with the assisted-approval safety judge, like --assisted-approval. Supported only in non-interactive prompt mode (-p); an interactive session refuses to start while it is set.
        doc: copilot help environment
      - key: env.COPILOT_AUTO_TIER
        label: Copilot auto tier
        section: model
        type: string
        description: Optionally set the Auto routing profile to "efficiency", "balance", or "intelligence", or a server-advertised profile in local sessions. "fast" is ignored with a notice, because the CLI cannot run on that profile.
        doc: copilot help environment
      - key: env.COPILOT_AUTO_UPDATE
        label: Copilot auto update
        section: startup
        type: boolean
        description: Set to "false" to disable downloading updated CLI versions automatically. Can also be disabled with the --no-auto-update flag.
        doc: copilot help environment
      - key: env.COPILOT_BACKGROUND_COMPACTION_THRESHOLD
        label: Copilot background compaction threshold
        section: context
        type: number
        default: 0.8
        description: Fraction of the model's context window (for example "0.7") at which the CLI starts compacting the conversation in the background; defaults to 0.8 (a few models have their own default).
        doc: copilot help environment
      - key: env.COPILOT_BASH_PATH
        label: Copilot bash path
        section: other
        type: string
        description: Path of the bash executable used for the agent's shell commands and for command hooks. By default the first executable of /bin/bash, /usr/bin/bash, /usr/local/bin/bash, and /run/current-system/sw/bin/bash is used, then bash from PATH; on Windows, bash from PATH.
        doc: copilot help environment
      - key: env.COPILOT_BUFFER_EXHAUSTION_THRESHOLD
        label: Copilot buffer exhaustion threshold
        section: context
        type: number
        default: 0.95
        description: Fraction of the model's context window at which compaction blocks the conversation until it finishes; defaults to 0.95.
        doc: copilot help environment
      - key: env.COPILOT_CACHE_HOME
        label: Copilot cache home
        section: startup
        type: string
        description: Directory for cached data that can be deleted and re-created, such as downloaded CLI versions. Not affected by COPILOT_HOME.
        doc: copilot help environment
      - key: env.COPILOT_CHILD_OOM_SCORE_ADJ
        label: Copilot child oom score adj
        section: other
        type: string
        description: Linux only. The oom_score_adj given to shell processes the CLI starts, so that under memory pressure the kernel ends those before the CLI.
        doc: copilot help environment
      - key: env.COPILOT_CLI_VERSION
        label: Copilot cli version
        section: startup
        type: string
        description: Override the CLI version used for update comparisons. On standalone development builds, a canonical semantic version also opts into release-style cached-package selection and CLI updates, but does not pin cache selection to that exact version or change the version displayed by --version.
        doc: copilot help environment
      - key: env.COPILOT_CUSTOM_INSTRUCTIONS_DIRS
        label: Copilot custom instructions dirs
        section: context
        type: string
        description: Comma-separated list of additional directories to search for custom instructions files (in addition to git root and current working directory).
        doc: copilot help environment
      - key: env.COPILOT_DISABLE_DESKTOP_NOTIFICATIONS
        label: Copilot disable desktop notifications
        section: other
        type: boolean
        description: Set to "1" to suppress desktop notifications, even when the notifications setting is on.
        doc: copilot help environment
      - key: env.COPILOT_DISABLE_LOGIN_SHELL_ENV
        label: Copilot disable login shell env
        section: startup
        type: boolean
        description: Set to "1" or "true" to stop re-reading your login-shell environment for the agent's shell commands.
        doc: copilot help environment
      - key: env.COPILOT_DISABLE_RESUME_AUTO_CD
        label: Copilot disable resume auto cd
        section: other
        type: string
        description: Set to "1" or "true" so that --resume does not switch to the working directory recorded for the resumed session.
        doc: copilot help environment
      - key: env.COPILOT_EDITOR
        label: Copilot editor
        section: other
        type: string
        description: Command used to interactively edit a file (e.g., the plan).
        doc: copilot help environment
      - key: env.COPILOT_GITHUB_TOKEN
        label: Copilot github token
        section: startup
        type: string
        description: 'An authentication token that takes precedence over previously stored credentials. Exception: in Codespaces, the auto-injected GITHUB_TOKEN (a user-to-server token) does not take precedence over a /login account.'
        doc: copilot help environment
      - key: env.COPILOT_HOME
        label: Copilot home
        section: startup
        type: string
        description: Override the directory where configuration and state files are stored; defaults to $HOME/.copilot. See "Files and directories" in copilot help config for what it holds.
        doc: copilot help environment
      - key: env.COPILOT_HOOK_ALLOW_HTTP_AUTH_HOOKS
        label: Copilot hook allow http auth hooks
        section: hooks
        type: boolean
        description: Set to "1" to let preToolUse, preMcpToolCall, and permissionRequest HTTP hooks use plain http:// URLs; otherwise they must use https://.
        danger_when: '1'
        note: Lets approval hooks send data over plain http.
        doc: copilot help environment
      - key: env.COPILOT_HOOK_ALLOW_LOCALHOST
        label: Copilot hook allow localhost
        section: hooks
        type: boolean
        description: Set to "1" to let HTTP hooks post to localhost and other loopback addresses, which are otherwise blocked; plain http:// is then also accepted for those addresses.
        danger_when: '1'
        note: Lets HTTP hooks post to this machine and other loopback addresses.
        doc: copilot help environment
      - key: env.COPILOT_INLINE_IMAGES_TMUX
        label: Copilot inline images tmux
        section: other
        type: boolean
        description: Set to "0" to stop forwarding inline images through tmux. Forwarding also requires allow-passthrough on in tmux.
        doc: copilot help environment
      - key: env.COPILOT_LOGIN_SHELL_ENV_TIMEOUT_MS
        label: Copilot login shell env timeout ms
        section: startup
        type: number
        default: 4000
        description: Time limit in milliseconds for reading the login-shell environment (see COPILOT_DISABLE_LOGIN_SHELL_ENV); defaults to 4000. Values that are not positive integers log a warning and use the default.
        doc: copilot help environment
      - key: env.COPILOT_MASCOT_BLINK
        label: Copilot mascot blink
        section: other
        type: boolean
        description: Set to "0" to turn off the mascot's blink animation in the header.
        doc: copilot help environment
      - key: env.COPILOT_MODEL
        label: Copilot model
        section: model
        type: string
        description: Optionally set the agent model. Can be overridden by the --model command line option or the /model command.
        doc: copilot help environment
      - key: env.COPILOT_MULTIPLEXER
        label: Copilot multiplexer
        section: other
        type: string
        description: Override which terminal multiplexer the CLI believes it is running directly inside. One of "tmux", "herdr", or "none"; unrecognized values are ignored.
        doc: copilot help environment
      - key: env.COPILOT_OFFLINE
        label: Copilot offline
        section: startup
        type: boolean
        description: 'Set to "true" to enable offline mode. When active, the CLI skips all network access: GitHub authentication, telemetry, web tools, GitHub MCP server, and auto-update are disabled.'
        doc: copilot help environment
      - key: env.COPILOT_PLUGIN_DIR_ONLY
        label: Copilot plugin dir only
        section: extensions
        type: boolean
        description: Set to "true" to turn off automatic plugin discovery, so that only plugins passed with --plugin-dir are loaded.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDERS_CONFIG
        label: Copilot providers config
        section: model
        type: string
        description: Path of the custom model providers file; defaults to $COPILOT_HOME/providers.json.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_BASE_URL
        label: Copilot provider base url
        section: model
        type: string
        description: API endpoint URL for a custom model provider (BYOK). When set, the CLI uses this provider instead of GitHub Copilot's model routing.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_TYPE
        label: Copilot provider type
        section: model
        type: string
        description: Provider type when using BYOK. One of "openai" (default), "azure", or "anthropic".
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_API_KEY
        label: Copilot provider api key
        section: model
        type: string
        description: API key for the custom provider. Optional for local providers like Ollama.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_API_KEY_COMMAND
        label: Copilot provider api key command
        section: model
        type: string
        description: Shell command that prints a fresh API key for each provider request. Takes precedence over COPILOT_PROVIDER_API_KEY.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_BEARER_TOKEN
        label: Copilot provider bearer token
        section: model
        type: string
        description: Bearer token for custom provider authentication. Takes precedence over COPILOT_PROVIDER_API_KEY.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_WIRE_API
        label: Copilot provider wire api
        section: model
        type: string
        description: API format for the custom provider. One of "completions" (default) or "responses".
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_TRANSPORT
        label: Copilot provider transport
        section: model
        type: string
        description: Transport for the custom provider. One of "http" (default) or "websockets".
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_AZURE_API_VERSION
        label: Copilot provider azure api version
        section: model
        type: string
        description: Azure API version when using type "azure". When omitted, uses the GA versionless v1 route.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_MODEL_ID
        label: Copilot provider model id
        section: model
        type: string
        description: Well-known model ID used for agent configuration and token limits. Defaults to COPILOT_MODEL.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_WIRE_MODEL
        label: Copilot provider wire model
        section: model
        type: string
        description: Model name sent to the provider API for inference. Defaults to COPILOT_MODEL.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_MAX_PROMPT_TOKENS
        label: Copilot provider max prompt tokens
        section: model
        type: number
        description: Maximum prompt tokens for the BYOK model. Overrides both catalog and default values.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_MAX_OUTPUT_TOKENS
        label: Copilot provider max output tokens
        section: model
        type: number
        description: Maximum output tokens for the BYOK model. Overrides both catalog and default values.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_VISION
        label: Copilot provider vision
        section: model
        type: boolean
        description: Set to "true" if the BYOK model accepts image input. BYOK models are treated as text-only unless this is set, so images that tools return (such as an image file the agent views or a screenshot from an MCP server) are not sent to the model.
        doc: copilot help environment
      - key: env.COPILOT_PROVIDER_HEADERS
        label: Copilot provider headers
        section: model
        type: string
        description: 'Custom HTTP headers sent only to the BYOK provider endpoint (not to GitHub Copilot services). Newline-separated "Name: Value" pairs; a literal "\n" also separates entries in a double-quoted shell string.'
        doc: copilot help environment
      - key: env.COPILOT_PROXY_KERBEROS
        label: Copilot proxy kerberos
        section: other
        type: boolean
        description: Set to "0", "false", "off", or "no" to turn off automatic Kerberos/Negotiate authentication with proxies that ask for it.
        doc: copilot help environment
      - key: env.COPILOT_SKILLS_DIRS
        label: Copilot skills dirs
        section: extensions
        type: string
        description: Comma-separated list of additional directories to search for skills, used together with the skillDirectories setting. A leading ~ stands for your home directory.
        doc: copilot help environment
      - key: env.COPILOT_SYSTEM_PROXY
        label: Copilot system proxy
        section: other
        type: string
        description: Set to "0" or "false" to ignore the operating system's proxy configuration; requests then go direct unless a proxy is set with HTTP_PROXY/HTTPS_PROXY or the proxyUrl setting.
        doc: copilot help environment
      - key: env.COPILOT_TASK_WAIT_TIMEOUT_SECONDS
        label: Copilot task wait timeout seconds
        section: autonomy
        type: number
        default: 600
        description: In non-interactive prompt mode (-p, including -p --autopilot), how many seconds to wait for background agents and shell commands to finish before exiting; defaults to 600. "0" stops waiting at once; empty, negative, or non-numeric values use the default.
        doc: copilot help environment
      - key: env.COPILOT_WEB_FETCH_ALLOW_LOCALHOST
        label: Copilot web fetch allow localhost
        section: autonomy
        type: boolean
        description: Set to "1" to let the web_fetch tool fetch from hosts that resolve only to loopback addresses, such as localhost. When the sandbox is on, its network.allowLocalNetwork setting grants the same access.
        danger_when: '1'
        note: Lets the web fetch tool reach hosts on this machine.
        doc: copilot help environment
      - key: env.GH_HOST
        label: Gh host
        section: startup
        type: string
        description: GitHub hostname for authentication and API requests; defaults to "github.com". Set this to your GitHub Enterprise Cloud with data residency hostname (e.g., "mycompany.ghe.com").
        doc: copilot help environment
      - key: env.COPILOT_GH_HOST
        label: Copilot gh host
        section: startup
        type: string
        description: GitHub hostname used only by Copilot CLI for authentication and API requests, overriding GH_HOST when set. Useful when GH_HOST points to a GitHub Enterprise Server instance but Copilot CLI needs to authenticate against github.com or a GitHub Enterprise Cloud with data residency hostname instead.
        doc: copilot help environment
      - key: env.HTTP_PROXY
        label: Http proxy
        section: other
        type: string
        description: Proxy server URL for outgoing HTTP and HTTPS connections respectively (e.g., "http://proxy.example.com:8080").
        doc: copilot help environment
      - key: env.NO_COLOR
        label: No color
        section: other
        type: boolean
        description: When set (to any value), disables color output. See https://no-color.org/ for details.
        doc: copilot help environment
      - key: env.NO_PROXY
        label: No proxy
        section: other
        type: string
        description: Comma-separated list of hostnames or patterns that should bypass the proxy (e.g., "localhost,127.0.0.1,.example.com").
        doc: copilot help environment
      - key: env.PLAIN_DIFF
        label: Plain diff
        section: other
        type: boolean
        description: When set to "true", disables rich diff rendering (syntax highlighting via diff tool specified by git config). Can also be set with the --plain-diff flag.
        doc: copilot help environment
      - key: env.USE_BUILTIN_RIPGREP
        label: Use builtin ripgrep
        section: other
        type: boolean
        description: When set to "false", uses the ripgrep binary from PATH instead of the bundled version.
        doc: copilot help environment
      - key: env.USE_TGREP
        label: Use tgrep
        section: other
        type: boolean
        description: When set to "true", enables tgrep indexed search regardless of repository size, and also overrides the automatic-start checks described here (it does not override whether indexed search is available for your account, and USE_BUILTIN_RIPGREP=false still disables it). tgrep starts even outside a git repository, indexing...
        doc: copilot help environment
      - key: env.USE_TGREP_MANAGED
        label: Use tgrep managed
        section: other
        type: boolean
        description: Set to "false" to opt out of managed-v2 and restore v1 fixed-pin/retain-all compatibility, including its one-server limit. This overrides TGREP_SHARED_CONFIG without reading that file.
        doc: copilot help environment
      - key: env.TGREP_SHARED_CONFIG
        label: Tgrep shared config
        section: other
        type: number
        description: Optional path to a complete managed-v2 JSON configuration overriding the built-in defaults. Durations are milliseconds and sizes are bytes; missing fields and invalid files are rejected, not merged with defaults.
        doc: copilot help environment
      - key: env.TGREP_FILE_COUNT_THRESHOLD
        label: Tgrep file count threshold
        section: other
        type: number
        description: Minimum file count for automatic tgrep indexed search. Accepts a non-negative integer, ignoring surrounding whitespace.
        doc: copilot help environment
      - key: env.USE_TGREP_WARM_START
        label: Use tgrep warm start
        section: other
        type: boolean
        description: When set to "true", blocks Copilot CLI startup until the tgrep index is ready when tgrep starts. It does not enable tgrep on its own; pair with USE_TGREP=true to force indexing and wait for readiness.
        doc: copilot help environment
      - key: env.COPILOT_TELEMETRY_DISABLED
        label: Copilot telemetry disabled
        section: telemetry
        type: boolean
        description: Set to "true" before startup to disable Copilot-owned GitHub and Entra authentication telemetry process-wide, like --disable-client-telemetry. Does not affect independently configured OpenTelemetry, server-side telemetry, or OS/broker telemetry.
        doc: copilot help environment
      - key: env.COPILOT_OTEL_ENABLED
        label: Copilot otel enabled
        section: telemetry
        type: boolean
        description: Set to "true" to explicitly enable OpenTelemetry instrumentation.
        doc: copilot help environment
      - key: env.OTEL_EXPORTER_OTLP_ENDPOINT
        label: Otel exporter otlp endpoint
        section: telemetry
        type: string
        description: OTLP endpoint URL. Setting this automatically enables OTel.
        doc: copilot help environment
      - key: env.COPILOT_OTEL_EXPORTER_TYPE
        label: Copilot otel exporter type
        section: telemetry
        type: string
        description: Copilot exporter backend; "otlp-http" (default) or "file" for local JSON-lines output.
        doc: copilot help environment
      - key: env.OTEL_EXPORTER_OTLP_PROTOCOL
        label: Otel exporter otlp protocol
        section: telemetry
        type: string
        description: OTLP HTTP protocol for the "otlp-http" exporter; "http/json" (default) or "http/protobuf". Use OTEL_EXPORTER_OTLP_TRACES_PROTOCOL or OTEL_EXPORTER_OTLP_METRICS_PROTOCOL to override per signal.
        doc: copilot help environment
      - key: env.COPILOT_OTEL_FILE_EXPORTER_PATH
        label: Copilot otel file exporter path
        section: telemetry
        type: string
        description: File path for JSON-lines output. Setting this automatically enables OTel.
        doc: copilot help environment
      - key: env.COPILOT_OTEL_SOURCE_NAME
        label: Copilot otel source name
        section: telemetry
        type: string
        description: Instrumentation scope name for tracer and meter; defaults to "github.copilot".
        doc: copilot help environment
      - key: env.OTEL_SERVICE_NAME
        label: Otel service name
        section: telemetry
        type: string
        description: Service name in resource attributes; defaults to "github-copilot".
        doc: copilot help environment
      - key: env.OTEL_RESOURCE_ATTRIBUTES
        label: Otel resource attributes
        section: telemetry
        type: string
        description: Extra resource attributes as comma-separated key=value pairs.
        doc: copilot help environment
      - key: env.OTEL_EXPORTER_OTLP_HEADERS
        label: Otel exporter otlp headers
        section: telemetry
        type: string
        description: Authentication headers for the OTLP exporter (e.g., "Authorization=Bearer token").
        doc: copilot help environment
      - key: env.OTEL_EXPORTER_OTLP_CERTIFICATE
        label: Otel exporter otlp certificate
        section: telemetry
        type: string
        description: Path to a PEM file with extra CA certificate(s) to trust for the OTLP endpoint (e.g., a private/corporate CA). Merged with the OS trust store.
        doc: copilot help environment
      - key: env.OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
        label: Otel exporter otlp client certificate
        section: telemetry
        type: string
        description: Paths to the client certificate and (unencrypted) private key PEM files for mutual TLS (mTLS). Both must be set together.
        doc: copilot help environment
      - key: env.OTEL_INSTRUMENTATION_GENAI_CAPTURE_CONTENT
        label: Otel instrumentation genai capture content
        section: telemetry
        type: string
        description: '"SPAN_ONLY" or "SPAN_AND_EVENT" enables span content; "NO_CONTENT" (default) or "EVENT_ONLY" disables it. Values are case-insensitive.'
        danger_when: [SPAN_ONLY, SPAN_AND_EVENT]
        note: Puts prompt and reply content into exported telemetry.
        doc: copilot help environment
      - key: env.OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
        label: Otel instrumentation genai capture message content
        section: telemetry
        type: string
        description: Legacy boolean fallback when the standard content variable is empty or unset.
        doc: copilot help environment
      - key: env.OTEL_LOG_LEVEL
        label: Otel log level
        section: telemetry
        type: string
        description: 'OTel diagnostic log level (not the CLI --log-level). One of: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, ALL.'
        doc: copilot help environment
      - key: env.COPILOT_ENABLE_HTTP2
        label: Copilot enable http2
        section: other
        type: string
        description: "Set to 1 or true to opt into HTTP/2 transport. HTTP/1.1 is the default."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L937
      - key: env.COPILOT_ENABLE_INTERRUPTED_SESSION_RESTORE
        label: Copilot enable interrupted session restore
        section: other
        type: string
        description: "Set to 1 to enable restoring a session that was still open when the CLI process went away, for example due to a crash or a machine restart. This restore behavior is temporarily opt-in while its startup dialog is reworked. See Restoring an interrupted session."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L938
      - key: env.COPILOT_LARGE_OUTPUT_THRESHOLD_BYTES
        label: Copilot large output threshold bytes
        section: other
        type: string
        description: "Maximum UTF-8 byte size for tool output returned directly to the model. Default: 20480 (20 KiB)."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L942
      - key: env.COPILOT_MCP_TOOL_CACHE
        label: Copilot mcp tool cache
        section: other
        type: string
        description: "Set to false to disable loading and persisting local MCP server tool snapshots for the entire process. See Tool snapshot caching."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L943
      - key: env.COPILOT_PLAN_THEN_AUTOPILOT
        label: Copilot plan then autopilot
        section: other
        type: string
        description: "Set to 1, true, yes, or on to request plan-then-autopilot (equivalent to --plan --mode autopilot) for harnesses that can only inject environment variables. Ignored, with a warning, when an explicit --mode, --autopilot, or --plan option is passed. See Plan-then-autopilot."
        doc: upstream/copilot-docs/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L945
      - key: env.COPILOT_PROMPT_FRAME
        label: Copilot prompt frame
        section: other
        type: string
        description: "Set to 1 to enable the decorative UI frame around the input prompt, or 0 to disable it. Overrides the PROMPT_FRAME experimental feature flag for the current session."
