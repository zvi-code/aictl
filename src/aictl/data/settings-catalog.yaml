      - key: env.GEMINI_API_KEY
        label: Gemini api key
        section: startup
        type: string
        description: Your API key for the Gemini API. One of several available authentication methods.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2664
      - key: env.GEMINI_MODEL
        label: Gemini model
        section: model
        type: string
        description: 'Specifies the default Gemini model to use. Overrides the hardcoded default Example: export GEMINI_MODEL="gemini-3-flash-preview" (Windows PowerShell: $env:GEMINI_MODEL="gemini-3-flash-preview")'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2670
      - key: env.GEMINI_CLI_TRUST_WORKSPACE
        label: Gemini cli trust workspace
        section: autonomy
        type: boolean
        description: If set to "true", trusts the current workspace for the duration of the session, bypassing the folder trust check. Useful for headless environments (for example, CI/CD pipelines).
        danger_when: 'true'
        note: Trusts the workspace and skips the folder trust check.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2675
      - key: env.GEMINI_CLI_TRUSTED_FOLDERS_PATH
        label: Gemini cli trusted folders path
        section: other
        type: string
        description: Overrides the default location for the trustedFolders.json file. Useful if you want to store this configuration in a custom location instead of the default ~/.gemini/.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2679
      - key: env.GEMINI_CLI_IDE_PID
        label: Gemini cli ide pid
        section: other
        type: string
        description: Manually specifies the PID of the IDE process to use for integration. This is useful when running Gemini CLI in a standalone terminal while still wanting to associate it with a specific IDE instance.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2683
      - key: env.GEMINI_CLI_HOME
        label: Gemini cli home
        section: startup
        type: string
        description: Specifies the root directory for Gemini CLI's user-level configuration and storage. By default, this is the user's system home directory.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2688
      - key: env.GEMINI_CLI_SURFACE
        label: Gemini cli surface
        section: other
        type: string
        description: Specifies a custom label to include in the User-Agent header for API traffic reporting. This is useful for tracking specific internal tools or distribution channels.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2696
      - key: env.GOOGLE_API_KEY
        label: Google api key
        section: startup
        type: string
        description: Your Google Cloud API key. Required for using Vertex AI in express mode.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2703
      - key: env.GOOGLE_CLOUD_PROJECT
        label: Google cloud project
        section: other
        type: string
        description: Your Google Cloud Project ID. Required for using Code Assist or Vertex AI.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2709
      - key: env.GOOGLE_APPLICATION_CREDENTIALS
        label: Google application credentials
        section: startup
        type: string
        description: 'Description: The path to your Google Application Credentials JSON file. Example: export GOOGLE_APPLICATION_CREDENTIALS="/path/to/your/credentials.json" (Windows PowerShell: $env:GOOGLE_APPLICATION_CREDENTIALS="C:\path\to\your\credentials.json")'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2721
      - key: env.GOOGLE_GENAI_API_VERSION
        label: Google genai api version
        section: other
        type: string
        description: Specifies the API version to use for Gemini API requests. When set, overrides the default API version used by the SDK.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2727
      - key: env.GOOGLE_GEMINI_BASE_URL
        label: Google gemini base url
        section: other
        type: string
        description: Overrides the default base URL for Gemini API requests (when using gemini-api-key authentication). Must be a valid URL.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2732
      - key: env.GOOGLE_VERTEX_BASE_URL
        label: Google vertex base url
        section: other
        type: string
        description: Overrides the default base URL for Vertex AI API requests (when using vertex-ai authentication). Must be a valid URL.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2739
      - key: env.OTLP_GOOGLE_CLOUD_PROJECT
        label: Otlp google cloud project
        section: other
        type: string
        description: 'Your Google Cloud Project ID for Telemetry in Google Cloud Example: export OTLP_GOOGLE_CLOUD_PROJECT="YOUR_PROJECT_ID" (Windows PowerShell: $env:OTLP_GOOGLE_CLOUD_PROJECT="YOUR_PROJECT_ID").'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2747
      - key: env.GEMINI_TELEMETRY_ENABLED
        label: Gemini telemetry enabled
        section: telemetry
        type: boolean
        description: Set to true or 1 to enable telemetry. Any other value is treated as disabling it.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2751
      - key: env.GEMINI_TELEMETRY_TRACES_ENABLED
        label: Gemini telemetry traces enabled
        section: telemetry
        type: boolean
        description: Set to true or 1 to enable detailed tracing with large attributes. Any other value is treated as disabling it.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2755
      - key: env.GEMINI_TELEMETRY_TARGET
        label: Gemini telemetry target
        section: telemetry
        type: string
        description: Sets the telemetry target (local or gcp). Overrides the telemetry.target setting.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2759
      - key: env.GEMINI_TELEMETRY_OTLP_ENDPOINT
        label: Gemini telemetry otlp endpoint
        section: telemetry
        type: string
        description: Sets the OTLP endpoint for telemetry. Overrides the telemetry.otlpEndpoint setting.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2762
      - key: env.GEMINI_TELEMETRY_OTLP_PROTOCOL
        label: Gemini telemetry otlp protocol
        section: telemetry
        type: string
        description: Sets the OTLP protocol (grpc or http). Overrides the telemetry.otlpProtocol setting.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2765
      - key: env.GEMINI_TELEMETRY_OTLP_HEADERS
        label: Gemini telemetry otlp headers
        section: telemetry
        type: string
        description: Sets custom headers for OTLP exporter requests (as a JSON object string or comma-separated key=value pairs; also falls back to OTEL_EXPORTER_OTLP_HEADERS). Merges with and overrides headers in the telemetry.otlpHeaders setting.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2768
      - key: env.GEMINI_TELEMETRY_LOG_PROMPTS
        label: Gemini telemetry log prompts
        section: telemetry
        type: boolean
        description: Set to true or 1 to enable or disable logging of user prompts. Any other value is treated as disabling it.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2773
      - key: env.GEMINI_TELEMETRY_OUTFILE
        label: Gemini telemetry outfile
        section: telemetry
        type: string
        description: Sets the file path to write telemetry to when the target is local. Overrides the telemetry.outfile setting.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2777
      - key: env.GEMINI_TELEMETRY_USE_COLLECTOR
        label: Gemini telemetry use collector
        section: telemetry
        type: boolean
        description: Set to true or 1 to enable or disable using an external OTLP collector. Any other value is treated as disabling it.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2780
      - key: env.GOOGLE_CLOUD_LOCATION
        label: Google cloud location
        section: other
        type: string
        description: Your Google Cloud Project Location (for example, us-central1). Required for using Vertex AI in non-express mode.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2784
      - key: env.GEMINI_SANDBOX
        label: Gemini sandbox
        section: autonomy
        type: string
        description: Alternative to the sandbox setting in settings.json. Accepts true, false, docker, podman, or a custom command string.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2789
      - key: env.GEMINI_SYSTEM_MD
        label: Gemini system md
        section: context
        type: string
        description: 'Replaces the built‑in system prompt with content from a Markdown file. true/1: Use project default path ./.gemini/system.md. Any other string: Treat as a path (relative/absolute supported, ~ expands). false/0 or unset: Use the built‑in prompt.'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2792
      - key: env.GEMINI_WRITE_SYSTEM_MD
        label: Gemini write system md
        section: context
        type: string
        description: 'Writes the current built‑in system prompt to a file for review. true/1: Write to ./.gemini/system.md. Otherwise treat the value as a path.'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2799
      - key: env.SEATBELT_PROFILE
        label: Seatbelt profile
        section: autonomy
        type: string
        description: 'Switches the Seatbelt (sandbox-exec) profile on macOS. permissive-open: (Default) Denies operations by default, confining writes to the project folder (and a few other folders, see packages/cli/src/utils/sandbox-macos-permissive-open.sb) while allowing broad file reads and network access. restrictive-open: Declines...'
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2804
      - key: env.NO_COLOR
        label: No color
        section: other
        type: string
        description: Set to any value to disable all color output in the CLI.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2824
      - key: env.CLI_TITLE
        label: Cli title
        section: other
        type: string
        description: Set to a string to customize the title of the CLI.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2826
      - key: env.CODE_ASSIST_ENDPOINT
        label: Code assist endpoint
        section: other
        type: string
        description: Specifies the endpoint for the code assist server. This is useful for development and testing.
        doc: upstream/gemini-cli-repo/docs/reference/configuration.md#L2828
