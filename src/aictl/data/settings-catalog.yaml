      - key: mcp_enterprise_managed_auth.idp.token_endpoint_auth_method
        label: Token endpoint auth method
        section: mcp
        type: enum
        values: [client_secret_basic, client_secret_post]
        description: Registered EMA client authentication method. Defaults to client_secret_basic when a secret is configured; requires a client secret.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: mcp_servers.<name>.name
        label: MCP servers name
        section: mcp
        type: string
        description: Legacy display-name field accepted for backward compatibility.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: mcp_servers.<name>.oauth
        label: Oauth
        section: mcp
        type: map
        description: Client settings for MCP OAuth login or enterprise token exchange.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: mcp_servers.<name>.oauth.authorization_server_issuer
        label: Authorization server issuer
        section: mcp
        type: string
        description: Expected resource authorization server issuer for EMA token exchange.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: mcp_servers.<name>.oauth.token_endpoint_auth_method
        label: Token endpoint auth method
        section: mcp
        type: enum
        values: [client_secret_basic, client_secret_post]
        description: Registered EMA client authentication method. Defaults to client_secret_basic when a secret is configured; requires a client secret.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: memories
        label: Memories
        section: context
        type: map
        description: Memories subsystem settings.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: memories.dedicated_tools
        label: Dedicated tools
        section: context
        type: boolean
        description: When true, expose dedicated memory tools through the extension tool surface.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws
        label: Aws
        section: model
        type: map
        description: AWS SigV4 auth configuration for this provider.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.auth_refresh
        label: Auth refresh
        section: model
        type: map
        description: Optional command used to reauthenticate after a refreshable AWS auth failure.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.auth_refresh.args
        label: Auth refresh args
        section: model
        type: list
        default: []
        description: Arguments passed to the refresh command.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.auth_refresh.command
        label: Auth refresh command
        section: model
        type: string
        description: Executable to invoke directly, without a shell.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.auth_refresh.timeout_ms
        label: Timeout ms
        section: model
        type: number
        default: 300000
        description: Maximum time to wait for the refresh command to complete.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.credential_export
        label: Credential export
        section: model
        type: map
        description: Optional command whose exported credentials replace the AWS SDK credential chain.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.credential_export.args
        label: Credential export args
        section: model
        type: list
        default: []
        description: Arguments passed to the credential export command.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.credential_export.command
        label: Credential export command
        section: model
        type: string
        description: Executable to invoke directly, without a shell.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.credential_export.timeout_ms
        label: Timeout ms
        section: model
        type: number
        default: 30000
        description: Maximum time to wait for the credential export command to complete.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.profile
        label: Profile
        section: model
        type: string
        description: AWS profile name to use. When unset, the AWS SDK default chain decides.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.aws.region
        label: Region
        section: model
        type: string
        description: AWS region to use for provider-specific endpoints.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.capabilities
        label: Capabilities
        section: model
        type: map
        description: Optional API capability overrides for a custom Responses-compatible provider. Unspecified capabilities retain their existing provider defaults.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.capabilities.cyber_access_programs
        label: Cyber access programs
        section: model
        type: boolean
        description: Whether the provider accepts explicit access_programs.cyber selections. Defaults to enabled for the built-in OpenAI provider and disabled otherwise.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.credential_file
        label: Credential file
        section: model
        type: string
        description: Absolute path to a Google ADC credential file. For GCP, overrides GOOGLE_APPLICATION_CREDENTIALS in the auth command's environment only.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.gateway_oauth
        label: Gateway oauth
        section: model
        type: map
        description: Secondary OAuth credentials required by the provider's gateway.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.gateway_oauth.credentials_store
        label: Credentials store
        section: model
        type: enum
        values: [keyring, file]
        description: Where Codex stores this gateway's OAuth credentials. Defaults to the keyring-backed store.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.gateway_oauth.delivery
        label: Delivery
        section: model
        type: map
        description: Omit to send the gateway token via the Authorization header
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.location
        label: Location
        section: model
        type: string
        description: Google Cloud location for the built-in GCP provider. Takes precedence over GOOGLE_CLOUD_LOCATION; defaults to global when neither is set.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.project_id
        label: Project id
        section: model
        type: string
        description: Google Cloud project ID for the built-in GCP provider. Takes precedence over GOOGLE_CLOUD_PROJECT when deriving the Vertex AI endpoint.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: model_providers.<name>.websocket_connect_timeout_ms
        label: Websocket connect timeout ms
        section: model
        type: number
        description: Maximum time (in milliseconds) to wait for a websocket connection attempt before treating it as failed.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: notice
        label: Notice
        section: other
        type: map
        description: Collection of in-product notices (different from notifications) See [crate::types::Notice] for more details
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: orchestrator
        label: Orchestrator
        section: extensions
        type: map
        description: Orchestrator-owned feature settings.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: orchestrator.mcp
        label: MCP
        section: extensions
        type: map
        description: Optional enablement of a configured feature.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: orchestrator.skills
        label: Skills
        section: extensions
        type: map
        description: Legacy no-op setting retained for compatibility. Use cloud.skills to configure cloud skills.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: otel.log_sse_deltas
        label: Log SSE deltas
        section: telemetry
        type: boolean
        description: Log successful SSE events whose kind ends in .delta. Defaults to true.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: plugins._default
        label: Default
        section: extensions
        type: map
        description: Defaults for installed plugin activation. Omission preserves source enablement.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: plugins.<name>.apps
        label: Apps
        section: extensions
        type: map
        description: Connector-wide app settings keyed by connector ID. Ignored when this plugin is disabled by configuration.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: plugins.<name>.auto_provision
        label: Auto provision
        section: extensions
        type: boolean
        description: Provisioning metadata. Omission does not request provisioning.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: plugins.<name>.release_id
        label: Release id
        section: extensions
        type: string
        description: Release identifier used to pin the remote plugin to a specific release. Omission leaves release selection unchanged.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: plugins.<name>.remote_plugin_id
        label: Remote plugin id
        section: extensions
        type: string
        description: Stable, unique identifier of a ChatGPT-hosted remote plugin. Availability to the requesting user is determined by Plugin Service at provisioning time.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: profile
        label: Profile
        section: other
        type: string
        description: Profile to use from the profiles map.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: profiles
        label: Profiles
        section: other
        type: map
        description: Named profiles to facilitate switching between different configurations.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: realtime
        label: Realtime
        section: other
        type: map
        description: Experimental / do not use. Realtime websocket session selection. version controls v1/v2 and type controls conversational/transcription.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: responses_api_metadata
        label: Responses API metadata
        section: other
        type: map
        description: Bounded, product-owned metadata attached to every Responses API request.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: sandbox_workspace_write
        label: Sandbox workspace write
        section: autonomy
        type: map
        description: Sandbox configuration to apply if sandbox is WorkspaceWrite.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: shell_environment_policy
        label: Shell environment policy
        section: autonomy
        type: map
        description: Policy for building the env when spawning a process via shell-like tools.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: skills
        label: Skills
        section: extensions
        type: map
        description: User-level skill config entries keyed by SKILL.md path.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tool_suggest
        label: Tool suggest
        section: other
        type: map
        description: Additional discoverable tools that can be suggested for installation.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tools
        label: Tools
        section: other
        type: map
        description: Nested tools section for feature toggles
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tools.client_search_provider
        label: Client search provider
        section: other
        type: enum
        values: [standalone, search_mcp]
        description: Client provider preference when the model does not select a provider.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.agents_overview_grouping
        label: Agents overview grouping
        section: other
        type: enum
        default: project
        values: [project, status, model]
        description: Last selected grouping in Agent Command Center.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.copy_on_select
        label: Copy on select
        section: other
        type: enum
        default: auto
        values: [auto, always, never]
        description: 'Copy selected transcript, footer, or composer text when the mouse button is released. Defaults to auto: enabled except in direct terminals known to forward their native copy shortcut (Ghostty 1.2+, Kitty on macOS, Windows Terminal, and VS Code on Windows).'
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.copy_on_select_clear_selection
        label: Copy on select clear selection
        section: other
        type: boolean
        default: false
        description: Deselect read-only transcript or footer text after Copy on select confirms delivery. Editable composer selections remain visible.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.default_hosts
        label: Default hosts
        section: other
        type: map
        description: Preferred hosts for new conversations, indexed by project and local user identity. Read from the user configuration only; values are never endpoints or credentials.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects
        label: Effects
        section: other
        type: map
        description: Individual visual effects. Each also requires animations to be enabled.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.effort
        label: Effort
        section: other
        type: boolean
        default: true
        description: Animate reasoning-effort changes in the composer and footer.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.progress
        label: Progress
        section: other
        type: boolean
        default: true
        description: Animate activity bullets and loading spinners.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.shimmer
        label: Shimmer
        section: other
        type: boolean
        default: true
        description: Shimmer status and loading text.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.starfield
        label: Starfield
        section: other
        type: boolean
        default: true
        description: Animate the composer starfield.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.title
        label: Title
        section: other
        type: boolean
        default: true
        description: Blink the terminal-title indicator when user action is required.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.effects.welcome
        label: Welcome
        section: other
        type: boolean
        default: true
        description: Animate the welcome artwork.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.fullscreen_transcript
        label: Fullscreen transcript
        section: other
        type: boolean
        default: true
        description: Own the fullscreen transcript, including scrolling, selection, and search. Defaults to true; alternate-screen restrictions take precedence.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.keymap
        label: Keymap
        section: other
        type: map
        description: Keybinding overrides for the TUI. This supports rebinding selected actions globally and by context.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.model_availability_nux
        label: Model availability nux
        section: other
        type: map
        description: Startup tooltip availability NUX state persisted by the TUI.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.mouse_scroll_speed
        label: Mouse scroll speed
        section: other
        type: number
        description: Mouse wheel speed multiplier for transcript scrolling, based on one row per event. Defaults to 1.0.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.pet
        label: Pet
        section: other
        type: string
        description: Pet id to preselect in the terminal pet picker. Custom pet ids resolve against CODEX_HOME/pets/<pet-id>/pet.json.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.pet_anchor
        label: Pet anchor
        section: other
        type: enum
        default: composer
        values: [composer, screen-bottom]
        description: Where the terminal pet should anchor vertically. Defaults to composer, which follows the current TUI composer viewport.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.presets
        label: Presets
        section: other
        type: map
        description: Saved inputs keyed by a single digit (0 through 9).
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.question_esc_back
        label: Question esc back
        section: other
        type: boolean
        default: true
        description: Escape returns from async questions to the composer, preserving the answer draft.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.rendering
        label: Rendering
        section: other
        type: map
        description: Rich content rendering. Independent of animations and visual effects.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.rendering.lists
        label: Lists
        section: other
        type: boolean
        default: true
        description: Render Markdown bullets and task-list markers as Unicode symbols.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.rendering.math
        label: Math
        section: other
        type: boolean
        default: true
        description: Render math expressions using Unicode notation.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.rendering.mermaid
        label: Mermaid
        section: other
        type: boolean
        default: true
        description: Render Mermaid code blocks as diagrams.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.rendering.tables
        label: Tables
        section: other
        type: boolean
        default: true
        description: Render pipe tables, including tables inside Markdown fences.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.right_click_paste
        label: Right click paste
        section: other
        type: enum
        default: auto
        values: [auto, 'on', 'off']
        description: Right-click text paste fallback. Defaults to auto (Windows/WSL/Linux). on also enables macOS; neither mode reads over SSH or in recognized VS Code terminals.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.screen_reader_detection_done
        label: Screen reader detection done
        section: other
        type: boolean
        description: Records the one-time screen-reader detection attempt. Either value skips detection.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.session_picker_view
        label: Session picker view
        section: other
        type: enum
        values: [comfortable, dense]
        description: Preferred layout for resume/fork session picker results.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.sidebar_width_percent
        label: Sidebar width percent
        section: other
        type: number
        description: Preferred docked sidebar width as a percentage of the terminal. Defaults to one third.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.status_line_use_colors
        label: Status line use colors
        section: other
        type: boolean
        default: true
        description: Color status line items with colors derived from the active syntax theme. Defaults to true.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: tui.terminal_resize_reflow_max_rows
        label: Terminal resize reflow max rows
        section: other
        type: number
        description: Trim terminal resize-reflow replay to the most recent rendered terminal rows when the transcript exceeds this cap. Omit to use Codex's terminal-specific default.
        doc: upstream/codex-cli-repo/codex-rs/core/config.schema.json
      - key: agent.name
        label: Agent name
        section: agents
        type: string
        description: Agent name Codex uses when spawning or referring to this agent. Required.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L391
      - key: agent.description
        label: Description
        section: agents
        type: string
        description: Guidance for when Codex should use this agent. Required.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L392
      - key: agent.developer_instructions
        label: Developer instructions
        section: agents
        type: string
        description: Core instructions that define the agent. Required.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L393
      - key: agent.model
        label: Agent model
        section: agents
        type: string
        description: Model for this agent.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L389
      - key: agent.model_reasoning_effort
        label: Model reasoning effort
        section: agents
        type: string
        description: Reasoning effort for this agent.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L389
      - key: agent.model_reasoning_summary
        label: Model reasoning summary
        section: agents
        type: enum
        values: [auto, concise, detailed, none]
        description: How much reasoning summary this agent produces.
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L389
      - key: agent.model_verbosity
        label: Model verbosity
        section: agents
        type: enum
        values: [low, medium, high]
        description: Output verbosity for this agent (GPT-5 models).
        doc: docs/learn.chatgpt.com/docs/agent-configuration/subagents.md#L389
      - key: env.CODEX_HOME
        label: Codex home
        section: startup
        type: string
        description: Sets the root for Codex state, including config, auth, logs, sessions, skills, and standalone package metadata. If you set it, the directory must already exist.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L17
      - key: env.CODEX_SQLITE_HOME
        label: Codex sqlite home
        section: other
        type: string
        description: Sets where SQLite-backed state is stored. The sqlite_home config option takes precedence.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L18
      - key: env.CODEX_NON_INTERACTIVE
        label: Codex non interactive
        section: startup
        type: boolean
        description: Set to 1, true, or yes to skip installer prompts. Prompts use their default response, so use this for scripted installs and updates, not first-run setup.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L32
      - key: env.CODEX_INSTALL_DIR
        label: Codex install dir
        section: startup
        type: string
        description: Changes where the visible codex command is installed. The standalone package cache still lives under CODEX_HOME/packages/standalone.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L33
      - key: env.CODEX_API_KEY
        label: Codex api key
        section: startup
        type: string
        description: Provides an API key to a non-interactive Codex process. Set it inline rather than job-wide when running repository-controlled code.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L50
      - key: env.CODEX_ACCESS_TOKEN
        label: Codex access token
        section: startup
        type: string
        description: Provides a ChatGPT or Codex access token for trusted automation. For persisted login, pipe it to codex login --with-access-token.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L51
      - key: env.OPENAI_FEDERATION_RULE_ID
        label: Openai federation rule id
        section: other
        type: string
        description: Selects the federation rule configured for the workload.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L52
      - key: env.OPENAI_IDENTITY_TOKEN_FILE
        label: Openai identity token file
        section: other
        type: string
        description: Points to the absolute path of the file that contains the current OIDC token or SPIFFE JWT-SVID.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L53
      - key: env.OPENAI_WORKLOAD_IDENTITY_CONTEXT
        label: Openai workload identity context
        section: context
        type: string
        description: Optionally supplies bounded JSON identifiers for client-reported audit attribution. It does not affect authentication or authorization.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L54
      - key: env.CODEX_CA_CERTIFICATE
        label: Codex ca certificate
        section: other
        type: string
        description: Points to a PEM CA bundle for environments with corporate TLS interception or private root certificates. Takes precedence over SSL_CERT_FILE.
        doc: docs/learn.chatgpt.com/docs/config-file/environment-variables.md#L55
      - key: env.SSL_CERT_FILE
        label: Ssl cert file
        section: other
