      - key: chat.agentHost.allowSignedOutWhenUsable
        label: Allow signed out when usable
        section: other
        type: boolean
        default: false
        description: Open the Agents window without GitHub authentication when at least one registered session type can run with its own provider credentials. Providers, models, and operations that require GitHub authentication prompt you to sign in when needed.
        doc: upstream/vscode-docs/docs/agents/reference/ai-settings.md#L282
      - key: chat.agentHost.byokModels.enabled
        label: Byok models enabled
        section: model
        type: boolean
        default: false
        description: Make extension-provided BYOK models available to the Agent Host. Changes are synchronized to the running process.
