# Telemetry source definitions for each AI tool.
#
# Defines where to find token/usage data, how to parse it, and what
# confidence level to assign. Used by tool_telemetry.py instead of
# hardcoded per-tool parser functions.
#
# Format:
#   tool_name:
#     source_id: <string>     # identifier for this source type
#     confidence: <float>     # 0.0-1.0 base confidence
#     files:                  # list of file patterns to scan
#       - pattern: <glob>     # relative to tool's state directory
#         format: <string>    # json, jsonl, toml, sqlite
#     fields:                 # JSON path mappings for token extraction
#       input_tokens: <path>
#       output_tokens: <path>
#       cache_read: <path>
#       cache_creation: <path>
#       sessions: <path>
#       messages: <path>
#       cost_usd: <path>
#       model: <path>

claude-code:
  source_id: stats-cache
  confidence: 0.95
  state_dir_fn: claude_global_dir  # function in platforms.py
  # Claude Code's local usage cache (rewritten in place; cumulative totals).
  # Parsed by tool_telemetry._parse_claude_code; the field paths below
  # document that parser's contract.
  files:
    - pattern: "stats-cache.json"
      format: json
  fields:
    sessions: "totalSessions"
    messages: "totalMessages"
    by_model: "modelUsage"                 # {model: {inputTokens, outputTokens, cacheReadInputTokens, cacheCreationInputTokens, costUSD}}
    input_tokens: "modelUsage.*.inputTokens"
    output_tokens: "modelUsage.*.outputTokens"
    cache_read: "modelUsage.*.cacheReadInputTokens"
    cache_creation: "modelUsage.*.cacheCreationInputTokens"
    cost_usd: "modelUsage.*.costUSD"
    daily: "dailyModelTokens"              # [{date, tokensByModel}]

copilot-cli:
  source_id: events-jsonl
  confidence: 0.90
  state_dir_fn: copilot_global_storage  # function in platforms.py
  files:
    - pattern: "**/*events*.jsonl"
      format: jsonl
    - pattern: "**/usage*.json"
      format: json
  fields:
    input_tokens: "prompt_tokens"
    output_tokens: "completion_tokens"
    model: "model"
  # Copilot events are per-request; sum across all lines
  aggregation: sum

# The desktop app shares the CLI's session-state directory. Its sessions are the
# rows of data.db whose session_type is not cli_session.
copilot-desktop:
  source_id: events-jsonl
  confidence: 0.90
  state_dir_fn: copilot_global_storage
  files:
    - pattern: "**/*events*.jsonl"
      format: jsonl
  fields:
    input_tokens: "prompt_tokens"
    output_tokens: "completion_tokens"
    model: "model"
  aggregation: sum

codex-cli:
  source_id: token-count
  confidence: 0.85
  state_dir_fn: codex_global_dir  # function in platforms.py
  # Rollout JSONL per session; token_count events carry CUMULATIVE totals
  # for the session, so only the last one per file counts (see
  # tool_telemetry._parse_codex_session).
  files:
    - pattern: "sessions/*/*/*/rollout-*.jsonl"
      format: jsonl
  fields:
    event_filter: "type == 'event_msg' and payload.type == 'token_count'"
    input_tokens: "payload.total_token_usage.input_tokens"
    output_tokens: "payload.total_token_usage.output_tokens"
    cache_read: "payload.total_token_usage.cached_input_tokens"
    model: "payload.model"                 # also session_meta.payload.model
  aggregation: last-per-session

cursor:
  source_id: state-vscdb
  confidence: 0.70
  state_dir_fn: cursor_user_dir
  files:
    - pattern: "globalStorage/state.vscdb"
      format: sqlite
  fields:
    input_tokens: "usage.inputTokens"
    output_tokens: "usage.outputTokens"
    model: "model"

continue:
  source_id: session-json
  confidence: 0.75
  files:
    - pattern: "sessions/*.json"
      format: json
  fields:
    input_tokens: "usage.promptTokens"
    output_tokens: "usage.completionTokens"
    model: "model"

copilot-vscode:
  source_id: otel-export
  confidence: 0.95
  state_dir_fn: vscode_user_dir
  files:
    - pattern: "**/*otel*export*.jsonl"
      format: jsonl
    - pattern: "**/*telemetry*.jsonl"
      format: jsonl
  fields:
    # OTel span format
    input_tokens: "attributes.llm.usage.prompt_tokens"
    output_tokens: "attributes.llm.usage.completion_tokens"
    model: "attributes.llm.request.model"
  aggregation: sum
  otel_span: true  # use OTel span extraction logic
