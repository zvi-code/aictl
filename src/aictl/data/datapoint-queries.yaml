alerts.headless_browser:
  calc: Count browser processes in latest cycle.
  query: SELECT COUNT(*) FROM samples WHERE metric = 'process.cpu.utilization' AND (tags LIKE '%chrome%' OR tags LIKE '%chromium%' OR tags LIKE '%firefox%') AND ts >= ?
alerts.orphan_mcp:
  calc: COUNT rows where status = orphan.
  query: SELECT value, tags FROM samples WHERE metric = 'aictl.mcp.detail.status' AND ts = (SELECT MAX(ts) FROM samples WHERE metric = 'aictl.mcp.detail.status')
alerts.process_anomalies:
  calc: Direct count of anomaly events.
  query: SELECT COUNT(*) FROM events WHERE kind = 'anomaly' AND ts >= ?
alerts.subagent_memory:
  calc: SUM memory for AI tool processes. Alert if > 2GB.
  query: SELECT SUM(value) FROM samples WHERE metric = 'process.memory.usage' AND ts = (SELECT MAX(ts) FROM samples WHERE metric = 'process.memory.usage')
api.api_calls:
  calc: 'Parse detail for model, duration_ms, tokens, status. Summary: COUNT, AVG, P95.'
  query: SELECT ts, detail FROM events WHERE kind IN ('api_call', 'api_error') AND ts BETWEEN ? AND ? ORDER BY ts DESC LIMIT ?
api.file_content:
  calc: Direct content. Truncated to 200KB.
  query: SELECT content FROM file_store WHERE path = ?
board.agent.activity:
  calc: Derived in _agent_row from the rows above.
  query: SELECT ts FROM requests WHERE session_id = ? AND agent_id = ? AND ts BETWEEN ? AND ?
board.agent.cached:
  calc: Derived in _agent_row from the rows above.
  query: SELECT SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_tokens + cache_read_tokens + cache_creation_tokens), 0) FROM requests WHERE session_id = ? AND agent_id = ?
board.agent.confirms_asked:
  calc: Derived in _agent_row from the rows above.
  query: SELECT COUNT(*) FROM tool_invocations WHERE session_id = ? AND agent_id = ? AND confirm <> ''
board.agent.cost:
  calc: Derived in _agent_row from the rows above.
  query: SELECT SUM(cost_usd) FROM requests WHERE session_id = ? AND agent_id = ?
board.agent.cpu:
  calc: Direct from the agent row.
  query: GET /api/board -> agents[].cpu (collector snapshot, no SQL)
board.agent.duration:
  calc: Derived in _agent_row from the rows above.
  query: SELECT started_at, ended_at FROM sessions WHERE session_id = ?
board.agent.failures:
  calc: Derived in _agent_row from the rows above.
  query: SELECT COUNT(*) FROM tool_invocations WHERE session_id = ? AND agent_id = ? AND is_error = 1 AND substr(tool_name, 1, 11) <> 'permission:'
board.agent.input:
  calc: Derived in _agent_row from the rows above.
  query: SELECT SUM(input_tokens) FROM requests WHERE session_id = ? AND agent_id = ?
board.agent.mem:
  calc: Direct from the agent row.
  query: GET /api/board -> agents[].mem (collector snapshot, no SQL)
board.agent.model:
  calc: Direct from the agent row.
  query: SELECT DISTINCT model FROM requests WHERE session_id = ? AND agent_id = ?
board.agent.msgs:
  calc: Derived in _agent_row from the rows above.
  query: SELECT (SELECT COUNT(*) FROM session_prompts WHERE session_id = ? AND agent_id = ?), (SELECT COUNT(*) FROM requests WHERE session_id = ? AND agent_id = ?)
board.agent.output:
  calc: Derived in _agent_row from the rows above.
  query: SELECT SUM(output_tokens) FROM requests WHERE session_id = ? AND agent_id = ?
board.agent.project:
  calc: Direct from the agent row.
  query: SELECT project_path FROM sessions WHERE session_id = ?
board.agent.status:
  calc: Derived in _agent_row from the rows above.
  query: SELECT MAX(ts), finish_reason FROM requests WHERE agent_id = '' AND session_id = ? GROUP BY session_id
board.agent.tool:
  calc: Direct from the agent row.
  query: SELECT tool FROM sessions WHERE session_id = ?
board.agent.tool_calls:
  calc: Derived in _agent_row from the rows above.
  query: SELECT COUNT(*) FROM tool_invocations WHERE session_id = ? AND agent_id = ? AND substr(tool_name, 1, 11) <> 'permission:'
board.attention.item:
  calc: One item per looping or waiting agent.
  query: GET /api/board -> attention[]
board.change.file:
  calc: GROUP BY path.
  query: SELECT path, MAX(project_path), SUM(json_extract(detail, '$.lines_added')), SUM(json_extract(detail, '$.lines_removed')), COUNT(*), MAX(ts) FROM file_write_events WHERE ts BETWEEN ? AND ? GROUP
    BY path
board.confirm.row:
  calc: COUNT per confirm value; median of confirm_wait_ms for approved and denied.
  query: SELECT tool_name, confirm, COUNT(*), AVG(confirm_wait_ms) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND confirm <> '' GROUP BY tool_name, confirm
board.context.daily_row:
  calc: GROUP BY day, model; cost uses stored cost, else list price.
  query: SELECT date(ts, 'unixepoch', 'localtime'), model, COUNT(*), SUM(input_tokens), SUM(output_tokens), SUM(cache_read_tokens), SUM(cache_creation_tokens), SUM(cost_usd) FROM requests WHERE ts >= ?
    GROUP BY 1, 2
board.context.file:
  calc: Direct file facts; the change dot is mtime within CONTEXT_RECENT_S.
  query: SELECT path, tool, kind, scope, size, tokens, sent_to_llm, loaded_when, last_changed FROM files ORDER BY tokens DESC
board.context.lifetime_as_of:
  calc: Direct from the telemetry record.
  query: GET /api/board/context -> telemetry[].as_of
board.context.lifetime_by_model:
  calc: Direct from the telemetry record.
  query: GET /api/board/context -> telemetry[].by_model[]
board.context.lifetime_errors:
  calc: Sort by timestamp and cut at CONTEXT_ERRORS.
  query: GET /api/board/context -> telemetry[].errors[]
board.context.map_item:
  calc: SUM tokens per name; the rest is one row.
  query: GET /api/board/context -> map.items[]
board.context.never_sent_files:
  calc: COUNT of files whose bucket is never.
  query: GET /api/board/context -> budget.totals.never_sent_files
board.context.project_share:
  calc: (global + project tokens) / window.
  query: GET /api/board/context -> budget.tools[].projects[]
board.context.survives_compaction:
  calc: SUM tokens of files with budget bucket always that survive compaction.
  query: GET /api/board/context -> budget.tools[].survives_compaction
board.context.window:
  calc: Lookup by model name.
  query: GET /api/board/context -> budget.tools[].window
board.coverage.row:
  calc: Compare stored facts with the expected set.
  query: SELECT tool, 'requests', MAX(cache_read_tokens > 0), MAX(cache_creation_tokens > 0), MAX(duration_ms > 0), MAX(ttft_ms > 0) FROM requests GROUP BY tool
board.credits:
  calc: SUM of billing_amount over the days inside the window.
  query: SELECT session_id, tool, daily_json FROM session_usage WHERE last_activity_at >= ? AND started_at <= ?
board.drawer.changes.file:
  calc: GROUP BY path.
  query: SELECT path, SUM(json_extract(detail, '$.lines_added')), SUM(json_extract(detail, '$.lines_removed')), COUNT(*) FROM file_write_events WHERE session_id = ? GROUP BY path ORDER BY MAX(ts) DESC LIMIT
    200
board.drawer.error.detail:
  calc: Direct rows.
  query: SELECT ts, result_summary, session_id, agent_id FROM tool_invocations WHERE tool_name = ? AND is_error = 1
board.drawer.errors.row:
  calc: Direct rows.
  query: SELECT ts, tool_name, result_summary FROM tool_invocations WHERE session_id = ? AND is_error = 1 ORDER BY ts DESC
board.drawer.events.row:
  calc: Direct rows.
  query: SELECT ts, kind, tool, detail FROM events WHERE session_id = ? ORDER BY ts DESC LIMIT 500
board.drawer.excerpt:
  calc: Read the file and cut the lines.
  query: GET /api/board/excerpt?path=<path>&line=<n>
board.drawer.file.detail:
  calc: Direct rows.
  query: SELECT ts, session_id, detail, source_event_id FROM file_write_events WHERE path = ? ORDER BY ts DESC
board.drawer.flow.event:
  calc: Direct rows, ordered by time.
  query: SELECT ts, agent_id, model, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, cost_usd, duration_ms, ttft_ms, finish_reason, is_error, error_type, http_status FROM requests
    WHERE session_id = ? AND ts >= ? AND ts < ? ORDER BY ts
board.drawer.flow.summary:
  calc: COUNT by event type; SUM of tokens.
  query: GET /api/board/agent/flow?id=<agent> -> summary
board.drawer.integrations.extensions:
  calc: SUM per extension.
  query: SELECT 1 FROM events WHERE session_id = ? AND kind LIKE '%lm.usage'
board.drawer.integrations.limits:
  calc: Direct from the newest event.
  query: SELECT ts, detail FROM events WHERE session_id = ? AND detail LIKE '%"rate_limits"%' ORDER BY ts DESC LIMIT 1
board.drawer.integrations.mcp:
  calc: GROUP BY server.
  query: GET /api/session-mcp-usage?session_id=<id>
board.drawer.overview.compactions:
  calc: Direct rows.
  query: SELECT ts, agent_id, trigger, before_tokens, after_tokens, duration_ms FROM context_events WHERE session_id = ? AND kind = 'compaction' ORDER BY ts
board.drawer.overview.context:
  calc: Direct per-call columns.
  query: SELECT input_tokens + cache_read_tokens + cache_creation_tokens, tool_tokens, max_prompt_tokens, request_bytes, available_tools FROM requests WHERE session_id = ? AND NOT is_error ORDER BY ts
board.drawer.overview.git:
  calc: Direct from git.
  query: GET /api/session-commits?session_id=<id>
board.drawer.overview.resources:
  calc: Sum over the session's pids.
  query: SELECT ts, SUM(cpu_percent), SUM(memory_rss_mb) FROM process_snapshots WHERE ts BETWEEN ? AND ? GROUP BY ts
board.drawer.overview.runs:
  calc: Value divided by the median of the other runs.
  query: SELECT session_id, started_at, ended_at, input_tokens, output_tokens, files_modified FROM sessions WHERE project_path = ? AND ended_at >= ?
board.drawer.overview.skills:
  calc: COUNT per skill name.
  query: SELECT name, COUNT(*), COUNT(DISTINCT agent_id), GROUP_CONCAT(DISTINCT trigger), MIN(ts), MAX(ts) FROM skill_uses WHERE session_id = ? GROUP BY name
board.drawer.overview.stats:
  calc: Sum of the agent's rows.
  query: GET /api/board/agent?id=<agent> -> agent
board.drawer.procs.row:
  calc: Direct rows.
  query: GET /api/session-processes?session_id=<id>
board.drawer.prompt.detail:
  calc: Direct row plus turn sums.
  query: SELECT ts, text, prompt_file, project_path, agent_id FROM session_prompts WHERE session_id = ? AND ts = ?
board.drawer.skill.detail:
  calc: Direct rows.
  query: SELECT ts, session_id, agent_id, tool, project_path, trigger FROM skill_uses WHERE name = ? ORDER BY ts DESC LIMIT 200
board.drawer.team.agent:
  calc: Direct rows in tree order.
  query: GET /api/session-stats?session_id=<id> -> agents[], tasks[]
board.drawer.timeline.row:
  calc: Direct rows.
  query: SELECT ts, agent_id, tool_name, target, input, result_summary, duration_ms, is_error, exit_code, confirm FROM tool_invocations WHERE session_id = ? AND ts >= ? AND ts < ? ORDER BY ts
board.drawer.tool.detail:
  calc: Direct rows.
  query: SELECT ts, target, session_id, agent_id, duration_ms, is_error, confirm FROM tool_invocations WHERE tool_name = ? ORDER BY ts DESC
board.drawer.tools.row:
  calc: Direct rows.
  query: SELECT ts, tool_name, target, duration_ms, is_error, confirm FROM tool_invocations WHERE session_id = ? ORDER BY ts DESC LIMIT 200
board.drawer.transcript.turn:
  calc: One turn per prompt.
  query: SELECT ts, agent_id, text FROM session_prompts WHERE session_id = ? AND ts >= ? AND ts < ? ORDER BY ts
board.drawer.turns.row:
  calc: SUM per turn.
  query: SELECT ts, text FROM session_prompts WHERE session_id = ? ORDER BY ts
board.effect.finding:
  calc: One row per rule hit.
  query: GET /api/context-audit -> findings[]
board.effect.value:
  calc: The highest-scope value wins.
  query: GET /api/settings/tools -> tool_configs[]
board.error.row:
  calc: GROUP BY normalised message.
  query: SELECT tool_name, result_summary, COUNT(*), MAX(ts) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:' AND is_error = 1 GROUP BY tool_name, result_summary
board.ingester.row:
  calc: Status from enabled, source_exists and data-quality severity.
  query: GET /api/board/machine -> pipeline.ingesters[]
board.kpi.cached_share:
  calc: cache_read divided by all input-side tokens.
  query: SELECT SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_tokens + cache_read_tokens + cache_creation_tokens), 0) FROM requests WHERE ts BETWEEN ? AND ?
board.kpi.cost_usd:
  calc: SUM of stored cost, plus list price for calls without one.
  query: SELECT SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ?
board.kpi.fail_rate:
  calc: failures divided by tool calls.
  query: SELECT SUM(is_error) * 1.0 / COUNT(*) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:'
board.kpi.failures:
  calc: COUNT of call rows with is_error.
  query: SELECT COUNT(*) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:' AND is_error = 1
board.kpi.idle:
  calc: Count sessions with status idle.
  query: GET /api/board -> kpis.idle
board.kpi.loops:
  calc: Count loops that find_loops reports.
  query: SELECT session_id, agent_id, ts, tool_name, target, is_error, exit_code, input FROM tool_invocations WHERE ts BETWEEN ? AND ? ORDER BY ts, id
board.kpi.messages:
  calc: requests count + user prompts + tool calls.
  query: SELECT (SELECT COUNT(*) FROM requests WHERE ts BETWEEN ? AND ?) + (SELECT COUNT(*) FROM session_prompts WHERE ts BETWEEN ? AND ? AND agent_id = '') + (SELECT COUNT(*) FROM tool_invocations WHERE
    ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:')
board.kpi.p95_ms:
  calc: Sort the durations and take the 0.95 and 0.50 ranks.
  query: SELECT duration_ms FROM requests WHERE ts BETWEEN ? AND ? AND duration_ms > 0 ORDER BY duration_ms
board.kpi.prev:
  calc: Run the request and tool-call sums over the earlier window.
  query: SELECT COUNT(*), SUM(input_tokens + output_tokens + cache_read_tokens + cache_creation_tokens), SUM(cost_usd) FROM requests WHERE ts >= ? AND ts < ?
board.kpi.running:
  calc: Count sessions with an active status.
  query: GET /api/board -> kpis.running
board.kpi.subagents_running:
  calc: Count subagents with an active status.
  query: GET /api/board -> kpis.subagents_running
board.kpi.tokens:
  calc: SUM of the four token columns.
  query: SELECT SUM(input_tokens + output_tokens + cache_read_tokens + cache_creation_tokens) FROM requests WHERE ts BETWEEN ? AND ?
board.kpi.tool_calls:
  calc: COUNT of call rows.
  query: SELECT COUNT(*) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:'
board.latency.reply:
  calc: Percentiles of the sorted durations.
  query: SELECT duration_ms FROM requests WHERE ts BETWEEN ? AND ? AND duration_ms > 0 ORDER BY duration_ms
board.latency.run:
  calc: Percentiles of run lengths.
  query: SELECT started_at, ended_at FROM sessions WHERE started_at >= ?
board.latency.tool:
  calc: Percentiles of duration_ms.
  query: SELECT duration_ms FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:' AND duration_ms > 0 ORDER BY duration_ms
board.latency.ttft:
  calc: Percentiles of ttft_ms.
  query: SELECT ttft_ms FROM requests WHERE ts BETWEEN ? AND ? AND ttft_ms > 0 ORDER BY ttft_ms
board.latency.turn:
  calc: MAX(ts + duration) of requests in the turn minus the prompt time.
  query: WITH w AS (SELECT value ->> 0 sid, value ->> 1 t, value ->> 2 nx FROM json_each(?)) SELECT w.sid, w.t, MAX(r.ts + r.duration_ms / 1000.0) FROM w LEFT JOIN requests r ON r.session_id = w.sid AND
    r.ts >= w.t AND r.ts < w.nx GROUP BY w.sid, w.t
board.loop.row:
  calc: Detect repeated call patterns; sum requests in range.
  query: SELECT session_id, agent_id, ts, tool_name, target, is_error, exit_code, input FROM tool_invocations WHERE ts BETWEEN ? AND ? ORDER BY ts, id
board.machine.cleanup:
  calc: Format a kill command.
  query: GET /api/board/machine -> alerts[].action
board.machine.cores:
  calc: Direct value.
  query: GET /api/board/machine -> cpu_cores
board.machine.process_name:
  calc: Direct fields of the process record.
  query: SELECT tool, ts, SUM(cpu_percent), SUM(memory_rss_mb) FROM process_snapshots WHERE ts >= ? GROUP BY tool, ts
board.machine.process_parent:
  calc: Direct value.
  query: GET /api/board/machine -> processes[].ppid
board.machine.traffic.file_events:
  calc: Direct value.
  query: GET /api/board/machine -> monitor.per_tool[].file_events
board.machine.traffic.token_confidence:
  calc: Direct value.
  query: GET /api/board/machine -> monitor.per_tool[].est_confidence
board.machine.traffic.workspace:
  calc: workspace_size_mb times 1 048 576.
  query: GET /api/board/machine -> monitor.per_tool[].workspace_bytes
board.memfile.row:
  calc: Direct rows; change from file_write_events.
  query: SELECT path, tool, scope, tokens, last_changed FROM files WHERE category LIKE '%memory%' OR category LIKE '%instruction%' ORDER BY last_changed DESC
board.model.row:
  calc: GROUP BY model, then percentile of durations.
  query: SELECT model, COUNT(*), SUM(input_tokens), SUM(output_tokens), SUM(cache_read_tokens), SUM(cache_creation_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY model
board.project.agents:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].agents
board.project.api_errors:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.cached:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.cost:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.lines:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].lines
board.project.loops:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].loops
board.project.msgs:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.p95:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.prompts:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].prompts
board.project.tests:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].tests
board.project.tokens:
  calc: One value per project in the projects list.
  query: SELECT project_path, COUNT(*), SUM(input_tokens + output_tokens), SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY project_path
board.project.tool_calls:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].tool_calls
board.project.tool_fail:
  calc: One value per project in the projects list.
  query: GET /api/board -> projects[].tool_fail
board.project_prompt.row:
  calc: COUNT of prompts per prompt_file.
  query: SELECT prompt_file, project_path, MAX(session_id), COUNT(*), MAX(ts) FROM session_prompts WHERE prompt_file <> '' GROUP BY prompt_file, project_path
board.prompt.row:
  calc: Direct rows; turn tokens are summed from requests until the next prompt.
  query: SELECT ts, session_id, agent_id, project_path, text, prompt_file FROM session_prompts WHERE ts BETWEEN ? AND ? AND agent_id = '' ORDER BY ts DESC
board.prompt.total:
  calc: COUNT of prompt rows.
  query: SELECT COUNT(*) FROM session_prompts WHERE ts BETWEEN ? AND ? AND agent_id = ''
board.quality.row:
  calc: Direct rows.
  query: SELECT component, source, kind, status, severity, message, count, updated_at FROM data_quality_status ORDER BY updated_at DESC LIMIT 50
board.role.row:
  calc: Sum the agent rows by role.
  query: SELECT task, COUNT(*) FROM agents WHERE session_id IN (SELECT value FROM json_each(?)) GROUP BY task
board.saved_usd:
  calc: SUM(cache_read_tokens) * (input price - cache read price) per model.
  query: SELECT model, SUM(cache_read_tokens) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY model
board.self.children:
  calc: Daemon value minus the children.
  query: GET /api/board -> self.children[]
board.self.history:
  calc: Direct values.
  query: GET /api/board -> self.history_bytes
board.self.sink:
  calc: Direct values.
  query: GET /api/board/machine -> pipeline.sink
board.self.stream:
  calc: Direct values.
  query: GET /api/board/machine -> pipeline.stream
board.series.cache_rate:
  calc: cache_read / all input tokens per bucket.
  query: SELECT CAST((ts - ?) / ? AS INTEGER) b, SUM(cache_read_tokens) * 1.0 / NULLIF(SUM(input_tokens + cache_read_tokens + cache_creation_tokens), 0) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY b
board.series.cost:
  calc: SUM of cost per bucket and group.
  query: SELECT CAST((ts - ?) / ? AS INTEGER) b, tool, project_path, model, SUM(cost_usd) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY b, tool, project_path, model
board.series.messages:
  calc: COUNT per bucket and kind.
  query: SELECT CAST((ts - ?) / ? AS INTEGER) b, COUNT(*) FROM session_prompts WHERE ts BETWEEN ? AND ? AND agent_id = '' GROUP BY b
board.series.tokens:
  calc: SUM per bucket and token kind.
  query: SELECT CAST((ts - ?) / ? AS INTEGER) b, SUM(cache_read_tokens), SUM(input_tokens), SUM(cache_creation_tokens), SUM(output_tokens) FROM requests WHERE ts BETWEEN ? AND ? GROUP BY b
board.settings.file:
  calc: os.stat of each path.
  query: GET /api/settings/files -> files[]
board.settings.hooks:
  calc: Direct value.
  query: GET /api/hooks-status
board.settings.model:
  calc: Resolve by scope order.
  query: GET /api/effective-models
board.settings.permissions:
  calc: Parse the rule lists of each scope.
  query: GET /api/settings/tools -> tool_configs[]
board.settings.row:
  calc: Direct from the config record; the model.js rules group rows into sections.
  query: GET /api/settings/tools -> tool_configs[]
board.skill.row:
  calc: COUNT of uses and distinct agents per skill name.
  query: SELECT name, COUNT(*), COUNT(DISTINCT agent_id) FROM skill_uses WHERE ts BETWEEN ? AND ? GROUP BY name
board.source.errors:
  calc: COUNT of error records.
  query: GET /api/board/machine -> pipeline.freshness[].errors
board.source.row:
  calc: MAX per tool and source.
  query: SELECT tool, source, MAX(ts) FROM requests GROUP BY tool, source
board.test.piped:
  calc: COUNT matching runs.
  query: SELECT COUNT(*) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND (target LIKE '%test%' OR target LIKE '%jest%' OR target LIKE '%tox%') AND is_error = 0
board.test.row:
  calc: GROUP BY target.
  query: SELECT target, COUNT(*), SUM(is_error OR exit_code <> 0), MAX(ts) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND (target LIKE '%test%' OR target LIKE '%jest%' OR target LIKE '%tox%') GROUP
    BY target
board.tool.row:
  calc: GROUP BY tool_name; percentiles over duration_ms.
  query: SELECT tool_name, COUNT(*), SUM(is_error), MAX(duration_ms) FROM tool_invocations WHERE ts BETWEEN ? AND ? AND substr(tool_name, 1, 11) <> 'permission:' GROUP BY tool_name
board.unpriced:
  calc: SUM tokens of unpriced models.
  query: SELECT model, SUM(input_tokens + output_tokens + cache_read_tokens + cache_creation_tokens) FROM requests WHERE ts BETWEEN ? AND ? AND cost_usd = 0 GROUP BY model
board.workflow.row:
  calc: Filter the file list with _is_workflow and _is_prompt.
  query: SELECT path, tool, kind, size, tokens, last_changed FROM files WHERE category LIKE '%workflow%' OR category LIKE '%prompt%'
budget.context_window.always_loaded:
  calc: Sum tokens. Realistic = global_always + largest_project_always.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'yes' AND p.loaded_when = 'every-call'
budget.context_window.cacheable:
  calc: Sum tokens for cacheable files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.cacheable = 'yes'
budget.context_window.conditional:
  calc: Sum tokens for conditional files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm IN ('conditional', 'partial')
budget.context_window.on_demand:
  calc: Sum tokens for on-demand files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'on-demand' OR p.loaded_when = 'on-demand'
budget.context_window.percentage:
  calc: (loaded / model_max_context(model)) * 100.
  query: SELECT SUM(f.tokens) as loaded, (SELECT model FROM tool_telemetry ORDER BY ts DESC LIMIT 1) as model FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'yes'
budget.daily_tokens:
  calc: SUM per day and model; cost from stored cost or list price.
  query: SELECT date(ts, 'unixepoch', 'localtime'), model, COUNT(*), SUM(input_tokens), SUM(output_tokens), SUM(cache_read_tokens), SUM(cache_creation_tokens), SUM(cost_usd) FROM requests WHERE ts >= ?
    GROUP BY 1, 2
budget.model_detected:
  calc: Direct value.
  query: SELECT model FROM tool_telemetry WHERE model != '' ORDER BY ts DESC LIMIT 1
budget.project_estimate:
  calc: Largest project = MAX scope by tokens. Realistic = global + largest.
  query: SELECT scope, SUM(tokens) as tokens FROM file_store GROUP BY scope ORDER BY tokens DESC
budget.token_by_category:
  calc: SUM tokens per tool and kind; sent = tokens whose budget bucket is not never.
  query: SELECT tool, kind, COUNT(*), SUM(size), SUM(tokens) FROM files GROUP BY tool, kind
budget.token_by_tool:
  calc: SUM tokens per tool.
  query: SELECT tool, SUM(tokens), SUM(CASE WHEN sent_to_llm = 'no' THEN tokens ELSE 0 END) FROM files GROUP BY tool
events.tool.cpu_chart:
  calc: Direct time series.
  query: SELECT ts, cpu FROM tool_metrics WHERE tool = ? AND ts BETWEEN ? AND ? ORDER BY ts
events.tool.live.inbound_rate_bps:
  calc: Direct rate in bytes/sec.
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.network.io' AND tags LIKE '%?tool?%' AND tags LIKE '%receive%' ORDER BY ts DESC LIMIT 1
events.tool.live.outbound_rate_bps:
  calc: Direct rate in bytes/sec.
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.network.io' AND tags LIKE '%?tool?%' AND tags LIKE '%transmit%' ORDER BY ts DESC LIMIT 1
events.tool.memory_chart:
  calc: Direct time series in MB.
  query: SELECT ts, mem_mb FROM tool_metrics WHERE tool = ? AND ts BETWEEN ? AND ? ORDER BY ts
files.category.count:
  calc: Direct count per category.
  query: SELECT category, COUNT(*) FROM file_store WHERE tool = ? GROUP BY category
files.category.tokens:
  calc: Direct sum per category.
  query: SELECT category, SUM(tokens) FROM file_store WHERE tool = ? GROUP BY category
files.item.activity:
  calc: 'green: last_changed >= prev_cycle; orange: now - mtime < 300; grey: otherwise.'
  query: SELECT mtime, last_changed FROM file_store WHERE path = ?
files.item.sent_to_llm:
  calc: Direct lookup.
  query: SELECT sent_to_llm FROM path_specs WHERE ai_tool = ? AND path_template = ?
files.item.size:
  calc: Direct value.
  query: SELECT size_bytes FROM file_store WHERE path = ?
files.item.tokens:
  calc: Direct value.
  query: SELECT tokens FROM file_store WHERE path = ?
live.diagnostics.collector_name:
  calc: Extract collector name from metric suffix.
  query: SELECT DISTINCT metric FROM samples WHERE metric LIKE 'aictl.collector.%'
live.diagnostics.mode:
  calc: Parse mode from tags JSON.
  query: SELECT tags FROM samples WHERE metric LIKE 'aictl.collector.%status' ORDER BY ts DESC
live.diagnostics.status:
  calc: value 1.0 = active, 0.0 = disabled.
  query: SELECT value, tags FROM samples WHERE metric LIKE 'aictl.collector.%status' ORDER BY ts DESC
live.monitor_roots:
  calc: Union of workspace and state root paths.
  query: SELECT DISTINCT json_extract(detail, '$.workspace') FROM events WHERE kind = 'session_start' AND ts >= ? UNION SELECT DISTINCT json_extract(detail, '$.state_root') FROM events WHERE kind = 'file_modified'
    AND ts >= ?
memory.entry.activity:
  calc: 'green: last_changed in current cycle; orange: mtime within 300s; grey: otherwise.'
  query: SELECT path, mtime, last_changed FROM file_store WHERE category = 'memory'
memory.entry.tokens:
  calc: Direct value. Estimated as ceil(size_bytes / 4).
  query: SELECT tokens FROM file_store WHERE path = ?
memory.growth_chart:
  calc: Last value per time slot.
  query: SELECT MAX(ts), mem_tokens, memory_entries FROM system_snapshots WHERE ts >= ? GROUP BY CAST((ts - ?) / ? AS INTEGER) ORDER BY 1
otel.receiver.active:
  calc: 1 if last OTel data within 300s, else 0.
  query: SELECT CASE WHEN (strftime('%s','now') - MAX(ts)) < 300 THEN 1 ELSE 0 END FROM (SELECT MAX(ts) as ts FROM samples WHERE metric LIKE 'otel.%' UNION SELECT MAX(ts) FROM events WHERE kind LIKE 'otel:%')
otel.receiver.api_calls_total:
  calc: Count across logs + traces.
  query: SELECT COUNT(*) FROM events WHERE kind IN ('otel:copilot_chat.api_request', 'otel:claude_code.api_request', 'otel:codex.api_request') OR (kind LIKE 'otel:%' AND (kind LIKE '%inference%' OR kind
    LIKE '%chat.completion%'))
otel.receiver.api_errors_total:
  calc: Count across logs + traces.
  query: SELECT COUNT(*) FROM events WHERE kind IN ('otel:copilot_chat.api_error', 'otel:claude_code.api_error', 'otel:codex.api_error') OR (kind LIKE 'otel:%' AND json_extract(detail, '$.error.type') IS
    NOT NULL)
otel.receiver.events_received:
  calc: Total OTel-originated events in DB.
  query: SELECT COUNT(*) FROM events WHERE kind LIKE 'otel:%'
otel.receiver.last_receive:
  calc: strftime('%s','now') - MAX(ts) = seconds since last OTel data.
  query: SELECT MAX(ts) FROM (SELECT MAX(ts) as ts FROM samples WHERE metric LIKE 'otel.%' UNION SELECT MAX(ts) FROM events WHERE kind LIKE 'otel:%')
otel.receiver.metrics_received:
  calc: Total OTel-originated samples in DB.
  query: SELECT COUNT(*) FROM samples WHERE metric LIKE 'otel.%'
otel.receiver.parse_errors:
  calc: Direct counter. Falls back to 0 if no sample.
  query: SELECT value FROM samples WHERE metric = 'aictl.otel.parse_errors' ORDER BY ts DESC LIMIT 1
overview.context_map.by_category:
  calc: Direct grouping. Bar widths proportional to tokens.
  query: SELECT category, COUNT(*) as files, SUM(tokens) as tokens FROM file_store GROUP BY category ORDER BY tokens DESC
overview.context_map.by_project:
  calc: Group by scope (project root).
  query: SELECT scope, COUNT(*) as files, SUM(tokens) as tokens FROM file_store GROUP BY scope ORDER BY tokens DESC
overview.context_map.conditional:
  calc: Sum tokens for conditional files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm IN ('conditional', 'partial')
overview.context_map.not_sent:
  calc: Sum tokens for never-sent files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'no'
overview.context_map.on_demand:
  calc: Sum tokens for on-demand files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'on-demand' OR p.loaded_when = 'on-demand'
overview.context_map.sent_to_llm:
  calc: Sum tokens for always-loaded files.
  query: SELECT SUM(f.tokens) FROM file_store f JOIN path_specs p ON f.tool = p.ai_tool WHERE p.sent_to_llm = 'yes' AND p.loaded_when = 'every-call'
overview.cpu:
  calc: Direct value (sum of all tool process CPU %).
  query: SELECT ts, cpu FROM metrics WHERE ts >= ? ORDER BY ts
overview.cpu_per_core:
  calc: One row per core (tag cpu.id). Value 0.0-1.0; multiply by 100 for percent.
  query: SELECT ts, value, tags FROM samples WHERE metric = 'system.cpu.utilization' AND ts >= ? ORDER BY ts
overview.files:
  calc: Direct value. Latest row = current; series = sparkline.
  query: SELECT ts, files FROM metrics WHERE ts >= ? ORDER BY ts
overview.mem_mb:
  calc: Direct value in MB. UI multiplies by 1048576 for byte display.
  query: SELECT ts, mem_mb FROM metrics WHERE ts >= ? ORDER BY ts
overview.tokens:
  calc: Direct value.
  query: SELECT ts, tokens FROM metrics WHERE ts >= ? ORDER BY ts
overview.total_memory_tokens:
  calc: 'Direct value. Also: SELECT SUM(tokens) FROM file_store WHERE category = ''memory''.'
  query: SELECT ts, mem_tokens FROM metrics WHERE ts >= ? ORDER BY ts
overview.total_processes:
  calc: SUM(value) grouped by tag aictl.tool.
  query: SELECT value, tags FROM samples WHERE metric = 'aictl.discovery.processes' AND ts = (SELECT MAX(ts) FROM samples WHERE metric = 'aictl.discovery.processes')
procs.tool.anomaly:
  calc: Parse detail JSON for anomaly type, severity, affected PID.
  query: SELECT detail FROM events WHERE kind = 'anomaly' AND tool = ? AND ts >= ? ORDER BY ts DESC
procs.tool.config.auto_update:
  calc: Parse auto_update from detail JSON.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.config.extensions:
  calc: Parse extensions list from detail JSON.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.config.features:
  calc: Parse features dict from detail JSON.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.config.hints:
  calc: Parse hints list from detail JSON. Generated from config analysis.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.config.launch_at_startup:
  calc: Parse launch_at_startup from detail JSON.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.config.mcp_servers:
  calc: Distinct MCP server names for this tool.
  query: SELECT DISTINCT json_extract(tags, '$.aictl.mcp.server') FROM samples WHERE metric = 'aictl.mcp.status' AND tags LIKE '%?tool?%'
procs.tool.config.model:
  calc: Model name from tag gen_ai.request.model.
  query: SELECT value, tags FROM samples WHERE metric = 'aictl.config.model' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.config.otel:
  calc: Parse OTel config from tags.
  query: SELECT value, tags FROM samples WHERE metric LIKE 'aictl.collector.%' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.config.otel_capture_content:
  calc: Parse otel.capture_content from detail JSON.
  query: SELECT detail FROM events WHERE kind = 'config_snapshot' AND tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.cpu_pct:
  calc: value * 100 = percent.
  query: SELECT value FROM samples WHERE metric = 'process.cpu.utilization' AND tags LIKE '%?pid?%' ORDER BY ts DESC LIMIT 1
procs.tool.live.cpu:
  calc: 'value * 100 = percent. Peak: MAX(value) over session.'
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.cpu' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.live.files_touched:
  calc: Count unique file paths in session window.
  query: SELECT COUNT(DISTINCT json_extract(detail, '$.path')) FROM events WHERE kind = 'file_modified' AND tool = ? AND ts >= ?
procs.tool.live.mcp_detected:
  calc: value >= 0.45 → detected. Loops = network_burst_peaks // 2.
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.mcp.score' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.live.pid_count:
  calc: Direct value.
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.pids' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.live.session_count:
  calc: Direct value.
  query: SELECT value FROM samples WHERE metric = 'aictl.tool.sessions' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 1
procs.tool.live.tokens:
  calc: type=input and type=output rows. Confidence from aictl.tool.token.confidence sample.
  query: SELECT value, tags FROM samples WHERE metric = 'aictl.tool.token.usage' AND tags LIKE '%?tool?%' ORDER BY ts DESC LIMIT 2
procs.tool.live.workspaces:
  calc: Distinct workspace paths from recent session_start events.
  query: SELECT DISTINCT json_extract(detail, '$.workspace') FROM events WHERE kind = 'session_start' AND tool = ? AND ts >= ?
procs.tool.mem_rss:
  calc: Direct value in bytes.
  query: SELECT value FROM samples WHERE metric = 'process.memory.usage' AND tags LIKE '%?pid?%' ORDER BY ts DESC LIMIT 1
procs.tool.process_type:
  calc: Direct lookup from CSV specs.
  query: SELECT process_type FROM process_specs WHERE ai_tool = ? AND process_name = ?
procs.tool.telemetry.api_duration_ms:
  calc: Parse quota_state.total_api_duration_ms. Timeout if value / sessions > 30000.
  query: SELECT by_model_json FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.cache_read:
  calc: Direct value.
  query: SELECT cache_read_tokens FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.cache_write:
  calc: Direct value.
  query: SELECT cache_creation_tokens FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.confidence:
  calc: Direct value 0.0-1.0. Multiply by 100 for percent.
  query: SELECT confidence FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.cost_usd:
  calc: Direct value in USD.
  query: SELECT cost_usd FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.errors:
  calc: Parse errors array from extended JSON.
  query: SELECT by_model_json FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.input_tokens:
  calc: Direct value. Lifetime cumulative.
  query: SELECT input_tokens FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.messages:
  calc: Direct value.
  query: SELECT total_messages FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.output_tokens:
  calc: Direct value.
  query: SELECT output_tokens FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.premium_requests:
  calc: Parse quota_state.premium_requests_used from JSON.
  query: SELECT by_model_json FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.telemetry.sessions:
  calc: Direct value.
  query: SELECT total_sessions FROM tool_telemetry WHERE tool = ? ORDER BY ts DESC LIMIT 1
procs.tool.zombie_risk:
  calc: Direct lookup from CSV specs.
  query: SELECT zombie_risk FROM process_specs WHERE ai_tool = ? AND process_name = ?
self.cpu_percent:
  calc: Direct from /api/self-status → cpu_percent() of the aictl process plus its child processes (daemon_cpu_percent and children give the split).
  query: SELECT cpu_percent FROM (SELECT value as cpu_percent FROM json_each(?) WHERE key = 'cpu_percent')
self.db_rows:
  calc: SUM of row counts across main data tables.
  query: SELECT (SELECT COUNT(*) FROM metrics) + (SELECT COUNT(*) FROM tool_metrics) + (SELECT COUNT(*) FROM events) + (SELECT COUNT(*) FROM samples) as total
self.db_size:
  calc: 'Direct from /api/self-status → db.stats()[''file_size_bytes'']. Or: os.stat(db_path).st_size.'
  query: SELECT file_size_bytes FROM (SELECT value as file_size_bytes FROM json_each(?) WHERE key = 'file_size_bytes')
self.memory_rss:
  calc: Direct from /api/self-status → memory_info().rss of the aictl process plus its child processes (daemon_memory_rss_bytes and children give the split).
  query: SELECT memory_rss_bytes FROM (SELECT value as memory_rss_bytes FROM json_each(?) WHERE key = 'memory_rss_bytes')
self.threads:
  calc: Direct from /api/self-status → psutil.Process(os.getpid()).num_threads().
  query: SELECT threads FROM (SELECT value as threads FROM json_each(?) WHERE key = 'threads')
self.uptime:
  calc: Direct from /api/self-status → time.time() - process.create_time().
  query: SELECT uptime_s FROM (SELECT value as uptime_s FROM json_each(?) WHERE key = 'uptime_s')
