    session_prompts, context_events) merged with hook and OTel events.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Flow
  dynamic_source: false

board.drawer.flow.summary:
  explanation: >
    Turns, tool calls, subagents, hooks, errors, compactions, total tokens,
    largest turn and time to first token of the session.
  source: >
    board_api._flow_summary over the merged flow events.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Flow
  dynamic_source: false

api.api_calls:
  explanation: >
    Individual API call records received via OpenTelemetry — model, latency,
    tokens, errors. Provides per-request visibility.
  source: >
    Aggregated from OTel receiver events matching gen_ai.* span types. Each
    call logged with model, duration_ms, input/output tokens, status, and
    optional error details.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Agent drawer
  section: Integrations
  dynamic_source: true

board.drawer.integrations.extensions:
  explanation: >
    VS Code language-model tokens by extension: tokens in and out, calls,
    models.
  source: >
    board_api._lm_by_extension over analysis.lm_usage.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Agent drawer
  section: Integrations
  dynamic_source: false

board.drawer.integrations.limits:
  explanation: >
    Rate-limit windows the tool reported for the session: used share and
    reset time.
  source: >
    board_api._rate_limit: newest events row whose detail holds rate_limits.
  source_type: raw
  unit: percent
  update_freq: on-collect
  tab: Agent drawer
  section: Integrations
  dynamic_source: false

board.drawer.integrations.mcp:
  explanation: >
    MCP servers: calls, errors, total time and last call, and servers
    configured but not used.
  source: >
    GET /api/session-mcp-usage over tool_invocations of MCP tools.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Integrations
  dynamic_source: false

board.drawer.overview.compactions:
  explanation: >
    Compactions: time, trigger, tokens before and after, duration.
  source: >
    context_events rows of kind compaction.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.context:
  explanation: >
    Context size per call (first, last, peak), tool definitions, tools
    available, and the split at shutdown (system, conversation, tools).
  source: >
    board_api._agent_context over requests.max_prompt_tokens, tool_tokens,
    available_tools and context_events.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.git:
  explanation: >
    Branch, commit and dirty state of the project at the session.
  source: >
    board_api._agent_git, with commits from /api/session-commits.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.resources:
  explanation: >
    CPU, RAM and network of the agent's process tree, and tokens a minute.
  source: >
    board_api._agent_resources from the collector snapshot and
    process_snapshots.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.runs:
  explanation: >
    Earlier runs in the same project with duration, tokens and file churn
    against the median of the others.
  source: >
    board_api._agent_runs over the sessions table.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.skills:
  explanation: >
    Skills the agent used, with uses and who started them.
  source: >
    board_api._agent_skills over skill_uses.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.overview.stats:
  explanation: >
    Messages, tokens, cached share, cost, tool calls with failures, time and
    lines for one agent.
  source: >
    board_api.agent_detail: the agent row plus file_write_events lines.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Overview
  dynamic_source: false

board.drawer.procs.row:
  explanation: >
    Live process tree of the session and the recorded process list kept
    after it ends, with role, CPU, RAM and the programs started.
  source: >
    agent_detail resources.process_tree and GET /api/session-processes.
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Agent drawer
  section: Processes
  dynamic_source: false

board.drawer.prompt.detail:
  explanation: >
    One prompt: full text, prompt file, and the input, output, cache read,
    duration and tool calls of its turn.
  source: >
    board_api.prompt_detail (GET /api/board/prompt).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Prompt detail
  dynamic_source: false

board.drawer.skill.detail:
  explanation: >
    One skill: who can see it, uses, agents, trigger and file reads.
  source: >
    board_api.skill_detail (GET /api/board/skill).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Skill detail
  dynamic_source: false

board.drawer.team.agent:
  explanation: >
    Subagents and tasks the tool reported: state, model, task, time and
    tokens. States: active, idle, ended, not started; tasks: pending,
    active, done.
  source: >
    GET /api/session-stats (entity state built from hook events and subagent
