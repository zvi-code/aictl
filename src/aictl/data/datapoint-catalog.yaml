# Datapoint Catalog - explains every datapoint the aictl board shows.
#
# The board is the only dashboard UI. Each entry is a field a user sees, with a meaning and a source.
#
# Each entry has:
#   explanation:    What this datapoint represents (static, human-readable)
#   source:         How the value is collected or calculated (the function or query that computes it)
#   source_type:    raw | deduced | aggregated
#   unit:           tokens, bytes, percent, count, rate_bps, usd, seconds, ratio
#   update_freq:    realtime | on-collect | on-discovery | static
#   tab:            The board section that shows it: Agents, Usage and cost, Prompts and skills,
#                   Context, Tools, failures and speed, Changes and testing, Machine,
#                   Settings in effect, Where the data comes from; or Agent drawer, Settings
#   section:        The panel (or the drawer tab) inside that board section
#   otel_metric:    Corresponding OTel metric name (if any)
#   dynamic_source: true if the source description gains detail as data arrives


# ===============================================================
# AGENTS
# ===============================================================

board.agent.activity:
  explanation: >
    Calls per time slot, as a small trend.
  source: >
    _activity_for: request and tool-call counts per spark slot.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.cached:
  explanation: >
    Cache read as a share of all input tokens.
  source: >
    cache_read_tokens / (input + cache_read + cache_creation) of the agent.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.confirms_asked:
  explanation: >
    Confirmations the agent asked for.
  source: >
    COUNT of tool_invocations rows with a confirm value.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.cost:
  explanation: >
    Cost of the agent at stored cost or list price.
  source: >
    SUM(requests.cost_usd), else _list_cost from the model price table.
  source_type: aggregated
  unit: usd
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.cpu:
  explanation: >
    CPU of the agent's live processes.
  source: >
    Sum of cpu_pct of the session's pids in the collector snapshot; falls
    back to the live session figure.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.duration:
  explanation: >
    Time from the first record to the last, or to now while it runs.
  source: >
    started_at and ended_at of the session or subagent, else the first and
    last record timestamps.
  source_type: deduced
  unit: seconds
  update_freq: realtime
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.failures:
  explanation: >
    Failed tool calls of the agent.
  source: >
    COUNT of those rows with is_error set.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.input:
  explanation: >
    Input tokens without cache.
  source: >
    SUM(requests.input_tokens) of the agent.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.mem:
  explanation: >
    RAM of the agent's live processes.
  source: >
    Sum of mem_mb of the session's pids in the collector snapshot.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.model:
  explanation: >
    Models the agent called.
  source: >
    Distinct requests.model values of the agent.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.msgs:
  explanation: >
    User, assistant and tool messages of the agent.
  source: >
    _agent_row msgs: session_prompts (user), requests (assistant),
    tool_invocations (tool).
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.output:
  explanation: >
    Output tokens.
  source: >
    SUM(requests.output_tokens) of the agent.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.project:
  explanation: >
    Project folder of the agent.
  source: >
    sessions.project_path, else requests.project_path.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.status:
  explanation: >
    Run state of the agent: running, looping, waiting, idle, ended or
    stopped.
  source: >
    board.status for main agents and board.sub_status for subagents, from
    live processes, the newest request and its finish_reason.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.tool:
  explanation: >
    The AI tool the agent runs in.
  source: >
    sessions.tool, else requests.tool of the session.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.agent.tool_calls:
  explanation: >
    Tool calls of the agent.
  source: >
    COUNT of tool_invocations rows of the agent that are not permission
    records.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Agents
  section: Agents and subagents
  dynamic_source: false

board.role.row:
  explanation: >
    Runs, messages, tokens, cost and tool failure rate per kind of agent
    (main agents, then subagents by task).
  source: >
    compute_board by_role: agents grouped by agents.task, main agents first.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Agents
  section: Main agents and subagents
  dynamic_source: false

board.attention.item:
  explanation: >
    An agent that is looping, or waiting for you to confirm a tool call,
    with the detail, cost so far and since when.
  source: >
    board_api._attention: loops that are at the end of the session with
    status looping, and agents with status waiting and a pending
    confirmation.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Agents
  section: Needs you now
  dynamic_source: false

board.kpi.idle:
  explanation: >
    Sessions that are alive or recent but whose turn has ended and nothing
    runs.
  source: >
    compute_board kpis.idle: sessions in scope with status idle (turn ended,
    last activity within IDLE_AFTER_S or process alive).
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Agents
  section: Summary tiles
  dynamic_source: false

board.kpi.running:
  explanation: >
    Agents running now: sessions in view whose status is running, looping or
    waiting.
  source: >
    compute_board kpis.running: count of sessions in scope whose status is
    in ACTIVE_STATUSES. Status comes from live processes, the newest request
    and the finish reason.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Agents
  section: Summary tiles
  dynamic_source: false

board.kpi.subagents_running:
  explanation: >
    Subagents that are running, looping or waiting.
  source: >
    compute_board kpis.subagents_running: agents other than the main agent
    of each session in scope, with an active sub status.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Agents
  section: Summary tiles
  dynamic_source: false

board.model.row:
  explanation: >
    One row per model: agents, calls, tokens, input, output, cache read,
    cache write, cached share, cost and p95 reply time.
  source: >
    compute_board by_model: requests grouped by model; p95 is the 0.95
    percentile of duration_ms of that model. Cache write is null for tools
    that never report it.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Agents
  section: Usage by model
  dynamic_source: false


# ===============================================================
# USAGE AND COST
# ===============================================================

board.saved_usd:
  explanation: >
    What cache reads saved against the full input price.
  source: >
    compute_board saved_usd: cache-read tokens times the difference between
    input and cache-read list price of each model.
  source_type: deduced
  unit: usd
  update_freq: on-collect
  tab: Usage and cost
  section: Cache hit rate
  dynamic_source: false

board.series.cache_rate:
  explanation: >
    Cache read share of input per time bucket.
  source: >
    compute_board series.cached_share.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Usage and cost
  section: Cache hit rate
  dynamic_source: false

board.credits:
  explanation: >
    AI credits GitHub Copilot reports for the sessions in view. A credit is
    the tool's unit, not dollars.
  source: >
    board_api._credits_section: HistoryDB.query_session_usage daily
    billing_amount for sessions active in the window; days cut by a window
    edge count whole.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Cost
  dynamic_source: false

board.series.cost:
  explanation: >
    Cost per time bucket, split by tool, project or model.
  source: >
    compute_board series.cost.by_tool, by_project, by_model.
  source_type: aggregated
  unit: usd
  update_freq: on-collect
  tab: Usage and cost
  section: Cost
  dynamic_source: false

board.unpriced:
  explanation: >
    Tokens whose model has no known price, so they carry no cost.
  source: >
    board_api._unpriced_section: tokens of models for which no stored cost
    and no list price exists, with their share of all tokens.
  source_type: deduced
  unit: tokens
  update_freq: on-collect
  tab: Usage and cost
  section: Cost
  dynamic_source: false

board.series.messages:
  explanation: >
    User, assistant and tool messages per time bucket.
  source: >
    compute_board series.messages: session_prompts, requests and
    tool_invocations per bucket.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Messages
  dynamic_source: false

board.project.agents:
  explanation: >
    Agents in the project.
  source: >
    compute_board projects: Sessions and their subagents with this
    project_path.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.api_errors:
  explanation: >
    Failed model calls in the project.
  source: >
    compute_board projects: requests with is_error set.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.cached:
  explanation: >
    Cached share in the project.
  source: >
    compute_board projects: cache_read / all input tokens of the project.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.cost:
  explanation: >
    Cost in the project.
  source: >
    compute_board projects: SUM(cost_usd) or list price of requests in the
    project.
  source_type: aggregated
  unit: usd
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.lines:
  explanation: >
    Lines added and removed in the project.
  source: >
    compute_board projects: SUM of lines_added and lines_removed in
    file_write_events.detail.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.loops:
  explanation: >
    Loops in the project.
  source: >
    compute_board projects: Visible loops by project of the session.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.msgs:
  explanation: >
    Messages in the project.
  source: >
    compute_board projects: Model calls plus prompts plus tool calls of the
    project.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.p95:
  explanation: >
    95th percentile reply time in the project.
  source: >
    compute_board projects: requests.duration_ms > 0, grouped by project.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.prompts:
  explanation: >
    User prompts in the project.
  source: >
    compute_board projects: COUNT of session_prompts rows with agent_id
    empty.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.tests:
  explanation: >
    Test runs and passed test runs in the project.
  source: >
    compute_board projects: _tests_section: tool_invocations whose target
    looks like a test command.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.tokens:
  explanation: >
    Tokens in the project.
  source: >
    compute_board projects: SUM of token columns of requests with this
    project_path.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.tool_calls:
  explanation: >
    Tool calls in the project.
  source: >
    compute_board projects: tool_invocations of the project's sessions.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.project.tool_fail:
  explanation: >
    Share of tool calls that failed in the project.
  source: >
    compute_board projects: failures / tool calls of the project's sessions.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Usage and cost
  section: Projects
  dynamic_source: false

board.kpi.cached_share:
  explanation: >
    Share of input served from the prompt cache.
  source: >
    compute_board kpis.cached_share: cache_read / (input + cache_read +
    cache_write).
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Usage and cost
  section: Summary tiles
  dynamic_source: false

board.kpi.cost_usd:
  explanation: >
    Cost of the range at the stored cost per call, or at list price when the
    call has none. Not a bill.
  source: >
    compute_board kpis.cost_usd: requests.cost_usd where stored, else
    _list_cost from the model price table.
  source_type: aggregated
  unit: usd
  update_freq: on-collect
  tab: Usage and cost
  section: Summary tiles
  dynamic_source: false

board.kpi.messages:
  explanation: >
    User, assistant and tool messages in the range.
  source: >
    compute_board kpis.messages: model calls plus prompts plus tool calls,
    including the totals a tool reports without rows.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Summary tiles
  dynamic_source: false

board.kpi.prev:
  explanation: >
    The same totals over the window before this one, for the change shown
    under each tile.
  source: >
    board_api._previous: the filters re-applied to [since - span, since);
    null when that window holds no data.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Usage and cost
  section: Summary tiles
  dynamic_source: false

board.kpi.tokens:
  explanation: >
    Input, output, cache read and cache write tokens of all model calls in
    the range.
  source: >
    compute_board kpis.tokens: sum over the usage cube built from requests,
    plus sessions that only have a session_usage total.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Usage and cost
  section: Summary tiles
  dynamic_source: false

board.series.tokens:
  explanation: >
    Tokens per time bucket, split into cache read, input, cache write and
    output.
  source: >
    compute_board series.tokens: usage cube buckets of requests.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Usage and cost
  section: Tokens, cached and not cached
  dynamic_source: false


# ===============================================================
# PROMPTS AND SKILLS
# ===============================================================

board.project_prompt.row:
  explanation: >
    A prompt file (AGENTS.md style) in a project, its parent folders or the
    user folders, and how many prompts used it.
  source: >
    board_api._project_prompts: session_prompts.prompt_file grouped by file
    and project.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Prompts and skills
  section: Project prompts
  dynamic_source: false

board.prompt.row:
  explanation: >
    A user prompt with time, text, project and the tokens of its turn.
  source: >
    board_api._prompts_section: session_prompts rows with agent_id empty.
    Text is masked for secrets; tokens are the whole turn's tokens.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Prompts and skills
  section: Prompts
  dynamic_source: false

board.prompt.total:
  explanation: >
    Number of user prompts in the range.
  source: >
    compute_board prompts_total.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Prompts and skills
  section: Prompts
  dynamic_source: false

board.skill.row:
  explanation: >
    A skill with scope, agents that used it, uses and the tokens of the
    turns where it ran.
  source: >
    board_api._skills_section: skill_uses rows; turn tokens come from
    _turns.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Prompts and skills
  section: Skills used
  dynamic_source: false

board.workflow.row:
  explanation: >
    Workflow and prompt files of the tools with their type, size, tokens and
    last change.
  source: >
    board_api._context_workflows over the collector's file inventory: files
    whose path or kind marks a workflow or prompt.
  source_type: raw
  unit: count
  update_freq: on-discovery
  tab: Prompts and skills
  section: Workflows and prompt files
  dynamic_source: false


# ===============================================================
# CONTEXT
# ===============================================================

memory.entry.activity:
  explanation: >
    Activity status of a memory file — green (live active, recently
    changed), orange (modified within 5 minutes), grey (inactive).
  source: >
    Based on file mtime comparison: green if changed since last collection,
    orange if mtime within 300s, grey otherwise.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Context
  section: Agent memory
  dynamic_source: true

memory.entry.tokens:
  explanation: >
    Estimated token count for a single memory/context file.
  source: >
    ceil(len(content.encode('utf-8')) / 4). The content is read from disk on
    each collection cycle.
  source_type: deduced
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Agent memory
  otel_metric: aictl.memory.tokens
  dynamic_source: false

memory.growth_chart:
  explanation: >
    Time series chart showing growth of agent memory tokens over time.
    Tracks how much persistent context AI tools accumulate.
  source: >
    board_api._context_growth: mem_tokens and memory_entries of
    system_snapshots, at most 120 points over the last 7 days, each the last
    value of its time slot.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Agent memory
  dynamic_source: true

overview.total_memory_tokens:
  explanation: >
    Total estimated tokens across all agent memory/context files. These are
    persistent memory entries that AI tools load into their context window
    (e.g. Claude's CLAUDE.md, user memory files, Copilot instructions).
  source: >
    Memory files are discovered by scanning known paths (e.g.
    ~/.claude/memory/, ~/.claude/projects/*/memory/). Each file's content is
    token-estimated via ceil(utf8_bytes / 4). Summed across all entries.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Agent memory
  otel_metric: aictl.memory.tokens
  dynamic_source: false

board.context.never_sent_files:
  explanation: >
    Number of discovered files that the tool never sends to the model.
  source: >
    tools.compute_token_budget never_sent_count.
  source_type: aggregated
  unit: count
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

board.context.project_share:
  explanation: >
    Per project: always, on-demand and conditional tokens, and the estimate
    with the global files as a share of the window.
  source: >
    board_api._context_budget projects[]: (global_tokens + project tokens) /
    window.
  source_type: deduced
  unit: ratio
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

board.context.survives_compaction:
  explanation: >
    Tokens of the always-loaded files that stay after a compaction.
  source: >
    tools.compute_token_budget survives_compaction_tokens.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

board.context.window:
  explanation: >
    Model context window used for the share figures: the known size of the
    detected model, else 200 000 tokens (marked assumed).
  source: >
    board_api._context_budget: model_pricing.context_window_for(model), else
    DEFAULT_CONTEXT_WINDOW.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.context_window.always_loaded:
  explanation: >
    Tokens from files always loaded into the context window on every LLM
    call. This is the guaranteed baseline context consumption.
  source: >
    compute_token_budget() classifies files: sent_to_llm="yes" AND
    loaded_when="every-call". Sums token estimates for matching files.
    Includes global scope + largest sub-project.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.context_window.cacheable:
  explanation: >
    Tokens from files marked as cacheable — can be served from prompt cache,
    reducing cost and latency.
  source: >
    Files where cacheable="yes" in paths-*.csv. These files benefit from
    prompt caching when the AI provider supports it.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.context_window.conditional:
  explanation: >
    Tokens from files loaded conditionally based on project type or feature
    flags.
  source: >
    Files where sent_to_llm in ("conditional", "partial"). Summed token
    estimates.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.context_window.on_demand:
  explanation: >
    Tokens from files loaded on-demand. Not always in context but available
    when referenced.
  source: >
    Files where sent_to_llm="on-demand" OR loaded_when="on-demand". Summed
    token estimates.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.context_window.percentage:
  explanation: >
    Current context window usage as percentage of detected model's maximum
    context length. Color-coded: green <50%, yellow <80%, orange >=80%.
  source: >
    (always_loaded_tokens / model_max_context) * 100. Model max context
    detected from tool telemetry model field. For max potential: sums all
    projects (not just largest).
  source_type: deduced
  unit: percent
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

budget.model_detected:
  explanation: >
    The AI model detected for context window size estimation. Used to
    calculate what percentage of the model's context window is consumed.
  source: >
    From tool telemetry model field or tool config model setting. Determines
    max context length for percentage calculation.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Context window budget
  dynamic_source: true

budget.project_estimate:
  explanation: >
    Estimated context window usage for the largest sub-project, plus global
    tokens. Shows realistic total when multiple projects exist.
  source: >
    compute_token_budget() groups files by project root, finds the largest
    sub-project by token sum, adds global (non-project) tokens. Fields:
    largest_project name, largest_project_tokens, global_tokens.
  source_type: deduced
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window budget
  dynamic_source: false

board.context.map_item:
  explanation: >
    Largest files by name per project and kind, with the rest folded into
    (other).
  source: >
    board_api._context_map items: top CONTEXT_MAP_ITEMS file names per
    (project, kind).
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

overview.context_map.by_project:
  explanation: >
    Token distribution broken down by project. Shows how context budget is
    split across different working directories/repositories.
  source: >
    Files grouped by resolved project root (git root or parent directory).
    Each project's tokens = sum of file estimates within that project scope.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

overview.context_map.conditional:
  explanation: >
    Tokens from files loaded conditionally (e.g. only in certain project
    types or when specific features are enabled).
  source: >
    Files where sent_to_llm in ("conditional", "partial") in paths-*.csv.
    Token count estimated per file, summed.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

overview.context_map.not_sent:
  explanation: >
    Tokens from files that exist on disk but are never sent to the LLM.
    Configuration, state, and metadata files that the tool uses internally.
  source: >
    Files where sent_to_llm="no" in paths-*.csv. Token count estimated per
    file, summed.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

overview.context_map.on_demand:
  explanation: >
    Tokens from files loaded on-demand (only when referenced or needed).
    These don't consume context by default but contribute when activated.
  source: >
    Files where sent_to_llm="on-demand" OR loaded_when="on-demand" in
    paths-*.csv. Token count estimated per file, summed.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

overview.context_map.sent_to_llm:
  explanation: >
    Tokens from files that are always sent to the LLM on every call. These
    consume context window capacity on every interaction and represent the
    baseline context load.
  source: >
    Files where sent_to_llm="yes" AND loaded_when="every-call" in
    paths-*.csv. Token count estimated per file, summed.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Context window map
  dynamic_source: false

board.context.daily_row:
  explanation: >
    Calls, input, output, cache read, cache write, total tokens and cost per
    local day and model, for the last 7 days.
  source: >
    board_api._context_daily over requests, grouped by local date and model.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Daily usage by model
  dynamic_source: false

budget.daily_tokens:
  explanation: >
    Calls, tokens and cost per local day and model for the last 7 days, as a
    stacked chart and a table.
  source: >
    board_api._context_daily over the requests table, grouped by local date
    and model. Cost is the stored cost, else the list price.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Daily usage by model
  dynamic_source: false

api.file_content:
  explanation: >
    File content for the preview of a context file in the board. Returns raw
    text of tracked files.
  source: >
    GET /api/file: direct file read, limited to 200 KB. The path must be in
    the allowed set (discovered tool files).
  source_type: raw
  unit: bytes
  update_freq: on-collect
  tab: Context
  section: Files each tool reads
  dynamic_source: false

board.context.file:
  explanation: >
    Each context file with tool, kind, scope, size, tokens, whether it is
    sent to the model, when it loads and whether it changed in the last 5
    minutes.
  source: >
    board_api._context_file over the collector's discovered files. Tokens
    are ceil(bytes / 4).
  source_type: raw
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Files each tool reads
  dynamic_source: false

files.item.activity:
  explanation: >
    File activity indicator — green pulse (actively changing), orange
    (recently modified), grey (inactive).
  source: >
    Based on file mtime: green if changed since last collection cycle,
    orange if mtime within 300s, grey otherwise. Pulsing animation for live-
    active files.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Context
  section: Files each tool reads
  dynamic_source: true

files.item.sent_to_llm:
  explanation: >
    Whether this file is sent to the LLM and under what conditions. Diamond
    = always, diamond-outline = on-demand, circle = conditional/no.
  source: >
    sent_to_llm field from paths-*.csv for this file's path pattern. Values:
    "yes", "on-demand", "conditional", "partial", "no".
  source_type: raw
  unit: count
  update_freq: static
  tab: Context
  section: Files each tool reads
  dynamic_source: false

files.item.size:
  explanation: >
    File size in bytes from the filesystem.
  source: >
    os.stat(path).st_size.
  source_type: raw
  unit: bytes
  update_freq: on-collect
  tab: Context
  section: Files each tool reads
  otel_metric: aictl.file.bytes
  dynamic_source: false

files.item.tokens:
  explanation: >
    Estimated token count for a single file.
  source: >
    ceil(len(content.encode('utf-8')) / 4).
  source_type: deduced
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Files each tool reads
  otel_metric: aictl.file.tokens
  dynamic_source: false

overview.files:
  explanation: >
    Total number of configuration, instruction, and context files discovered
    across all monitored AI tools on disk. Counts files matching known path
    patterns from paths-unix.csv (or paths-windows.csv on Windows).
  source: >
    File discovery expands path templates from paths-*.csv using tool-
    specific root strategies (home dir, XDG config, project root). Each
    expanded path is checked for existence via os.stat(). The count is
    sum(len(tool.files)) across all tools, excluding aictl's own files.
  source_type: aggregated
  unit: count
  update_freq: on-discovery
  tab: Context
  section: Files each tool reads
  otel_metric: aictl.discovery.files
  dynamic_source: false

overview.tokens:
  explanation: >
    Total estimated tokens across all discovered AI tool files. Represents
    the cumulative context footprint — how many tokens the LLM ecosystem
    consumes on disk for instructions, memory, rules, and configuration.
  source: >
    Each file's token count is estimated as ceil(utf8_byte_length / 4),
    approximating BPE tokenization. Summed across all files for all tools.
    Formula: sum(ceil(len(content.encode('utf-8')) / 4)) for each file.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Files each tool reads
  otel_metric: aictl.discovery.tokens
  dynamic_source: false

board.context.lifetime_as_of:
  explanation: >
    When a cached lifetime source was last computed, and the cost quality
    (reported, estimated or unknown).
  source: >
    board_api._context_telemetry as_of and cost_quality. A cost of 0 with no
    price source shows as unknown, not free.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: false

board.context.lifetime_by_model:
  explanation: >
    Per-model tokens, requests and cost inside a tool's own lifetime totals.
  source: >
    board_api._context_telemetry by_model, from the tool's own statistics
    file.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: false

board.context.lifetime_errors:
  explanation: >
    The newest 20 errors a tool logged, with type, message and model.
  source: >
    board_api._context_telemetry errors, newest first.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: false

procs.tool.telemetry.api_duration_ms:
  explanation: >
    Total API duration in milliseconds across all sessions. Used to detect
    timeout patterns (avg > 30s flags potential issue).
  source: >
    Accumulated from session.shutdown events in Copilot CLI events.jsonl.
    Field: totalApiDurationMs. If avg per request > 30000ms, flagged as
    timeout error.
  source_type: aggregated
  unit: seconds
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: true

procs.tool.telemetry.cache_read:
  explanation: >
    Lifetime cache-read tokens — tokens retrieved from prompt cache instead
    of re-processing. Reduces cost and latency.
  source: >
    From tool stats: costTracker.totalCacheReadTokens (Claude Code),
    modelMetrics.*.usage.cacheReadTokens (Copilot), etc.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: true

procs.tool.telemetry.cache_write:
  explanation: >
    Lifetime cache-creation tokens — tokens written to prompt cache for
    future reuse. Initial investment for cache read savings.
  source: >
    From tool stats: costTracker.totalCacheCreationTokens (Claude Code),
    cacheWriteTokens (Copilot), cached_input_tokens (Codex), etc.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: true

procs.tool.telemetry.cost_usd:
  explanation: >
    Estimated total cost in USD across all sessions for this tool. Based on
    the tool's own cost tracking, not recalculated by aictl.
  source: >
    From tool stats: costTracker.totalCostUSD (Claude Code),
    modelMetrics.*.requests.cost (Copilot), usage.cost_usd (Codex). Passed
    through from tool's native calculation.
  source_type: raw
  unit: usd
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  otel_metric: aictl.telemetry.cost
  dynamic_source: true

procs.tool.telemetry.errors:
  explanation: >
    Errors encountered while collecting telemetry for this tool. Includes
    parse errors, missing files, permission issues, and API timeouts.
  source: >
    Accumulated during telemetry parsing. Each parser catches exceptions and
    records error type + message. Copilot-specific: timeout detection if avg
    API latency > 30s/request.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: true

procs.tool.telemetry.input_tokens:
  explanation: >
    Lifetime input tokens consumed by this tool — total tokens sent to the
    LLM across all sessions. Verified from the tool's native stats.
  source: >
    Tool-specific parser reads the tool's stats/telemetry file: - Claude
    Code: ~/.claude/stats-cache.json → costTracker.totalInputTokens -
    Copilot CLI: events.jsonl → session.shutdown →
    modelMetrics.*.usage.inputTokens - Codex CLI: session.json →
    usage.input_tokens - Cursor: state.vscdb SQLite → keys matching %token%
    - Continue: sessions/*.json → usage.promptTokens
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  otel_metric: gen_ai.client.token.usage.verified
  dynamic_source: true

procs.tool.telemetry.messages:
  explanation: >
    Total number of messages (user+assistant turns) across all sessions.
  source: >
    From tool stats: costTracker.totalMessages (Claude Code). Not all tools
    expose message counts.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  otel_metric: aictl.telemetry.messages
  dynamic_source: true

procs.tool.telemetry.output_tokens:
  explanation: >
    Lifetime output tokens generated by this tool — total tokens received
    from the LLM across all sessions.
  source: >
    Same tool-specific parsers as input_tokens, reading the output
    counterpart field from each tool's native stats format.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  otel_metric: gen_ai.client.token.usage.verified
  dynamic_source: true

procs.tool.telemetry.premium_requests:
  explanation: >
    Number of premium API requests used (Copilot CLI). Tracks quota
    consumption for rate-limited plans.
  source: >
    Accumulated from session.shutdown events in Copilot CLI events.jsonl.
    Field: totalPremiumRequests. Summed across all shutdown events.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  dynamic_source: true

procs.tool.telemetry.sessions:
  explanation: >
    Total number of sessions recorded by this tool's telemetry.
  source: >
    From tool stats: costTracker.totalSessions (Claude Code), count of
    session.shutdown events (Copilot), count of session files (Codex).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Context
  section: Lifetime totals each tool reports
  otel_metric: aictl.telemetry.sessions
  dynamic_source: true

budget.token_by_category:
  explanation: >
    Tokens per tool and file kind (instructions, rules, memory, skills and
    so on), with the part sent to the model and the part never sent.
  source: >
    board_api._context_categories: the tool's discovered files grouped by
    kind; the sent part follows the budget bucket of each file.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Tokens by category
  dynamic_source: false

budget.token_by_tool:
  explanation: >
    Tokens of each tool's context files in total, sent to the model and
    never sent.
  source: >
    board_api._context_categories tokens, sent and never_sent per tool.
  source_type: aggregated
  unit: tokens
  update_freq: on-collect
  tab: Context
  section: Tokens by category
  dynamic_source: true

files.category.count:
  explanation: >
    Number of files in a specific category (instructions, config, rules,
    memory, state, etc.) for a tool.
  source: >
    Files grouped by category field from paths-*.csv. Count per category per
    tool.
  source_type: aggregated
  unit: count
  update_freq: on-discovery
  tab: Context
  section: Tokens by category
  dynamic_source: false

files.category.tokens:
  explanation: >
    Total tokens for all files in a category for a tool.
  source: >
    Sum of per-file token estimates within the category.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Tokens by category
  dynamic_source: false

overview.context_map.by_category:
  explanation: >
    Token distribution broken down by file category (instructions, config,
    rules, memory, state, etc.). Shows which category of files contributes
    most to context window usage.
  source: >
    Files grouped by their 'category' field from paths-*.csv. Token count
    per category = sum of per-file estimates within the category.
  source_type: aggregated
  unit: tokens
  update_freq: on-discovery
  tab: Context
  section: Tokens by category
  dynamic_source: false


# ===============================================================
# TOOLS, FAILURES AND SPEED
# ===============================================================

board.error.row:
  explanation: >
    A failure with tool, message, kind (tool or API), count, agents and last
    time. Numbers in messages are folded to #.
  source: >
    board_api._errors_section: tool_invocations with is_error
    (result_summary) and requests with error_type or http_status.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Failures and errors
  dynamic_source: false

board.latency.reply:
  explanation: >
    Model reply time: count, p50, p95, p99 and max.
  source: >
    board_api._latency over requests.duration_ms > 0.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Latency and durations
  dynamic_source: false

board.latency.run:
  explanation: >
    Agent run: time from start to end of each agent.
  source: >
    compute_board latency_rows: ended_at - started_at of agent rows.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Latency and durations
  dynamic_source: false

board.latency.tool:
  explanation: >
    Tool call duration: count, p50, p95, p99 and max.
  source: >
    board_api._tools_section durations of tool_invocations.duration_ms > 0.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Latency and durations
  dynamic_source: false

board.latency.ttft:
  explanation: >
    Time to first token. Shown as not reported for tools that never send it.
  source: >
    board_api._latency over requests.ttft_ms > 0.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Latency and durations
  dynamic_source: false

board.latency.turn:
  explanation: >
    Whole turn: time from a prompt to the last reply or tool result before
    the next prompt.
  source: >
    board_api._turns: session_prompts timestamps joined to requests end
    times.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Latency and durations
  dynamic_source: false

board.loop.row:
  explanation: >
    A loop: agent, status, the repeated pattern, repeats, tokens and cost
    spent in it, and since when.
  source: >
    board_api.find_loops over tool_invocations of each session; tokens and
    cost are summed from requests in the loop's time range.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Loops
  dynamic_source: false

board.kpi.fail_rate:
  explanation: >
    Failed tool calls as a share of all tool calls.
  source: >
    compute_board kpis.fail_rate: failures / tool_calls.
  source_type: deduced
  unit: ratio
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Summary tiles
  dynamic_source: false

board.kpi.failures:
  explanation: >
    Failed tool calls in the range. API errors are in the Failures panel.
  source: >
    compute_board kpis.failures: tool_invocations with is_error set. Null
    when no tool in view reports tool calls.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Summary tiles
  dynamic_source: false

board.kpi.loops:
  explanation: >
    Agents repeating the same failing work.
  source: >
    compute_board kpis.loops: count of visible loops found by find_loops
    over the tool calls of each session.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Summary tiles
  dynamic_source: false

board.kpi.p95_ms:
  explanation: >
    95th percentile of model reply time (p50 shown with it).
  source: >
    compute_board kpis.p95_ms and p50_ms: percentiles of
    requests.duration_ms > 0.
  source_type: deduced
  unit: seconds
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Summary tiles
  dynamic_source: false

board.kpi.tool_calls:
  explanation: >
    Tool calls in the range, including totals that a tool reports without
    rows.
  source: >
    compute_board kpis.tool_calls: tool_invocations rows that are not
    permission records, plus the fallback totals of session_usage.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Summary tiles
  dynamic_source: false

board.tool.row:
  explanation: >
    Per tool name: calls, failed, failure rate, p50, p95 and max duration,
    and a trend.
  source: >
    board_api._tools_section over tool_invocations; durations only from rows
    with duration_ms > 0.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Tool calls
  dynamic_source: false

board.confirm.row:
  explanation: >
    Per tool: calls run automatically, approved, denied, blocked by a rule,
    and the median wait for an answer.
  source: >
    board_api._confirms_section over tool_invocations.confirm and
    confirm_wait_ms.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Tools, failures and speed
  section: Tool confirmations
  dynamic_source: false


# ===============================================================
# CHANGES AND TESTING
# ===============================================================

board.change.file:
  explanation: >
    Per file: lines added and removed, edits, agents and last edit.
  source: >
    board_api._changes_section over file_write_events.detail lines_added and
    lines_removed.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Changes and testing
  section: Changes
  dynamic_source: false

board.memfile.row:
  explanation: >
    A memory or instruction file with the tool that reads it, scope, tokens
    per call, lines changed in the range, who changed it and when.
  source: >
    board_api._memory_files: files with category memory or instruction,
    joined to file_write_events.
  source_type: raw
  unit: tokens
  update_freq: on-collect
  tab: Changes and testing
  section: Memory and instruction files
  dynamic_source: false

board.test.piped:
  explanation: >
    Passing test runs whose output is piped to a filter, which can hide a
    failure.
  source: >
    compute_board tests_piped: passing runs whose target matches
    _PIPED_TO_FILTER_RE without pipefail.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Changes and testing
  section: Testing
  dynamic_source: false

board.test.row:
  explanation: >
    Per test command: runs, failed, median duration, state now (passing,
    failing, flaky) and last run. A test is a tool call whose target
    contains test, jest or tox.
  source: >
    board_api._tests_section over tool_invocations; failure is is_error or a
    non-zero exit_code.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Changes and testing
  section: Testing
  dynamic_source: false


# ===============================================================
# MACHINE
# ===============================================================

board.machine.cores:
  explanation: >
    Number of CPU cores, to read the per-core bars.
  source: >
    compute_machine cpu_cores from the collector snapshot.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Machine
  section: CPU
  dynamic_source: false

events.tool.cpu_chart:
  explanation: >
    Time series of CPU utilization for a specific tool over the selected
    time range.
  source: >
    Historical tool_metrics.cpu values from DB, queried for the selected
    tool and time range.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Machine
  section: CPU
  dynamic_source: false

overview.cpu:
  explanation: >
    Total CPU utilization across all monitored AI tool processes, expressed
    as a percentage where 100% = one full CPU core. A value of 400% means
    four cores are fully utilized by AI tools.
  source: >
    psutil.Process.cpu_percent() is called for each monitored process on
    every collection cycle (default 1.0s interval). Values are summed across
    all processes belonging to AI tools. Live correlator data is preferred;
    falls back to per-process discovery data if unavailable.
  source_type: aggregated
  unit: percent
  update_freq: realtime
  tab: Machine
  section: CPU
  otel_metric: process.cpu.utilization
  dynamic_source: false

overview.cpu_per_core:
  explanation: >
    Per-core CPU utilization for every logical CPU core on the system.
    Displayed as color-coded bars (red >80%, orange >50%, green >20%). Shows
    overall system load, not just AI tool processes.
  source: >
    psutil.cpu_percent(interval=0.1, percpu=True) returns a list of
    percentages, one per logical core. Called on every snapshot render.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Machine
  section: CPU
  otel_metric: system.cpu.utilization
  dynamic_source: false

alerts.headless_browser:
  explanation: >
    Count of headless browser processes (Chrome, Chromium, Firefox) spawned
    by AI tools. These are resource-heavy and may indicate tool-use loops or
    web scraping.
  source: >
    Process matching against browser process name patterns in the process
    tree of AI tool sessions.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Machine
  section: Needs a look
  dynamic_source: true

alerts.orphan_mcp:
  explanation: >
    Count of MCP server processes whose parent process has died. These
    orphans consume resources but are no longer useful.
  source: >
    MCP server processes where the expected parent AI tool process is no
    longer running (ppid check fails or parent PID not in active session
    PIDs).
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Machine
  section: Needs a look
  dynamic_source: true

alerts.process_anomalies:
  explanation: >
    Total count of process-level anomalies across all AI tools. Aggregates
    memory leaks, CPU spikes, zombie processes, and other unusual behavior.
  source: >
    Sum of anomaly counts from all tool process inspections. Each anomaly
    type has its own detection rule (see procs.tool.anomaly).
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Needs a look
  dynamic_source: true

alerts.subagent_memory:
  explanation: >
    Alert triggered when total memory consumption by AI tool subagent
    processes exceeds 2GB. Indicates potential memory leak or runaway agent.
  source: >
    Sum of psutil.Process.memory_info().rss for all processes classified as
    subagents or child processes. Threshold: 2 * 1024^3 bytes.
  source_type: deduced
  unit: bytes
  update_freq: realtime
  tab: Machine
  section: Needs a look
  dynamic_source: true

board.machine.traffic.file_events:
  explanation: >
    File events the monitor saw for the tool.
  source: >
    board_api._monitor_section per_tool.file_events from live.file_events.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: false

board.machine.traffic.token_confidence:
  explanation: >
    How sure the token estimate is, and from which source.
  source: >
    per_tool.est_confidence and est_source from live.token_estimate.
  source_type: raw
  unit: ratio
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: false

board.machine.traffic.workspace:
  explanation: >
    Size of the tool's workspace folders.
  source: >
    board_api._monitor_section per_tool.workspace_bytes from
    live.workspace_size_mb.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: false

events.tool.live.inbound_rate_bps:
  explanation: >
    Inbound network rate of a tool, in bytes per second, from the In column
    of the Network, tokens and files panel.
  source: >
    Live monitor _recent_rate() over the recent_network deque;
    board_api._monitor_section per_tool.inbound_bps.
  source_type: deduced
  unit: rate_bps
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: true

events.tool.live.outbound_rate_bps:
  explanation: >
    Outbound network rate of a tool, in bytes per second, from the Out
    column of the Network, tokens and files panel.
  source: >
    Live monitor _recent_rate() over the recent_network deque;
    board_api._monitor_section per_tool.outbound_bps.
  source_type: deduced
  unit: rate_bps
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: true

procs.tool.live.cpu:
  explanation: >
    Current CPU utilization and peak CPU seen during this tool's active
    sessions.
  source: >
    Sum of cpu_percent across sessions (current). Max of peak_cpu_percent
    across sessions (peak). From SessionCorrelator aggregation.
  source_type: aggregated
  unit: percent
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  otel_metric: aictl.tool.cpu
  dynamic_source: true

procs.tool.live.files_touched:
  explanation: >
    Number of unique files touched (created/modified/deleted) during this
    tool's active sessions.
  source: >
    Set union of files_touched across all sessions for this tool. File
    events detected by filesystem watching or state dir scanning.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: true

procs.tool.live.mcp_detected:
  explanation: >
    Whether MCP (Model Context Protocol) loop activity is detected for this
    tool, and estimated number of tool-use loops.
  source: >
    Heuristic MCP loop detection analyzing 24-sample windows: - Network
    bursts >32KB → min(0.45, count * 0.15) - CPU spikes >20% → min(0.30,
    count * 0.10) - Subprocess invocations (git, rg, bash) → min(0.35, count
    * 0.08) - Correlation bonus +0.15 if CPU AND network active Detected if
    combined score >= 0.45. Loop count estimate = max(0, network_peaks //
    2).
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  otel_metric: aictl.tool.mcp.score
  dynamic_source: true

procs.tool.live.pid_count:
  explanation: >
    Number of OS process IDs attributed to this tool's active sessions.
  source: >
    Union of all pids across SessionState objects for this tool.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  otel_metric: aictl.tool.pids
  dynamic_source: true

procs.tool.live.session_count:
  explanation: >
    Number of active sessions for this specific tool.
  source: >
    Count of SessionState objects for this tool where last_seen is within
    180s. From SessionCorrelator tool aggregation.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  otel_metric: aictl.tool.sessions
  dynamic_source: true

procs.tool.live.tokens:
  explanation: >
    Estimated tokens for this tool's active sessions, with confidence level
    indicating estimation method used.
  source: >
    Tiered estimation: exact telemetry (0.95) > session file inference
    (0.60) > network inference (0.40). Source and confidence displayed
    alongside the value.
  source_type: deduced
  unit: tokens
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  otel_metric: aictl.tool.token.usage
  dynamic_source: true

procs.tool.live.workspaces:
  explanation: >
    Working directories (project roots) associated with this tool's active
    sessions.
  source: >
    Set union of session.workspaces, derived from the cwd of root processes.
    Resolved to git repository roots when possible.
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Machine
  section: Network, tokens and files
  dynamic_source: true

board.machine.cleanup:
  explanation: >
    The command that ends a process, offered as a copy action.
  source: >
    board_api._cleanup_of builds a kill command for the pids of an alert or
    row.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Machine
  section: Processes
  dynamic_source: false

board.machine.process_name:
  explanation: >
    Process name, PID, owning tool and the agent it belongs to.
  source: >
    board_api.machine_processes over snapshot.tools[].processes and live-
    monitor pids.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Machine
  section: Processes
  dynamic_source: false

board.machine.process_parent:
  explanation: >
    The process that started this one.
  source: >
    process record ppid.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Machine
  section: Processes
  dynamic_source: false

overview.total_processes:
  explanation: >
    Number of running OS processes attributed to AI tools. Includes IDE
    extensions, language servers, daemon processes, and CLI instances. Uses
    the higher of discovery count vs live PID count per tool.
  source: >
    Process discovery uses psutil.process_iter() and matches each process
    against ps_grep_pattern regexes from processes-*.csv. The count per tool
    is max(len(discovered_processes), live_pid_count_from_correlator).
    Summed across all tools.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Machine
  section: Processes
  otel_metric: aictl.discovery.processes
  dynamic_source: false

procs.tool.anomaly:
  explanation: >
    Process anomaly detection — unusual resource consumption, unexpected
    state, or known problematic patterns.
  source: >
    Anomaly rules applied per process: memory exceeding known thresholds
    (memory_active_mb from CSV), CPU spikes, known leak patterns (known_leak
    + leak_pattern from CSV), orphan detection.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Machine
  section: Processes
  dynamic_source: true

procs.tool.cpu_pct:
  explanation: >
    CPU utilization for a single process, as percentage of one core. Color-
    coded: orange >5%, red if anomaly detected.
  source: >
    psutil.Process.cpu_percent(None) / 100 for the specific PID. Updated on
    each collection cycle.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Machine
  section: Processes
  otel_metric: process.cpu.utilization
  dynamic_source: false

procs.tool.mem_rss:
  explanation: >
    Resident memory (RSS) of a single process, in the RAM column of the
    Processes panel.
  source: >
    psutil.Process.memory_info().rss in bytes, carried as mem_mb in the
    snapshot.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Machine
  section: Processes
  otel_metric: process.memory.usage
  dynamic_source: false

procs.tool.process_type:
  explanation: >
    Classification of each process — app, helper, mcp-server, cli, subagent,
    language-server, daemon, etc.
  source: >
    Direct read from processes-*.csv process_type column, matched to the
    running process via ps_grep_pattern regex.
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Machine
  section: Processes
  dynamic_source: false

procs.tool.zombie_risk:
  explanation: >
    Risk level that this process may become a zombie (orphaned, not properly
    cleaned up). Based on known patterns from processes-*.csv.
  source: >
    Static classification from processes-*.csv zombie_risk column (none,
    low, medium, high). Based on historical analysis of each process type's
    lifecycle behavior.
  source_type: raw
  unit: count
  update_freq: static
  tab: Machine
  section: Processes
  dynamic_source: false

events.tool.memory_chart:
  explanation: >
    Time series of memory usage for a specific tool over the selected time
    range.
  source: >
    Historical tool_metrics.mem_mb values from DB, queried for the selected
    tool and time range.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Machine
  section: RAM
  dynamic_source: false

overview.mem_mb:
  explanation: >
    Total resident memory (RSS) consumed by all monitored AI tool processes,
    in megabytes. Shows physical RAM footprint of the AI tool ecosystem.
  source: >
    psutil.Process.memory_info().rss is read for each monitored process.
    Values are summed across all AI tool processes and converted to MB
    (bytes / 1048576).
  source_type: aggregated
  unit: bytes
  update_freq: realtime
  tab: Machine
  section: RAM
  otel_metric: process.memory.usage
  dynamic_source: false


