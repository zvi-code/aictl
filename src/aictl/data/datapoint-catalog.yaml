  unit: count
  update_freq: on-collect
  tab: Agent drawer
  section: Team
  dynamic_source: false

board.drawer.timeline.row:
  explanation: >
    Model calls and tool calls on one time line: time, input and output,
    cache, duration, prompt, error, agent, target, result.
