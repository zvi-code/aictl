# ===============================================================
# WHERE THE DATA COMES FROM
# ===============================================================

live.diagnostics.collector_name:
  explanation: >
    Name of each data collector in the monitoring pipeline (e.g. process,
    network, discovery, filesystem, telemetry).
  source: >
    Keys from SessionCorrelator.diagnostics() dict. Each collector reports
    its status via on_collector_status(source, status, mode).
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: Collectors
  dynamic_source: true

live.diagnostics.mode:
  explanation: >
    Operating mode of each collector (e.g. polling, watching, passive).
  source: >
    Direct assignment from the mode parameter in
    SessionCorrelator.on_collector_status().
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: Collectors
  dynamic_source: true

live.diagnostics.status:
  explanation: >
    Current status of each collector — active, degraded, disabled, or
    unknown.
  source: >
    Direct assignment from the status parameter in
    SessionCorrelator.on_collector_status(). Updated on each collector
    cycle.
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: Collectors
  dynamic_source: true

live.monitor_roots:
  explanation: >
    Workspace and state directory paths being monitored by the live
    collector.
  source: >
    Workspace roots from active session working directories. State paths
    from tool-specific state directory functions (e.g. claude_global_dir(),
    copilot_state_dir()).
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: Collectors
  dynamic_source: true

board.source.errors:
  explanation: >
    API errors a tool logged, from its telemetry record.
  source: >
    board_api._freshness errors = len(telemetry.errors).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Where the data comes from
  section: Data sources
  dynamic_source: false

board.source.row:
  explanation: >
    Per tool: where its data comes from (requests, session usage), the
    newest record, freshness of the live monitor and API errors.
  source: >
    board_api._sources over _source_rows: MAX(ts) of requests and
    MAX(last_activity_at) of session_usage per tool and source; freshness
    from _freshness.
  source_type: aggregated
  unit: count
  update_freq: on-collect
  tab: Where the data comes from
  section: Data sources
  dynamic_source: false

procs.tool.telemetry.confidence:
  explanation: >
    Confidence score (0-100%) for the telemetry data accuracy. Higher
    confidence means the data comes from a more reliable source.
  source: >
    Set by each parser: - 0.95 (95%): Direct tool stats (Claude stats-cache,
    OTel spans) - 0.90 (90%): Copilot events.jsonl shutdown events - 0.85
    (85%): Codex session.json - 0.75 (75%): Continue session files - 0.70
    (70%): Cursor SQLite state - 0.60 (60%): Session file inference - 0.40
    (40%): Network traffic inference
  source_type: raw
  unit: ratio
  update_freq: on-collect
  tab: Where the data comes from
  section: Data sources
  otel_metric: gen_ai.client.confidence
  dynamic_source: false

board.ingester.row:
  explanation: >
    An ingester: status (ok, off, no source, waiting or failing), last OK,
    last read, rows on the last read and in all.
  source: >
    board_api._ingester_rows from ingester_runner.collect_status and
    data_quality.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: Ingesters and data quality
  dynamic_source: false

board.quality.row:
  explanation: >
    A data-quality event: time, severity, component, status, message and how
    often it was seen.
  source: >
    board_api._quality_rows over db.query_data_quality (last 50).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Where the data comes from
  section: Ingesters and data quality
  dynamic_source: false

board.coverage.row:
  explanation: >
    Per data kind and tool: exact, partial, estimate, needs hooks or not
    reported.
  source: >
    board_api.coverage_rows: what the store holds per tool (_store_facts)
    against the static expectations of each tool.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Where the data comes from
  section: What each tool reports
  dynamic_source: false

board.self.children:
  explanation: >
    CPU and RAM of aictl's helper processes next to the daemon.
  source: >
    board_api._self_usage children.
  source_type: raw
  unit: percent
  update_freq: on-collect
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: false

board.self.history:
  explanation: >
    History store size live and on disk, the limit, the bytes that
    compaction can free, and the retention days.
  source: >
    board_api._self_section: db.storage_status() and db._retention_days.
  source_type: raw
  unit: bytes
  update_freq: on-collect
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: false

board.self.sink:
  explanation: >
    Samples emitted, written, dropped and buffered by the sample sink, and
    whether flood protection is on.
  source: >
    board_api._sink_section from sink.stats().
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: false

board.self.stream:
  explanation: >
    Browser windows on the live stream, and the age of the newest snapshot.
  source: >
    compute_machine pipeline.stream: connected clients and now -
    snapshot.timestamp.
  source_type: raw
  unit: seconds
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: false

otel.receiver.active:
  explanation: >
    Whether the OTel receiver has received data in the last 300 s. The aictl
    itself panel shows Active, or No data for 5 min, under Metrics in.
  source: >
    Derived: time.time() - OtelStats.last_receive_at < 300.
  source_type: deduced
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.api_calls_total:
  explanation: >
    Total API calls detected across all OTLP sources (metrics, logs,
    traces). Includes both log-based and span-based API call detection.
  source: >
    OtelStats.api_calls_total counter. Incremented when event name matches
    API_REQUEST_EVENTS set or span name matches API patterns.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.api_errors_total:
  explanation: >
    Total API errors detected across all OTLP sources. Includes log-based
    errors and span status code 2 (ERROR).
  source: >
    OtelStats.api_errors_total counter. Incremented when event name matches
    API_ERROR_EVENTS set or span has error status.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.events_received:
  explanation: >
    Total count of event/log records received across all /v1/logs and
    /v1/traces POST requests since server startup.
  source: >
    OtelStats.events_received counter. Incremented by len(events) after each
    parse_logs() or parse_traces() call.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.last_receive:
  explanation: >
    Timestamp of the last successfully parsed OTLP payload from any
    endpoint. Used to determine receiver freshness.
  source: >
    OtelStats.last_receive_at set to time.time() after any successful parse.
    Active if within 300s. Displayed as relative time.
  source_type: raw
  unit: seconds
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.metrics_received:
  explanation: >
    Total count of metric data points received across all /v1/metrics and
    /v1/traces POST requests since server startup.
  source: >
    OtelStats.metrics_received counter. Incremented by len(samples) after
    each parse_metrics() or parse_traces() call.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

otel.receiver.parse_errors:
  explanation: >
    Number of errors encountered while parsing incoming OTLP payloads across
    all three endpoints (metrics, logs, traces).
  source: >
    OtelStats.errors counter. Incremented on JSON parse failures, schema
    validation errors, or unhandled exceptions in any receiver handler.
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.cpu_percent:
  explanation: >
    CPU use of the aictl service process itself. This is not an AI tool
    metric: it is the cost of the monitoring.
  source: >
    board_api._self_usage: psutil cpu_percent of the aictl process plus its
    helper processes. Also served by /api/self-status.
  source_type: raw
  unit: percent
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.db_rows:
  explanation: >
    Total number of rows across the main data tables in the aictl database
    (metrics + tool_metrics + events + samples).
  source: >
    SUM of SELECT COUNT(*) from metrics, tool_metrics, events, samples
    tables.
  source_type: aggregated
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.db_size:
  explanation: >
    On-disk size of the aictl SQLite history database (history.db). Grows as
    metrics, events, and telemetry are collected over time. Compacted
    automatically (24h full res, 7d 1-min avg, 30d 5-min avg).
  source: >
    os.stat(db_path).st_size for the history.db file. Default location:
    ~/.config/aictl/history.db.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.memory_rss:
  explanation: >
    Resident memory (RSS) consumed by the aictl monitoring service. This is
    the physical RAM footprint of aictl itself, not the monitored AI tools.
  source: >
    psutil.Process(os.getpid()).memory_info().rss in bytes.
  source_type: raw
  unit: bytes
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.threads:
  explanation: >
    Number of threads in the aictl monitoring service. Includes DB flush
    thread, refresh loop, SSE connections, collectors.
  source: >
    psutil.Process(os.getpid()).num_threads().
  source_type: raw
  unit: count
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true

self.uptime:
  explanation: >
    How long the aictl monitoring service has been running since the last
    start of 'aictl daemon serve'.
  source: >
    time.time() - psutil.Process(os.getpid()).create_time().
  source_type: deduced
  unit: seconds
  update_freq: realtime
  tab: Where the data comes from
  section: aictl itself
  dynamic_source: true


