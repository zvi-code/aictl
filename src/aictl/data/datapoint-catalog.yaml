# ===============================================================
# SETTINGS
# ===============================================================

board.settings.row:
  explanation: >
    A setting of a tool: key, value in force, scope, file and line, risk
    flag and whether it is documented.
  source: >
    GET /api/settings/tools: orchestrator.full_tool_configs(), the complete
    settings records including defaults no file sets.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: By tool
  dynamic_source: false

procs.tool.config.extensions:
  explanation: >
    IDE extensions installed for this tool (e.g. VS Code extensions related
    to the AI tool).
  source: >
    Enumeration of ~/.vscode/extensions directories matching known patterns
    for the tool. Also from VS Code extensions list.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Extensions and plugins
  dynamic_source: false

board.settings.file:
  explanation: >
    Every file aictl reads for the settings view: stat facts, git state and
    how many settings read it.
  source: >
    api_handlers.settings_files over tool configs, audit sources and
    monitored folders. No file is opened.
  source_type: raw
  unit: bytes
  update_freq: on-collect
  tab: Settings
  section: Files
  dynamic_source: false

board.settings.hooks:
  explanation: >
    Whether aictl's hooks are installed for a tool.
  source: >
    GET /api/hooks-status, shown by HookStatus.js.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Hooks
  dynamic_source: false

procs.tool.config.mcp_servers:
  explanation: >
    MCP servers configured in this tool's settings. Lists server names as
    pills.
  source: >
    Parsed from tool MCP config (e.g. Claude Code's ~/.claude/settings.json
    mcpServers, or project .mcp.json files).
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: MCP servers
  dynamic_source: false

board.settings.model:
  explanation: >
    The model in force per tool and agent, with conflicts and pins.
  source: >
    GET /api/effective-models.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Model
  dynamic_source: false

procs.tool.config.model:
  explanation: >
    The AI model currently configured for this tool (e.g. claude-
    sonnet-4-5-20250514, gpt-4o). Extracted from the tool's settings file.
  source: >
    Parsed from tool config files defined in tool-configs.yaml. For Claude
    Code: settings.json → selectedModel. For Cursor: state.vscdb SQLite. For
    Copilot: settings.json model preferences.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Model
  otel_metric: aictl.config.model
  dynamic_source: false

procs.tool.config.features:
  explanation: >
    Feature flags and settings extracted from the tool's configuration. They
    show which capabilities are enabled or disabled.
  source: >
    Parsed from tool config files per the feature extraction rules of tool-
    configs.yaml. Boolean and string values.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Other settings
  dynamic_source: false

procs.tool.config.hints:
  explanation: >
    Actionable suggestions generated from analyzing the tool's current
    configuration. Warnings about suboptimal settings, missing features, or
    security concerns.
  source: >
    Generated by _generate_hints() in tool_config.py based on OTel config
    state, feature flags, and tool settings analysis.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Other settings
  dynamic_source: false

board.settings.permissions:
  explanation: >
    Allow, ask and deny rules per tool, derived from the permission
    settings.
  source: >
    settings/permissions.js derivePermissions over the same tool_configs
    rows.
  source_type: deduced
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Permissions
  dynamic_source: false

procs.tool.config.otel:
  explanation: >
    Whether OpenTelemetry export is enabled for this tool, and the
    configured exporter type and endpoint.
  source: >
    Parsed from tool config files. Looks for OTel-related settings
    (exporter, endpoint, protocol) in the tool's configuration.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Telemetry
  dynamic_source: false

procs.tool.config.otel_capture_content:
  explanation: >
    Whether OpenTelemetry is configured to capture message content (prompts
    and responses). Warning shown if enabled due to privacy.
  source: >
    From tool OTel config: captureContent or capture_content field in VS
    Code settings or tool-specific config files.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Telemetry
  dynamic_source: false

procs.tool.config.auto_update:
  explanation: >
    Whether automatic updates are enabled for the tool.
  source: >
    Claude Code: ~/.claude.json autoUpdates field. Other tools: from
    respective settings files per tool-configs.yaml.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Updates and startup
  dynamic_source: false

procs.tool.config.launch_at_startup:
  explanation: >
    Whether the tool is configured to launch automatically at system startup
    (login items on macOS, autostart on Linux).
  source: >
    macOS: detected via osascript querying login items or launchd plist.
    Linux: checks XDG autostart directory. Windows: checks startup folder.
  source_type: raw
  unit: count
  update_freq: on-collect
  tab: Settings
  section: Updates and startup
  dynamic_source: false
