<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aictl Kusto report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column (max 1120px); each analysis is a section with headline, capability row, chart, findings, query. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --ink: #0f1217;
  --ink-2: #4b515c;
  --muted: #7a808b;
  --grid: #e4e7eb;
  --axis: #c3c8cf;
  --border: rgba(15, 18, 23, 0.10);
  --code-bg: #eef0f3;
  --bar: #8a93a3;
  --accent: #2459c9;
  --series: #2a78d6;
  --series-wash: rgba(42, 120, 214, 0.13);
  --rest: #a3a9b3;
  --hl: #eb6834;
  --crit: #d03b3b;
  --c-b: #2a78d6; --c-e: #eb6834; --c-r: #1baf7a; --c-a: #eda100; --c-w: #e87ba4; --c-m: #008300; --c-o: #9aa0aa;
  --on-fill: #ffffff; --on-yellow: #0b0b0b;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #16191e; --ink: #eef0f3; --ink-2: #b8bdc6; --muted: #858b95;
    --grid: #252a31; --axis: #3a4048; --border: rgba(255, 255, 255, 0.10); --code-bg: #1c2026;
    --bar: #6f7887; --accent: #7da2f0; --series: #3987e5; --series-wash: rgba(57, 135, 229, 0.18);
    --rest: #5f6672; --hl: #d95926; --crit: #e05252;
    --c-b: #3987e5; --c-e: #d95926; --c-r: #199e70; --c-a: #c98500; --c-w: #d55181; --c-m: #2f9a2f; --c-o: #6c727c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #16191e; --ink: #eef0f3; --ink-2: #b8bdc6; --muted: #858b95;
  --grid: #252a31; --axis: #3a4048; --border: rgba(255, 255, 255, 0.10); --code-bg: #1c2026;
  --bar: #6f7887; --accent: #7da2f0; --series: #3987e5; --series-wash: rgba(57, 135, 229, 0.18);
  --rest: #5f6672; --hl: #d95926; --crit: #e05252;
  --c-b: #3987e5; --c-e: #d95926; --c-r: #199e70; --c-a: #c98500; --c-w: #d55181; --c-m: #2f9a2f; --c-o: #6c727c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; max-width: 22ch; }
h2 { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.15; max-width: 44ch; }
h3 { font-size: 17px; line-height: 1.3; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 68ch; font-size: 16px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-direction: column; gap: 18px; }

/* index of the five queries */
.index { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 112px; gap: 0; border-top: 1px solid var(--grid); }
.index a { display: contents; color: inherit; text-decoration: none; }
.index a > span { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--grid); display: flex; align-items: center; min-width: 0; }
.index a:hover > span, .index a:focus-visible > span { background: var(--code-bg); }
.index .ix-n { font-family: var(--f-mono); color: var(--muted); font-size: 13px; padding-left: 8px; }
.index .ix-t { font-weight: 500; }
.index .ix-c { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); justify-content: flex-end; text-align: right; }
.index .ix-s { white-space: nowrap; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.ix-bar { height: 6px; border-radius: 0 3px 3px 0; background: var(--series); flex: none; }
.window { font-size: 13px; color: var(--muted); max-width: 80ch; }

section.sec { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.sec-head { display: flex; flex-direction: column; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--code-bg); color: var(--ink); border: 1px solid var(--border); }
.runtime { font-family: var(--f-mono); font-size: 12px; color: var(--ink); display: inline-flex; gap: 6px; align-items: baseline; }
.runtime b { font-weight: 500; font-size: 14px; }
.meta .sep { color: var(--axis); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.panel-sub { font-size: 12.5px; color: var(--muted); }
.findings { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 28px; }
.findings li { border-top: 2px solid var(--ink); padding-top: 10px; font-size: 14.5px; color: var(--ink); min-width: 0; }
.caveat { font-size: 13px; color: var(--ink-2); max-width: 90ch; padding-left: 12px; border-left: 2px solid var(--axis); }
.caveat b { font-weight: 600; color: var(--ink); }
details.kql { border-top: 1px solid var(--grid); padding-top: 10px; }
details.kql summary { cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-2); list-style: none; display: flex; gap: 8px; align-items: center; }
details.kql summary::-webkit-details-marker { display: none; }
details.kql summary::before { content: "+"; display: inline-block; width: 14px; text-align: center; color: var(--muted); }
details.kql[open] summary::before { content: "\2212"; }
.code-wrap { position: relative; margin-top: 10px; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font-family: var(--f-mono); font-size: 12px; line-height: 1.55; color: var(--ink); tab-size: 4; }
pre.code .cm { color: var(--muted); }
pre.code .kw { color: var(--accent); }
.copy { position: absolute; top: 8px; right: 8px; }
button, .seg button { font: inherit; }
.btn { font-family: var(--f-mono); font-size: 12px; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--on-fill); }
.ln { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
canvas { display: block; max-width: 100%; }
svg { display: block; max-width: 100%; overflow: visible; }
svg text { font-family: var(--f-body); }
.ax text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.two-3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .two, .two-3 { grid-template-columns: minmax(0, 1fr); } }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.45; max-width: 300px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
#tip .tr { display: flex; gap: 8px; align-items: baseline; }
#tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .tr span { opacity: 0.75; }
#tip .tr.bad b { color: #ff9b9b; }
#tip .tr.h { font-family: var(--f-mono); font-size: 11px; opacity: 0.85; margin-bottom: 2px; }

/* section 1 */
.lens-cap { font-size: 12.5px; color: var(--ink-2); margin: 14px 0 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.motifs-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 6px 40px; }
.motifs { display: grid; align-content: start; grid-template-columns: auto auto minmax(40px, 1fr); gap: 6px 10px; align-items: center; font-size: 12.5px; }
.motif-chips { display: inline-flex; gap: 2px; }
.motif-chips .sw { width: 18px; height: 18px; font-size: 11px; }
.mbar { display: flex; align-items: center; gap: 6px; min-width: 0; }
.mbar i { display: block; height: 12px; border-radius: 0 3px 3px 0; background: var(--bar); }
.mbar span { font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.mtool { color: var(--ink-2); white-space: nowrap; }

/* section 2 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1px; background: var(--grid); border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 600; line-height: 1.1; }
.stat .v small { font-size: 16px; font-weight: 500; color: var(--ink-2); }
.stat .l { font-size: 12.5px; color: var(--ink-2); }
.chains { display: flex; flex-direction: column; gap: 0; }
.chain { display: grid; grid-template-columns: 18px 104px 64px minmax(0, 1fr) 72px 104px 72px minmax(0, 1fr) 72px 104px; align-items: center; gap: 0 6px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.chain.head { padding: 0 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.chain .pill { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 900px) { .chain { display: flex; flex-wrap: wrap; gap: 6px 4px; } .chain.head { display: none; } }
.chain:last-child { border-bottom: 0; }
.pill { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--axis); color: var(--ink); white-space: nowrap; }
.pill.file { border-radius: 3px; background: var(--code-bg); border-color: var(--border); }
.pill.mid { border-color: var(--hl); border-width: 1.5px; }
.arrow { color: var(--muted); font-size: 11px; white-space: nowrap; display: inline-flex; flex-direction: column; line-height: 1.25; }
@media (max-width: 900px) { .arrow { flex-direction: row; gap: 4px; } }
.arrow .gap { font-family: var(--f-mono); color: var(--ink-2); }
.arrow .gap.neg { color: var(--hl); }
.chain .idx { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 18px; }
.hf { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 70px; gap: 4px 12px; font-size: 12.5px; align-items: center; }
.hf .h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.hf .fn { font-family: var(--f-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hf .n { font-family: var(--f-mono); text-align: right; color: var(--ink-2); }
.hf .b { display: flex; align-items: center; gap: 5px; }
.hf .b i { display: block; height: 9px; background: var(--bar); border-radius: 0 3px 3px 0; }
.hf .b span { font-family: var(--f-mono); font-size: 11.5px; }

/* section 3 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.card .top { display: flex; gap: 8px; align-items: center; }
.badge { width: 20px; height: 20px; border-radius: 50%; background: var(--crit); color: #fff; font-family: var(--f-mono); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.card .when { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.card .cost { font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.card .cost small { font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.share { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: transparent; }
.share i { display: block; height: 100%; }
.card .who { color: var(--ink-2); }
.card .who b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }

/* section 5 */
.multi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .multi { grid-template-columns: minmax(0, 1fr); } }
.sm { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 8px; min-width: 0; }
.sm-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sm-id { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.sm-sub { font-size: 12px; color: var(--muted); }
.sm-run { text-align: right; }
.sm-run .v { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.05; }
.sm-run .v small { font-size: 12px; font-weight: 500; color: var(--ink-2); font-family: var(--f-body); }
.sm-run .m { font-size: 11.5px; color: var(--muted); }

@media (max-width: 640px) {
  body { padding-block: 24px 48px; font-size: 14.5px; }
  .wrap { gap: 44px; }
  .index { grid-template-columns: auto minmax(0, 1fr) 108px; }
  .index .ix-c { display: none; }
  .panel { padding: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .seg button, .btn { transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
}
/* a section with no data, or a query that failed */
.notice { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--axis); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.notice b { color: var(--ink); font-weight: 600; }
.notice.error { border-left-color: var(--crit); }
.notice pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-mono); font-size: 12px; color: var(--ink); background: var(--code-bg); border-radius: 6px; padding: 10px 12px; max-height: 280px; overflow: auto; }
.index .ix-s.bad { color: var(--crit); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow" id="eyebrow"></span>
    <h1>What Kusto can tell you about coding agents</h1>
    <p class="lede" id="lede"></p>
    <nav class="index" id="index" aria-label="The analyses"></nav>
    <p class="window" id="window"></p>
  </header>
</div>
<div id="tip" hidden></div>

<!-- One <template> per section: data-section is the name in SECTIONS (src/aictl/kusto/report/__init__.py),
     data-title the section's name on the page, data-caps the KQL features it shows. Its draw function is RENDER.NAME below. -->
<template data-section="dna" data-title="Session DNA" data-caps="scan,partition hint.strategy=native,row_number,prev">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="panel">
        <div class="panel-head">
          <div class="legend" id="dna-legend"></div>
          <div class="seg" role="group" aria-label="Strip scale">
            <button type="button" id="dna-fit" aria-pressed="true">Each fills the width</button>
            <button type="button" id="dna-same" aria-pressed="false">Same scale</button>
          </div>
        </div>
        <div><canvas id="dna-cv" aria-label="Tool-call strips for the sessions with the most calls"></canvas></div>
        <div class="lens-cap"><span class="panel-title" id="lens-title"></span><span class="panel-sub" id="lens-sub"></span></div>
        <div><canvas id="lens-cv" aria-label="Magnified window of calls"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-head" style="flex-direction:column;align-items:flex-start;gap:2px">
          <h3>Opening motifs</h3>
          <span class="panel-sub">First three call classes, all sessions with 10 or more calls (table 3)</span>
        </div>
        <div class="motifs-cols" id="motifs"></div>
      </div>
    </div>
    <ul class="findings" id="f-dna"></ul>
</template>
<template data-section="relay" data-title="Relay graph" data-caps="make-graph,graph-match,graph-mark-components,graph-to-table">
    <div class="stats" id="relay-stats"></div>
    <div class="panel">
      <div class="panel-head" style="flex-direction:column;align-items:flex-start;gap:2px">
        <h3 id="chains-title"></h3>
        <span class="panel-sub">graph-match pattern (a1)-[write]->(f1)&lt;-[read]-(a2)-[write]->(f2)&lt;-[read]-(a3), in time order. Gaps are between first touches. Orange ring: the middle agent.</span>
      </div>
      <div class="chains" id="chains"></div>
    </div>
    <div class="two-3">
      <div class="panel">
        <div class="panel-head">
          <div style="display:flex;flex-direction:column;gap:2px">
            <h3 id="g-title"></h3>
            <span class="panel-sub" id="g-sub"></span>
          </div>
          <div class="seg" role="group" aria-label="Files shown">
            <button type="button" id="g-hand" aria-pressed="true">Files with a handoff</button>
            <button type="button" id="g-all" aria-pressed="false">All shared files</button>
          </div>
        </div>
        <div class="legend" id="g-legend" style="margin-bottom:8px"></div>
        <div id="graph"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="panel">
          <div class="panel-head" style="flex-direction:column;align-items:flex-start;gap:2px">
            <h3>Top handoff files</h3>
            <span class="panel-sub">Distinct writer-to-reader pairs per file basename, all sessions (table 5)</span>
          </div>
          <div class="hf" id="hfiles"></div>
        </div>
        <div class="panel">
          <div class="panel-head" style="flex-direction:column;align-items:flex-start;gap:2px">
            <h3>Work items</h3>
            <span class="panel-sub" id="comps-sub"></span>
          </div>
          <div id="comps"></div>
        </div>
      </div>
    </div>
    <ul class="findings" id="f-relay"></ul>
    <p class="caveat" id="c-relay"></p>
</template>
<template data-section="cost" data-title="Cost anomalies explained" data-caps="make-series,series_decompose_anomalies,series_periods_detect">
    <div class="panel">
      <div class="panel-head">
        <div class="legend" id="cost-legend"></div>
        <span class="panel-sub">Hourly cost in USD, UTC, same scale in every panel</span>
      </div>
      <div id="cost-chart"></div>
    </div>
    <div class="cards" id="cost-cards"></div>
    <ul class="findings" id="f-cost"></ul>
    <p class="caveat" id="c-cost"></p>
</template>
<template data-section="slow" data-title="What slow requests share" data-caps="evaluate diffpatterns,percentile,toscalar">
    <div class="stats" id="slow-stats"></div>
    <div class="panel">
      <div class="panel-head">
        <div class="legend" id="slow-legend"></div>
        <span class="panel-sub">Share of requests that match each pattern, sorted by the gap</span>
      </div>
      <div id="slow-chart"></div>
    </div>
    <ul class="findings" id="f-slow"></ul>
    <p class="caveat" id="c-slow"></p>
</template>
<template data-section="context" data-title="Context sawtooth and runway" data-caps="serialize,prev,row_number,row_cumsum,series_fit_line">
    <div class="legend" id="ctx-legend"></div>
    <div class="multi" id="ctx-multi"></div>
    <ul class="findings" id="f-ctx"></ul>
